<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tiny World — Living Planet</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02030a;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            touch-action: none;
            user-select: none;
        }
        body {
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-container {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            left: max(14px, env(safe-area-inset-left));
            z-index: 50;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            background: rgba(0, 0, 0, 0.32);
            padding: 11px 15px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            min-width: 160px;
        }
        #ui-container h1 {
            margin: 0 0 3px 0;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        #ui-container p {
            margin: 2px 0;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.75);
        }
        #status-text {
            margin-top: 5px !important;
            font-weight: 700;
            color: #69f0ae;
            font-size: 11px;
        }
        #score-display {
            font-weight: 700;
            color: #ffd54f;
            font-size: 12px;
            margin-top: 3px;
        }
        #player-hp-display {
            font-weight: 700;
            color: #ef5350;
            font-size: 11px;
            margin-top: 2px;
        }
        #telemetry-panel {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            right: max(14px, env(safe-area-inset-right));
            z-index: 50;
            color: #fff;
            text-align: right;
            font-size: 10px;
            line-height: 1.5;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            background: rgba(0, 0, 0, 0.28);
            padding: 8px 12px;
            border-radius: 12px;
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            border: 1px solid rgba(255, 255, 255, 0.10);
        }
        #time-display {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            color: #fff;
            background: rgba(0, 0, 0, 0.28);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            pointer-events: none;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
            white-space: nowrap;
        }
        #virtual-joystick {
            position: fixed;
            left: max(22px, env(safe-area-inset-left));
            bottom: max(22px, env(safe-area-inset-bottom));
            width: 130px;
            height: 130px;
            z-index: 100;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
            border: 2px solid rgba(255, 255, 255, 0.20);
            box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.04), 0 10px 28px rgba(0, 0, 0, 0.38);
            touch-action: none;
        }
        #joystick-thumb {
            position: absolute;
            left: 38px;
            top: 38px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.98), rgba(220, 230, 235, 0.80));
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.50), inset 0 1px 2px rgba(255, 255, 255, 0.7);
            pointer-events: none;
            will-change: transform;
        }
        #camera-touch-zone {
            position: fixed;
            right: 0;
            top: 0;
            width: 48%;
            height: 100%;
            z-index: 20;
            pointer-events: auto;
            touch-action: none;
        }
        #mobile-controls {
            position: fixed;
            right: max(18px, env(safe-area-inset-right));
            bottom: max(22px, env(safe-area-inset-bottom));
            z-index: 110;
            width: 160px;
            height: 150px;
            pointer-events: none;
        }
        .mobile-button {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #fff;
            background: rgba(0, 0, 0, 0.34);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.30), inset 0 0 12px rgba(255, 255, 255, 0.04);
            font-size: 11px;
            font-weight: 700;
            pointer-events: auto;
            touch-action: none;
            transition: transform 0.08s ease, background 0.15s ease;
        }
        .mobile-button:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.18);
        }
        #jump-button {
            right: 0;
            bottom: 30px;
            width: 62px;
            height: 62px;
            font-size: 14px;
        }
        #attack-button {
            right: 68px;
            bottom: 76px;
            width: 54px;
            height: 54px;
            background: rgba(180, 40, 40, 0.45);
            border-color: rgba(255, 100, 100, 0.4);
            font-size: 11px;
        }
        #interact-button {
            right: 4px;
            bottom: 0;
            width: 44px;
            height: 28px;
            border-radius: 14px;
            font-size: 8px;
            opacity: 0;
            pointer-events: none;
        }
        #interact-button.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #camera-button {
            right: 52px;
            bottom: 2px;
            width: 44px;
            height: 28px;
            border-radius: 14px;
            font-size: 8px;
        }
        #interaction-prompt {
            position: fixed;
            left: 50%;
            bottom: 18%;
            transform: translate(-50%, 10px);
            z-index: 90;
            min-width: 140px;
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.20);
            color: #fff;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        #interaction-prompt.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }
        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 8px;
            height: 8px;
            margin-left: -4px;
            margin-top: -4px;
            z-index: 25;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        #crosshair.visible {
            opacity: 0.85;
        }
        #desktop-help {
            position: fixed;
            left: 50%;
            bottom: 14px;
            transform: translateX(-50%);
            z-index: 45;
            color: rgba(255, 255, 255, 0.6);
            font-size: 9px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.20);
            border-radius: 10px;
            pointer-events: none;
            text-align: center;
            max-width: 92%;
            white-space: nowrap;
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: radial-gradient(circle at center, #162b38 0%, #050b12 55%, #020308 100%);
            color: #fff;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #loading-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: 0.4px;
        }
        #loading-subtitle {
            font-size: 11px;
            opacity: 0.6;
            margin-bottom: 18px;
        }
        #loading-bar {
            width: 200px;
            height: 4px;
            overflow: hidden;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.12);
        }
        #loading-progress {
            width: 0%;
            height: 100%;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.85);
            transition: width 0.25s ease;
        }
        @media (max-width: 700px) {
            #ui-container {
                top: max(10px, env(safe-area-inset-top));
                left: max(10px, env(safe-area-inset-left));
                padding: 8px 10px;
                min-width: 120px;
            }
            #ui-container h1 {
                font-size: 13px;
            }
            #ui-container p {
                display: none;
            }
            #status-text {
                font-size: 9px;
                margin-top: 3px !important;
            }
            #score-display {
                font-size: 10px;
            }
            #player-hp-display {
                font-size: 9px;
            }
            #telemetry-panel {
                top: max(10px, env(safe-area-inset-top));
                right: max(10px, env(safe-area-inset-right));
                padding: 6px 8px;
                font-size: 9px;
            }
            #time-display {
                top: max(10px, env(safe-area-inset-top));
                font-size: 9px;
                padding: 5px 10px;
            }
            #desktop-help {
                display: none;
            }
            #crosshair {
                display: none;
            }
            #mobile-controls {
                width: 148px;
                height: 140px;
            }
            #jump-button {
                width: 54px;
                height: 54px;
                font-size: 12px;
                bottom: 28px;
            }
            #attack-button {
                width: 48px;
                height: 48px;
                font-size: 10px;
                right: 62px;
                bottom: 70px;
            }
            #interact-button {
                width: 40px;
                height: 24px;
                font-size: 7px;
            }
            #camera-button {
                width: 40px;
                height: 24px;
                font-size: 7px;
                right: 48px;
                bottom: 2px;
            }
        }
        @media (min-width: 701px) {
            #mobile-controls,
            #virtual-joystick {
                opacity: 0;
                pointer-events: none;
            }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div id="loading-title">🌍 Tiny World</div>
        <div id="loading-subtitle">Building a living planet...</div>
        <div id="loading-bar"><div id="loading-progress"></div></div>
    </div>

    <div id="ui-container">
        <h1>🌍 Tiny World</h1>
        <p><b>PC:</b> WASD · SPACE · E · C · J</p>
        <p><b>Mobile:</b> Joystick · Drag · Buttons</p>
        <div id="score-display">🏆 Score: 0</div>
        <div id="player-hp-display">❤️ HP: 100 / 100</div>
        <p id="status-text">Status: Exploring</p>
    </div>

    <div id="telemetry-panel">
        <div id="fps-counter">FPS: --</div>
        <div id="speed-meter">Speed: 0.0 m/s</div>
    </div>

    <div id="time-display">☀️ 12:00 · Day</div>

    <div id="camera-touch-zone"></div>
    <div id="virtual-joystick"><div id="joystick-thumb"></div></div>

    <div id="mobile-controls">
        <div id="attack-button" class="mobile-button">⚔️</div>
        <div id="jump-button" class="mobile-button">⬆</div>
        <div id="interact-button" class="mobile-button">USE</div>
        <div id="camera-button" class="mobile-button">CAM</div>
    </div>

    <div id="interaction-prompt">E · Interact</div>
    <div id="crosshair"></div>
    <div id="desktop-help">WASD · SPACE · E · C · J · Click NPC</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

        // ============================================================
        // CONFIG
        // ============================================================
        const CONFIG = {
            planetRadius: 180,
            playerRadius: 1.15,
            playerWalkSpeed: 3.8,
            playerReverseSpeed: 2.0,
            playerTurnSpeed: 2.35,
            acceleration: 8.0,
            deceleration: 10.0,
            cameraDistance: 13.5,
            cameraMinDistance: 4.2,
            cameraMaxDistance: 23.0,
            cameraHeight: 4.8,
            cameraLag: 9.0,
            cameraLookHeight: 2.0,
            cameraLookAhead: 3.0,
            cameraSensitivity: 0.005,
            cameraPitchMin: -0.72,
            cameraPitchMax: 1.0,
            jumpVelocity: 10.5,
            gravity: 24.0,
            maxStepHeight: 2.8,
            npcCount: 18,
            buildingCount: 26,
            treeCount: 120,
            rockCount: 70,
            cloudCount: 18,
            dayLengthSec: 180,
            riverSegments: 80,
            shadowMapSize: 1536,
            playerMaxHP: 100,
            npcMaxHP: 40,
            attackDamage: 12,
            attackRange: 5.5,
            respawnDelay: 6.0,
            doubleJumpCount: 2,
            sleepHealRate: 25,
            sleepSpeedMultiplier: 8,
        };

        // ============================================================
        // HELPERS
        // ============================================================
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function damp(current, target, lambda, dt) {
            return THREE.MathUtils.damp(current, target, lambda, dt);
        }

        function randomDirection() {
            const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
            return v.normalize();
        }

        function tangentDirection(normal) {
            let ref = new THREE.Vector3(0, 1, 0);
            if (Math.abs(ref.dot(normal)) > 0.92) ref.set(1, 0, 0);
            return new THREE.Vector3().crossVectors(ref, normal).normalize();
        }

        function projectOntoTangent(vector, normal) {
            return vector.clone().sub(normal.clone().multiplyScalar(vector.dot(normal))).normalize();
        }

        function orientToSurface(object, normal) {
            const tangent = tangentDirection(normal);
            const right = new THREE.Vector3().crossVectors(normal, tangent).normalize();
            const matrix = new THREE.Matrix4();
            matrix.makeBasis(right, normal, tangent);
            object.quaternion.setFromRotationMatrix(matrix);
        }

        function placeOnSurface(object, normal, height = 0) {
            object.position.copy(normal).multiplyScalar(CONFIG.planetRadius + height);
            orientToSurface(object, normal);
        }

        function slerpDirection(a, b, t) {
            const qa = new THREE.Quaternion(),
                qb = new THREE.Quaternion(),
                q = new THREE.Quaternion();
            qa.setFromUnitVectors(new THREE.Vector3(0, 0, 1), a);
            qb.setFromUnitVectors(new THREE.Vector3(0, 0, 1), b);
            q.slerpQuaternions(qa, qb, t);
            return new THREE.Vector3(0, 0, 1).applyQuaternion(q).normalize();
        }

        const npcNames = [
            "Aria", "Bodhi", "Cleo", "Dax", "Eira", "Finn", "Gwen", "Hugo",
            "Iris", "Jax", "Kira", "Leo", "Mira", "Noah", "Ora", "Pax",
            "Quinn", "Rex", "Sage", "Theo", "Uma", "Vera", "Wren", "Xander",
            "Yuki", "Zara", "Ash", "Briar", "Cade", "Demi", "Eli", "Faye"
        ];

        // ============================================================
        // SCENE, CAMERA, RENDERER
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x78caff);
        scene.fog = new THREE.FogExp2(0x78caff, 0.00155);

        const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.05, 3000);
        camera.position.set(0, 8, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.65));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        renderer.domElement.id = "tiny-world-canvas";
        document.body.appendChild(renderer.domElement);

        // CSS2D Renderer
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = "fixed";
        labelRenderer.domElement.style.top = "0";
        labelRenderer.domElement.style.left = "0";
        labelRenderer.domElement.style.pointerEvents = "none";
        labelRenderer.domElement.style.zIndex = "30";
        document.body.appendChild(labelRenderer.domElement);

        // ============================================================
        // LIGHTING
        // ============================================================
        const hemisphereLight = new THREE.HemisphereLight(0xbfeaff, 0x263d29, 1.35);
        scene.add(hemisphereLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 2.2);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = CONFIG.shadowMapSize;
        sunLight.shadow.mapSize.height = CONFIG.shadowMapSize;
        sunLight.shadow.camera.near = 30;
        sunLight.shadow.camera.far = 750;
        sunLight.shadow.camera.left = -260;
        sunLight.shadow.camera.right = 260;
        sunLight.shadow.camera.top = 260;
        sunLight.shadow.camera.bottom = -260;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        const moonLight = new THREE.DirectionalLight(0x91aaff, 0.35);
        scene.add(moonLight);

        // ============================================================
        // SUN / MOON
        // ============================================================
        const sunGroup = new THREE.Group();
        const sunCore = new THREE.Mesh(new THREE.SphereGeometry(13, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffffe6 }));
        sunGroup.add(sunCore);
        const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(17, 24, 24), new THREE.MeshBasicMaterial({ color: 0xffd58a,
            transparent: true, opacity: 0.18, depthWrite: false }));
        sunGroup.add(sunGlow);
        scene.add(sunGroup);

        const moon = new THREE.Mesh(new THREE.SphereGeometry(8, 32, 32), new THREE.MeshStandardMaterial({ color: 0xdce6f4,
            roughness: 1, metalness: 0 }));
        scene.add(moon);

        // ============================================================
        // PLANET
        // ============================================================
        const planetMaterial = new THREE.MeshStandardMaterial({ color: 0x4b9d55, roughness: 0.96, metalness: 0 });
        const planet = new THREE.Mesh(new THREE.SphereGeometry(CONFIG.planetRadius, 96, 96), planetMaterial);
        planet.receiveShadow = true;
        scene.add(planet);

        const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(CONFIG.planetRadius + 4.5, 64, 64),
            new THREE.MeshBasicMaterial({ color: 0x79cfff, transparent: true, opacity: 0.085, side: THREE.BackSide,
                depthWrite: false }));
        scene.add(atmosphere);

        // ============================================================
        // STARS
        // ============================================================
        const starCount = 6000;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const dir = randomDirection();
            const radius = 700 + Math.random() * 500;
            starPositions[i * 3] = dir.x * radius;
            starPositions[i * 3 + 1] = dir.y * radius;
            starPositions[i * 3 + 2] = dir.z * radius;
        }
        starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 1.6,
            transparent: true,
            opacity: 0,
            depthWrite: false,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending,
        });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // ============================================================
        // CLOUDS — smaller, higher
        // ============================================================
        const cloudGroup = new THREE.Group();
        scene.add(cloudGroup);
        const cloudMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 1,
            transparent: true,
            opacity: 0.65,
            depthWrite: false,
        });

        function createCloud() {
            const cloud = new THREE.Group();
            const count = 4 + Math.floor(Math.random() * 5);
            for (let i = 0; i < count; i++) {
                const r = 1.2 + Math.random() * 1.8;
                const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), cloudMaterial);
                puff.position.set(i * 2.4 + (Math.random() - 0.5) * 0.6, Math.random() * 0.8 - 0.3, (Math.random() - 0.5) * 2.0);
                puff.scale.y = 0.5 + Math.random() * 0.3;
                cloud.add(puff);
            }
            return cloud;
        }
        for (let i = 0; i < CONFIG.cloudCount; i++) {
            const cloud = createCloud();
            const normal = randomDirection();
            const altitude = 28 + Math.random() * 14;
            cloud.userData.normal = normal.clone();
            cloud.userData.altitude = altitude;
            cloud.userData.speed = 0.002 + Math.random() * 0.003;
            cloud.scale.setScalar(0.5 + Math.random() * 0.6);
            placeOnSurface(cloud, normal, altitude);
            cloudGroup.add(cloud);
        }

        // ============================================================
        // ENVIRONMENT GROUPS & OBSTACLES
        // ============================================================
        const environmentGroup = new THREE.Group();
        scene.add(environmentGroup);
        const obstacleList = [];

        function addObstacle(object, radius, type = "obstacle", extra = {}) {
            obstacleList.push({ object, position: object.position, radius, type, ...extra });
        }

        // ============================================================
        // BUILDING MATERIALS
        // ============================================================
        const buildingColors = [0x89939b, 0xa79b87, 0x8b7768, 0xb1a99a, 0x6f7c88, 0x9d6f56];
        const wallMaterials = buildingColors.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.88 }));
        const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x56423a, roughness: 0.92 });
        const doorMaterial = new THREE.MeshStandardMaterial({ color: 0x4c2e21, roughness: 0.82 });

        // ============================================================
        // HOUSE FACTORY — BIG DOOR (3.2 wide, 2.8 tall)
        // ============================================================
        const houses = [];

        function createHouse(index) {
            const house = new THREE.Group();
            house.userData.isHouse = true;
            house.userData.isOpen = false;
            house.userData.doorAngle = 0;
            house.userData.targetDoorAngle = 0;
            house.userData.hasBed = Math.random() < 0.5;
            house.userData.isSleeping = false;
            house.userData.sleepTimer = 0;

            const width = 6 + Math.random() * 2.5;
            const depth = 6 + Math.random() * 2.5;
            const height = 4.5 + Math.random() * 1.8;
            const material = wallMaterials[Math.floor(Math.random() * wallMaterials.length)];

            // Floor
            const floor = new THREE.Mesh(new THREE.BoxGeometry(width, 0.35, depth),
                new THREE.MeshStandardMaterial({ color: 0x776653, roughness: 0.95 }));
            floor.position.y = 0.18;
            floor.receiveShadow = true;
            floor.castShadow = true;
            house.add(floor);

            // Back wall
            const backWall = new THREE.Mesh(new THREE.BoxGeometry(width, height, 0.65), material);
            backWall.position.set(0, height / 2, depth / 2);
            backWall.castShadow = true;
            backWall.receiveShadow = true;
            house.add(backWall);

            // Left wall
            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.65, height, depth), material);
            leftWall.position.set(-width / 2, height / 2, 0);
            leftWall.castShadow = true;
            leftWall.receiveShadow = true;
            house.add(leftWall);

            // Right wall
            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.65, height, depth), material);
            rightWall.position.set(width / 2, height / 2, 0);
            rightWall.castShadow = true;
            rightWall.receiveShadow = true;
            house.add(rightWall);

            // Front wall — wider door opening (3.2)
            const doorW = 3.2;
            const doorH = 2.8;
            const fw = (width - doorW) / 2;
            const fl = new THREE.Mesh(new THREE.BoxGeometry(fw, height, 0.65), material);
            fl.position.set(-width / 2 + fw / 2, height / 2, -depth / 2);
            fl.castShadow = true;
            house.add(fl);
            const fr = new THREE.Mesh(new THREE.BoxGeometry(fw, height, 0.65), material);
            fr.position.set(width / 2 - fw / 2, height / 2, -depth / 2);
            fr.castShadow = true;
            house.add(fr);
            const ft = new THREE.Mesh(new THREE.BoxGeometry(doorW, height - doorH, 0.65), material);
            ft.position.set(0, doorH + (height - doorH) / 2, -depth / 2);
            ft.castShadow = true;
            house.add(ft);

            // Roof
            const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(width, depth) * 0.76, 2.4, 4), roofMaterial);
            roof.position.y = height + 1.2;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            house.add(roof);

            // Door
            const doorPivot = new THREE.Group();
            doorPivot.position.set(-doorW / 2 + 0.5, doorH / 2 + 0.1, -depth / 2 - 0.05);
            const door = new THREE.Mesh(new THREE.BoxGeometry(doorW - 0.2, doorH - 0.2, 0.18), doorMaterial);
            door.position.x = (doorW - 0.2) / 2;
            door.castShadow = true;
            doorPivot.add(door);
            house.add(doorPivot);
            house.userData.door = doorPivot;
            house.userData.doorWidth = doorW;
            house.userData.doorHeight = doorH;

            // Windows
            const winMat = new THREE.MeshStandardMaterial({ color: 0x82cde9, emissive: 0x153a4b, emissiveIntensity: 0.3,
                roughness: 0.25, metalness: 0.1 });
            const wl = new THREE.Mesh(new THREE.BoxGeometry(1.25, 1.25, 0.10), winMat);
            wl.position.set(-2.2, 2.25, -depth / 2 - 0.06);
            house.add(wl);
            const wr = wl.clone();
            wr.position.x = 2.2;
            house.add(wr);

            // Interior light
            const interiorLight = new THREE.PointLight(0xffd39a, 0.0, 15);
            interiorLight.position.set(0, 3.1, 0);
            house.add(interiorLight);
            house.userData.interiorLight = interiorLight;

            // Furniture
            const furnMat = new THREE.MeshStandardMaterial({ color: 0x634633, roughness: 0.9 });
            const table = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.65, 1.2), furnMat);
            table.position.set(0, 0.65, 1.0);
            table.castShadow = true;
            house.add(table);

            // Bed
            if (house.userData.hasBed) {
                const bedGroup = new THREE.Group();
                const bedMat = new THREE.MeshStandardMaterial({ color: 0x58738b, roughness: 0.9 });
                const bedFrame = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.5, 1.8), bedMat);
                bedFrame.position.y = 0.25;
                bedFrame.castShadow = true;
                bedGroup.add(bedFrame);
                const pillowMat = new THREE.MeshStandardMaterial({ color: 0xd4c9b8, roughness: 0.95 });
                const pillow = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.5), pillowMat);
                pillow.position.set(-0.8, 0.6, 0);
                bedGroup.add(pillow);
                const blanketMat = new THREE.MeshStandardMaterial({ color: 0x6d8b9e, roughness: 0.9 });
                const blanket = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.15, 1.2), blanketMat);
                blanket.position.set(0.3, 0.55, 0);
                bedGroup.add(blanket);
                bedGroup.position.set(-1.8, 0.3, 1.6);
                house.add(bedGroup);
                house.userData.bedGroup = bedGroup;
                house.userData.bedPos = new THREE.Vector3(-1.8, 0.3, 1.6);
            }

            house.userData.width = width;
            house.userData.depth = depth;
            house.userData.normal = new THREE.Vector3();
            return house;
        }

        // ============================================================
        // SPAWN HOUSES
        // ============================================================
        for (let i = 0; i < CONFIG.buildingCount; i++) {
            const normal = randomDirection();
            const house = createHouse(i);
            house.userData.normal.copy(normal);
            placeOnSurface(house, normal, 0);
            environmentGroup.add(house);
            houses.push(house);
            addObstacle(house, 4.8, "house", { house });
        }

        // ============================================================
        // TREES
        // ============================================================
        const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x60432d, roughness: 1 });
        const treeLeafMat = new THREE.MeshStandardMaterial({ color: 0x247d3a, roughness: 0.95 });
        for (let i = 0; i < CONFIG.treeCount; i++) {
            const normal = randomDirection();
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.48, 3.1, 8), treeTrunkMat);
            trunk.position.y = 1.55;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            tree.add(trunk);
            const crown = new THREE.Mesh(new THREE.DodecahedronGeometry(2.1, 1), treeLeafMat);
            crown.position.y = 4.0;
            crown.scale.y = 1.05;
            crown.castShadow = true;
            crown.receiveShadow = true;
            tree.add(crown);
            tree.scale.setScalar(0.75 + Math.random() * 0.55);
            placeOnSurface(tree, normal, 0);
            environmentGroup.add(tree);
            addObstacle(tree, 1.35, "tree");
        }

        // ============================================================
        // ROCKS — walkable
        // ============================================================
        const rockMat = new THREE.MeshStandardMaterial({ color: 0x73766f, roughness: 1 });
        for (let i = 0; i < CONFIG.rockCount; i++) {
            const normal = randomDirection();
            const size = 0.75 + Math.random() * 1.7;
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(size, 0), rockMat);
            const sy = 0.38 + Math.random() * 0.55;
            rock.scale.y = sy;
            rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            rock.castShadow = true;
            rock.receiveShadow = true;
            const height = size * sy * 1.4;
            placeOnSurface(rock, normal, height * 0.3);
            environmentGroup.add(rock);
            addObstacle(rock, size * 0.85, "rock", { height });
        }

        // ============================================================
        // ROAD + STREETLIGHTS
        // ============================================================
        const roadGroup = new THREE.Group();
        scene.add(roadGroup);
        const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x5a5a5a, roughness: 0.95, metalness: 0 });
        const sidewalkMaterial = new THREE.MeshStandardMaterial({ color: 0x8a8a7a, roughness: 1 });
        const roadLineMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, emissive: 0x888888, emissiveIntensity: 0.1 });

        const roadPoints = [];
        const roadSegments = 60;
        for (let i = 0; i <= roadSegments; i++) {
            const t = i / roadSegments;
            const angle1 = t * Math.PI * 2;
            const angle2 = t * Math.PI * 2 * 0.7 + 0.8;
            const x = Math.cos(angle1) * Math.sin(angle2) * 0.7;
            const y = Math.sin(angle1) * 0.45 + 0.3;
            const z = Math.cos(angle2) * 0.85;
            const dir = new THREE.Vector3(x, y, z).normalize();
            roadPoints.push(dir);
        }

        function buildRoadRibbon(width, heightOffset, material) {
            const verts = [];
            const idx = [];
            for (let i = 0; i < roadPoints.length; i++) {
                const p = roadPoints[i];
                const prev = roadPoints[Math.max(0, i - 1)];
                const next = roadPoints[Math.min(roadPoints.length - 1, i + 1)];
                const tangent = next.clone().sub(prev).normalize();
                const side = new THREE.Vector3().crossVectors(p, tangent).normalize();
                const left = p.clone().add(side.clone().multiplyScalar(width)).normalize();
                const right = p.clone().add(side.clone().multiplyScalar(-width)).normalize();
                left.multiplyScalar(CONFIG.planetRadius + heightOffset);
                right.multiplyScalar(CONFIG.planetRadius + heightOffset);
                verts.push(left.x, left.y, left.z);
                verts.push(right.x, right.y, right.z);
            }
            for (let i = 0; i < roadPoints.length - 1; i++) {
                const a = i * 2,
                    b = a + 1,
                    c = a + 2,
                    d = a + 3;
                idx.push(a, b, c);
                idx.push(b, d, c);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
            geo.setIndex(idx);
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, material);
        }

        const roadWidth = 3.2;
        const road = buildRoadRibbon(roadWidth, 0.22, roadMaterial);
        road.receiveShadow = true;
        roadGroup.add(road);

        const sidewalk = buildRoadRibbon(roadWidth + 1.2, 0.15, sidewalkMaterial);
        sidewalk.receiveShadow = true;
        roadGroup.add(sidewalk);

        const centerLine = buildRoadRibbon(0.2, 0.25, roadLineMat);
        centerLine.receiveShadow = true;
        roadGroup.add(centerLine);

        // Streetlights
        const lightPoleMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, metalness: 0.6, roughness: 0.3 });
        const lightHeadMat = new THREE.MeshStandardMaterial({ color: 0xffeecc, emissive: 0xffdd77, emissiveIntensity: 0.6 });
        for (let i = 0; i < roadPoints.length; i += 3) {
            const p = roadPoints[i];
            const pos = p.clone().multiplyScalar(CONFIG.planetRadius + 0.3);
            const normal = p.clone();
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.22, 1.8, 6), lightPoleMat);
            pole.position.copy(pos).add(normal.clone().multiplyScalar(0.9));
            pole.castShadow = true;
            orientToSurface(pole, normal);
            roadGroup.add(pole);

            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.1), lightPoleMat);
            const fwd = tangentDirection(normal);
            const right = new THREE.Vector3().crossVectors(normal, fwd).normalize();
            arm.position.copy(pos).add(normal.clone().multiplyScalar(1.8)).add(right.clone().multiplyScalar(0.35));
            arm.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), right);
            roadGroup.add(arm);

            const lightHead = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), lightHeadMat);
            lightHead.position.copy(pos).add(normal.clone().multiplyScalar(1.8)).add(right.clone().multiplyScalar(0.7));
            roadGroup.add(lightHead);

            const glow = new THREE.PointLight(0xffdd77, 0.6, 12);
            glow.position.copy(pos).add(normal.clone().multiplyScalar(1.8)).add(right.clone().multiplyScalar(0.7));
            roadGroup.add(glow);
        }

        // ============================================================
        // RIVER — vibrant blue
        // ============================================================
        const riverGroup = new THREE.Group();
        scene.add(riverGroup);
        const riverMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x1a8fc4,
            roughness: 0.15,
            metalness: 0.05,
            transmission: 0.10,
            transparent: true,
            opacity: 0.88,
            side: THREE.DoubleSide,
        });
        const riverBankMat = new THREE.MeshStandardMaterial({ color: 0x6f7250, roughness: 1 });
        const riverStart = new THREE.Vector3(0.45, 0.55, 0.70).normalize();
        const riverEnd = new THREE.Vector3(-0.75, 0.42, -0.52).normalize();
        const riverPoints = [];
        for (let i = 0; i < CONFIG.riverSegments; i++) {
            const t = i / (CONFIG.riverSegments - 1);
            let dir = slerpDirection(riverStart, riverEnd, t);
            const side = tangentDirection(dir);
            const wave = Math.sin(t * Math.PI * 8) * 0.025;
            dir.add(side.multiplyScalar(wave));
            dir.normalize();
            riverPoints.push(dir);
        }

        function buildRibbon(width, heightOffset, material) {
            const verts = [];
            const idx = [];
            for (let i = 0; i < riverPoints.length; i++) {
                const p = riverPoints[i];
                const prev = riverPoints[Math.max(0, i - 1)];
                const next = riverPoints[Math.min(riverPoints.length - 1, i + 1)];
                const tangent = next.clone().sub(prev).normalize();
                const side = new THREE.Vector3().crossVectors(p, tangent).normalize();
                const left = p.clone().add(side.clone().multiplyScalar(width)).normalize();
                const right = p.clone().add(side.clone().multiplyScalar(-width)).normalize();
                left.multiplyScalar(CONFIG.planetRadius + heightOffset);
                right.multiplyScalar(CONFIG.planetRadius + heightOffset);
                verts.push(left.x, left.y, left.z);
                verts.push(right.x, right.y, right.z);
            }
            for (let i = 0; i < riverPoints.length - 1; i++) {
                const a = i * 2,
                    b = a + 1,
                    c = a + 2,
                    d = a + 3;
                idx.push(a, b, c);
                idx.push(b, d, c);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
            geo.setIndex(idx);
            geo.computeVertexNormals();
            return new THREE.Mesh(geo, material);
        }

        const riverWidth = 5.4;
        const river = buildRibbon(riverWidth, 0.28, riverMaterial);
        riverGroup.add(river);
        const riverBankLeft = buildRibbon(riverWidth + 0.8, 0.16, riverBankMat);
        const riverBankRight = buildRibbon(riverWidth + 0.8, 0.15, riverBankMat);
        riverGroup.add(riverBankLeft);
        riverGroup.add(riverBankRight);

        // ============================================================
        // BRIDGE
        // ============================================================
        const bridgeGroup = new THREE.Group();
        scene.add(bridgeGroup);

        const midIdx = Math.floor(riverPoints.length / 2);
        const midPoint = riverPoints[midIdx];
        const bridgePos = midPoint.clone().multiplyScalar(CONFIG.planetRadius + 0.4);

        const bridgeDeckMat = new THREE.MeshStandardMaterial({ color: 0x8a7a6a, roughness: 0.9 });
        const bridgeRailMat = new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: 0.8 });

        const bridgeLen = 8;
        const bridgeW = 3.5;
        const deck = new THREE.Mesh(new THREE.BoxGeometry(bridgeLen, 0.4, bridgeW), bridgeDeckMat);
        deck.position.copy(bridgePos).add(midPoint.clone().multiplyScalar(0.2));
        deck.castShadow = true;
        deck.receiveShadow = true;
        orientToSurface(deck, midPoint);
        bridgeGroup.add(deck);

        for (let side = -1; side <= 1; side += 2) {
            const rail = new THREE.Mesh(new THREE.BoxGeometry(bridgeLen, 0.8, 0.15), bridgeRailMat);
            const offset = new THREE.Vector3().crossVectors(midPoint, tangentDirection(midPoint)).normalize()
                .multiplyScalar(side * bridgeW / 2);
            rail.position.copy(bridgePos).add(midPoint.clone().multiplyScalar(0.2)).add(offset);
            rail.position.add(midPoint.clone().multiplyScalar(0.4));
            rail.castShadow = true;
            orientToSurface(rail, midPoint);
            bridgeGroup.add(rail);

            for (let j = -3; j <= 3; j++) {
                const post = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8, 6), bridgeRailMat);
                const along = tangentDirection(midPoint).clone().multiplyScalar(j * 1.0);
                post.position.copy(bridgePos).add(midPoint.clone().multiplyScalar(0.2)).add(offset).add(along);
                post.position.add(midPoint.clone().multiplyScalar(0.4));
                orientToSurface(post, midPoint);
                bridgeGroup.add(post);
            }
        }

        // ============================================================
        // CHARACTER FACTORY
        // ============================================================
        function createCharacter(bodyColor) {
            const container = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.82 });
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd1b3, roughness: 0.9 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x303844, roughness: 0.95 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.5, 0.72), bodyMat);
            torso.position.y = 1.25;
            torso.castShadow = true;
            container.add(torso);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 18, 18), skinMat);
            head.position.y = 2.52;
            head.castShadow = true;
            container.add(head);

            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.42), pantsMat);
            leftLeg.position.set(-0.25, 0.45, 0);

            container.add(leftLeg);

            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.42), pantsMat);
            rightLeg.position.set(0.25, 0.45, 0);
            rightLeg.castShadow = true;
            container.add(rightLeg);

            const armMat = bodyMat;
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.15, 0.28), armMat);
            leftArm.position.set(-0.65, 1.35, 0);
            leftArm.castShadow = true;
            container.add(leftArm);

            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.15, 0.28), armMat);
            rightArm.position.set(0.65, 1.35, 0);

            container.userData = { leftLeg, rightLeg, leftArm, rightArm, torso, head };

        // ============================================================
        // PLAYER
        // ============================================================
        const player = new THREE.Group();
        scene.add(player);
        const playerMesh = createCharacter(0xe53935);
        player.add(playerMesh);

        let playerNormal = new THREE.Vector3(0, 1, 0);

        let currentSpeed = 0;
        let walkTime = 0;

        let jumpHeight = 0;

        let jumpCount = 0;
        let currentWaterFactor = 1.0;
        let playerHP = CONFIG.playerMaxHP;
        let score = 0;
        let isSleeping = false;

        function updatePlayerTransform() {
            player.position.copy(playerNormal).multiplyScalar(CONFIG.planetRadius + jumpHeight);
            const forward = projectOntoTangent(playerForward, playerNormal);
            const right = new THREE.Vector3().crossVectors(playerNormal, forward).normalize();
            const matrix = new THREE.Matrix4();
            matrix.makeBasis(right, playerNormal, forward);
            player.quaternion.setFromRotationMatrix(matrix);

        updatePlayerTransform();

        // ============================================================

        for (let i = 0; i < CONFIG.npcCount; i++) {
