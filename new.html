                radius: 1.05,
                name,
                maxHP: CONFIG.npcMaxHP + Math.floor(Math.random() * 15),
                hp: CONFIG.npcMaxHP + Math.floor(Math.random() * 15),
                isKO: false,
                koTimer: 0,
                isAggro: false,
                aggroTimer: 0,
                attackCooldown: 0,
                label: null,
                labelDiv: null,
                deathAnimTime: 0,
                isDying: false,
                originalY: 0,
            };

            npc.position.copy(normal).multiplyScalar(CONFIG.planetRadius);
            orientToSurface(npc, normal);
            environmentGroup.add(npc);

            // Small label — name + HP in one line
            const labelDiv = document.createElement("div");
            labelDiv.style.cssText = labelStyle;
            labelDiv.innerHTML = `${name} <span style="color:#ff6b6b;font-size:7px;">❤️${npcData.hp}</span>`;
            const label = new CSS2DObject(labelDiv);
            label.position.set(0, 3.0, 0);
            npc.add(label);
            npcData.label = label;
            npcData.labelDiv = labelDiv;
            labelDiv.style.opacity = "0";

            npcList.push(npcData);
        }

        // ============================================================
        // INPUT STATE
        // ============================================================
        const keys = {};
        window.addEventListener("keydown", e => {
            const key = e.key.toLowerCase();
            keys[key] = true;
            if (key === " " || key === "spacebar") { e.preventDefault();
                jump(); }
            if (key === "e") { interact(); }
            if (key === "c") { cycleCameraMode(); }
            if (key === "j") { performAttack(); }
        }, { passive: false });
        window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

        // ============================================================
        // JOYSTICK
        // ============================================================
        const joystick = document.getElementById("virtual-joystick");
        const joystickThumb = document.getElementById("joystick-thumb");
        let joystickActive = false,
            joystickPointerId = null,
            joystickX = 0,
            joystickY = 0;

        function resetJoystick() {
            joystickActive = false;
            joystickPointerId = null;
            joystickX = 0;
            joystickY = 0;
            joystickThumb.style.transform = "translate(0px, 0px)";
        }

        function updateJoystick(cx, cy) {
            const rect = joystick.getBoundingClientRect();
            const cx2 = rect.left + rect.width / 2;
            const cy2 = rect.top + rect.height / 2;
            let dx = cx - cx2,
                dy = cy - cy2;
            const max = 41;
            const dist = Math.hypot(dx, dy);
            if (dist > max) { dx = dx / dist * max;
                dy = dy / dist * max; }
            joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickX = dx / max;
            joystickY = dy / max;
        }
        joystick.addEventListener("pointerdown", e => {
            e.preventDefault();
            joystickActive = true;
            joystickPointerId = e.pointerId;
            joystick.setPointerCapture(e.pointerId);
            updateJoystick(e.clientX, e.clientY);
        }, { passive: false });
        joystick.addEventListener("pointermove", e => {
            if (!joystickActive || e.pointerId !== joystickPointerId) return;
            updateJoystick(e.clientX, e.clientY);
        });
        joystick.addEventListener("pointerup", resetJoystick);
        joystick.addEventListener("pointercancel", resetJoystick);

        // ============================================================
        // CAMERA INPUT
        // ============================================================
        const cameraTouchZone = document.getElementById("camera-touch-zone");
        let cameraDragging = false,
            cameraPointerId = null,
            lastCameraX = 0,
            lastCameraY = 0;
        let cameraYaw = 0,
            cameraPitch = 0.22;
        let cameraDistance = CONFIG.cameraDistance;
        let cameraMode = 0;
        const cameraModeNames = ["Third Person", "Close", "First Person"];

        cameraTouchZone.addEventListener("pointerdown", e => {
            if (e.pointerType === "mouse" && e.button !== 0) return;
            cameraDragging = true;
            cameraPointerId = e.pointerId;
            lastCameraX = e.clientX;
            lastCameraY = e.clientY;
            cameraTouchZone.setPointerCapture(e.pointerId);
        });
        cameraTouchZone.addEventListener("pointermove", e => {
            if (!cameraDragging || e.pointerId !== cameraPointerId) return;
            const dx = e.clientX - lastCameraX,
                dy = e.clientY - lastCameraY;
            lastCameraX = e.clientX;
            lastCameraY = e.clientY;
            cameraYaw -= dx * CONFIG.cameraSensitivity;
            cameraPitch += dy * CONFIG.cameraSensitivity;
            cameraPitch = clamp(cameraPitch, CONFIG.cameraPitchMin, CONFIG.cameraPitchMax);
        });
        cameraTouchZone.addEventListener("pointerup", () => { cameraDragging = false; });
        cameraTouchZone.addEventListener("pointercancel", () => { cameraDragging = false; });
        window.addEventListener("wheel", e => {
            cameraDistance += e.deltaY * 0.015;
            cameraDistance = clamp(cameraDistance, CONFIG.cameraMinDistance, CONFIG.cameraMaxDistance);
        }, { passive: true });

        // ============================================================
        // MOBILE BUTTONS
        // ============================================================
        document.getElementById("jump-button").addEventListener("pointerdown", e => { e.preventDefault();
            jump(); }, { passive: false });
        document.getElementById("interact-button").addEventListener("pointerdown", e => { e.preventDefault();
            interact(); }, { passive: false });
        document.getElementById("camera-button").addEventListener("pointerdown", e => { e.preventDefault();
            cycleCameraMode(); }, { passive: false });
        document.getElementById("attack-button").addEventListener("pointerdown", e => { e.preventDefault();
            performAttack(); }, { passive: false });

        // ============================================================
        // JUMP
        // ============================================================
        function jump() {
            if (isSleeping) return;
            if (isGrounded) {
                verticalVelocity = CONFIG.jumpVelocity;
                isGrounded = false;
                jumpCount = 1;
                return;
            }
            if (jumpCount < CONFIG.doubleJumpCount) {
                verticalVelocity = CONFIG.jumpVelocity * 0.85;
                jumpCount++;
            }
        }

        function updateJump(dt) {
            if (isGrounded) {
                jumpHeight = 0;
                verticalVelocity = 0;
                jumpCount = 0;
                return;
            }
            verticalVelocity -= CONFIG.gravity * dt;
            jumpHeight += verticalVelocity * dt;
            if (jumpHeight <= 0) {
                jumpHeight = 0;
                verticalVelocity = 0;
                isGrounded = true;
                jumpCount = 0;
            }
            updatePlayerTransform();
        }

        // ============================================================
        // PLAYER MOVEMENT — fixed door collision
        // ============================================================
        function getMovementInput() {
            let turn = 0,
                walk = 0;
            if (keys["a"] || keys["arrowleft"]) turn += 1;
            if (keys["d"] || keys["arrowright"]) turn -= 1;
            if (keys["w"] || keys["arrowup"]) walk += 1;
            if (keys["s"] || keys["arrowdown"]) walk -= 1;
            if (joystickActive) {
                turn = -joystickX;
                walk = -joystickY;
            }
            return { turn, walk };
        }

        function checkObstacleCollision(candidateNormal) {
            const cp = candidateNormal.clone().multiplyScalar(CONFIG.planetRadius);
            for (const ob of obstacleList) {
                if (ob.type === "house") {
                    const house = ob.house;
                    if (house.userData.isOpen) {
                        const local = cp.clone();
                        house.worldToLocal(local);
                        const d = house.userData.depth;
                        const doorW = house.userData.doorWidth || 3.2;
                        // Door area: wide and deep enough for player
                        const nearDoor = Math.abs(local.x) < doorW * 0.8 && local.z < -d * 0.5 + 3.0;
                        const inside = Math.abs(local.x) < house.userData.width * 0.4 && Math.abs(local.z) < d * 0.4;
                        if (inside || nearDoor) continue;
                    }
                    const dist = cp.distanceTo(ob.position);
                    if (dist < CONFIG.playerRadius + ob.radius) return ob;
                } else if (ob.type === "rock") {
                    const dist = cp.distanceTo(ob.position);
                    const rockHeight = ob.height || 1.0;
                    const pWorld = player.position.clone();
                    const rPos = ob.position.clone();
                    const normal = rPos.clone().normalize();
                    const heightAbove = (pWorld.dot(normal) - rPos.dot(normal)) * 1.0;
                    if (heightAbove > rockHeight * 0.3) {
                        const horizDist = cp.distanceTo(ob.position);
                        if (horizDist < ob.radius + CONFIG.playerRadius * 0.8) continue;
                    }
                    if (dist < CONFIG.playerRadius + ob.radius) {
                        const stepUp = jumpHeight + 0.5;
                        if (stepUp > rockHeight * 0.6) continue;
                        return ob;
                    }
                } else {
                    const dist = cp.distanceTo(ob.position);
                    if (dist < CONFIG.playerRadius + ob.radius) return ob;
                }
            }
            return null;
        }

        function attemptMove(dist) {
            const movement = playerForward.clone().multiplyScalar(dist);
            const cw = player.position.clone().add(movement);
            const cn = cw.normalize();
            const collision = checkObstacleCollision(cn);
            if (collision && collision.type === "rock" && isGrounded) {
                const rockHeight = collision.height || 1.0;
                if (rockHeight <= CONFIG.maxStepHeight) {
                    jumpHeight = Math.max(jumpHeight, rockHeight * 0.5);
                    playerNormal.copy(cn);
                    playerForward = projectOntoTangent(playerForward, playerNormal);
                    updatePlayerTransform();
                    return true;
                }
                return false;
            }
            if (collision) return false;
            playerNormal.copy(cn);
            playerForward = projectOntoTangent(playerForward, playerNormal);
            updatePlayerTransform();
            return true;
        }

        function updatePlayer(dt) {
            if (isSleeping) {
                sleepTimer += dt;
                if (sleepTimer > 1.0) {
                    sleepTimer = 0;
                    playerHP = Math.min(playerHP + CONFIG.sleepHealRate, CONFIG.playerMaxHP);
                    updatePlayerUI();
                }
                elapsedTime += dt * CONFIG.sleepSpeedMultiplier;
                return;
            }

            // Attack animation — smooth punch
            if (attackAnimTime > 0) {
                attackAnimTime -= dt * 7;
                if (attackAnimTime < 0) attackAnimTime = 0;
                const progress = 1 - attackAnimTime;
                const swing = Math.sin(progress * Math.PI) * 1.5;
                const pm = playerMesh.userData;
                pm.rightArm.rotation.x = -1.2 + swing * 0.9;
                pm.rightArm.rotation.z = swing * 0.3;
                pm.leftArm.rotation.x = -0.8 + swing * 0.2;
            }

            const input = getMovementInput();
            let turn = input.turn,
                walk = input.walk;

            if (Math.abs(turn) > 0.03) {
                const rot = new THREE.Quaternion().setFromAxisAngle(playerNormal, turn * CONFIG.playerTurnSpeed * dt);
                playerForward.applyQuaternion(rot);
                playerForward = projectOntoTangent(playerForward, playerNormal);
            }

            let targetSpeed = 0;
            if (walk > 0) targetSpeed = CONFIG.playerWalkSpeed * walk;
            else if (walk < 0) targetSpeed = CONFIG.playerReverseSpeed * walk;
            if (currentWaterFactor < 1) targetSpeed *= currentWaterFactor;

            const rate = Math.abs(targetSpeed) > Math.abs(currentSpeed) ? CONFIG.acceleration : CONFIG.deceleration;
            currentSpeed = damp(currentSpeed, targetSpeed, rate, dt);

            if (Math.abs(currentSpeed) > 0.005) {
                const moved = attemptMove(currentSpeed * dt);
                if (!moved) currentSpeed = damp(currentSpeed, 0, 18, dt);
            }

            if (Math.abs(currentSpeed) > 0.08 && isGrounded) {
                walkTime += dt * Math.abs(currentSpeed) * 1.55;
            }

            const wa = Math.min(1, Math.abs(currentSpeed) / CONFIG.playerWalkSpeed);
            const swing = Math.sin(walkTime * 8.5) * 0.42 * wa;
            const pm = playerMesh.userData;
            if (attackAnimTime <= 0) {
                pm.leftLeg.rotation.x = swing;
                pm.rightLeg.rotation.x = -swing;
                pm.leftArm.rotation.x = -swing * 0.55;
                pm.rightArm.rotation.x = swing * 0.55;
            }

            const status = document.getElementById("status-text");
            if (!isGrounded) { status.textContent = "Status: Jumping";
                status.style.color = "#fff59d"; } else if (currentWaterFactor < 1) { status.textContent = "Status: In Water";
                status.style.color = "#81d4fa"; } else if (Math.abs(currentSpeed) < 0.05) { status.textContent = "Status: Idle";
                status.style.color = "#90caf9"; } else { status.textContent = "Status: Exploring";
                status.style.color = "#69f0ae"; }

            document.getElementById("speed-meter").textContent = `Speed: ${Math.abs(currentSpeed).toFixed(1)} m/s`;
        }

        // ============================================================
        // PLAYER UI
        // ============================================================
        function updatePlayerUI() {
            document.getElementById("player-hp-display").textContent = `❤️ HP: ${Math.floor(playerHP)} / ${CONFIG.playerMaxHP}`;
            document.getElementById("score-display").textContent = `🏆 Score: ${score}`;
        }

        // ============================================================
        // COMBAT — with smooth hit animation
        // ============================================================
        let attackCooldownTimer = 0;

        function performAttack() {
            if (attackCooldownTimer > 0 || isSleeping) return;
            attackCooldownTimer = 0.35;
            attackAnimTime = 1.0;

            const pPos = player.position.clone();
            let closest = null,
                closestDist = Infinity;
            for (const npc of npcList) {
                if (npc.isKO || npc.isDying) continue;
                const dist = pPos.distanceTo(npc.object.position);
                if (dist < CONFIG.attackRange && dist < closestDist) {
                    closest = npc;
                    closestDist = dist;
                }
            }
            if (closest) {
                closest.hp -= CONFIG.attackDamage;
                closest.isAggro = true;
                closest.aggroTimer = 4;

                // Hit flash
                closest.mesh.children.forEach(child => {
                    if (child.isMesh) {
                        const orig = child.material.color.clone();
                        child.material.color.set(0xff4444);
                        setTimeout(() => { child.material.color.copy(orig); }, 150);
                    }
                });

                if (closest.hp <= 0) {
                    closest.hp = 0;
                    closest.isKO = true;
                    closest.isDying = true;
                    closest.deathAnimTime = 0;
                    closest.koTimer = CONFIG.respawnDelay;
                    score += 10;
                    updatePlayerUI();
                    const koDiv = closest.labelDiv;
                    koDiv.innerHTML = `${closest.name} 💀`;
                    koDiv.style.borderColor = "#ff4444";
                } else {
                    const div = closest.labelDiv;
                    div.innerHTML = `${closest.name} <span style="color:#ff6b6b;font-size:7px;">❤️${closest.hp}</span>`;
                }
                updatePlayerUI();
            }
        }

        // Click NPC to attack
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        renderer.domElement.addEventListener("click", (e) => {
            if (e.button !== 0) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const targets = [];
            for (const npc of npcList) {
                if (npc.isKO) continue;
                targets.push(npc.object);
            }
            const hits = raycaster.intersectObjects(targets, true);
            if (hits.length > 0) {
                let hitObj = hits[0].object;
                let npcData = null;
                for (const npc of npcList) {
                    if (npc.object === hitObj || npc.object.children.includes(hitObj) ||
                        npc.mesh === hitObj || npc.mesh.children.includes(hitObj)) {
                        npcData = npc;
                        break;
                    }
                }
                if (npcData && !npcData.isKO && !npcData.isDying) {
                    performAttack();
                }
            }
        });

        // ============================================================
        // NPC UPDATE — label visibility based on camera frustum
        // ============================================================
        function updateNPCs(dt) {
            const pPos = player.position.clone();
            camera.updateMatrixWorld();
            const frustum = new THREE.Frustum();
            frustum.setFromProjectionMatrix(new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse));
            const camDir = new THREE.Vector3();
            camera.getWorldDirection(camDir);

            for (const npc of npcList) {
                // Death animation
                if (npc.isDying && npc.isKO) {
                    npc.deathAnimTime += dt * 3;
                    if (npc.deathAnimTime < 1) {
                        const angle = npc.deathAnimTime * 1.2;
                        npc.object.rotation.z = angle * 0.6;
                        npc.object.position.y = npc.originalY - angle * 0.3;
                    }
                    npc.koTimer -= dt;
                    if (npc.koTimer <= 0) {
                        npc.isKO = false;
                        npc.isDying = false;
                        npc.hp = npc.maxHP;
                        npc.object.rotation.z = 0;
                        const newNormal = randomDirection();
                        npc.normal.copy(newNormal);
                        npc.object.position.copy(newNormal).multiplyScalar(CONFIG.planetRadius);
                        orientToSurface(npc.object, newNormal);
                        npc.forward = projectOntoTangent(tangentDirection(newNormal), newNormal);
                        const div = npc.labelDiv;
                        div.innerHTML = `${npc.name} <span style="color:#ff6b6b;font-size:7px;">❤️${npc.hp}</span>`;
                        div.style.borderColor = "rgba(255,255,255,0.06)";
                        npc.aggroTimer = 0;
                        npc.isAggro = false;
                        npc.originalY = npc.object.position.y;
                    }
                    continue;
                }

                // Label visibility: only when in front of camera AND within frustum
                const npcPos = npc.object.position.clone();
                const toNpc = npcPos.clone().sub(camera.position).normalize();
                const dot = camDir.dot(toNpc);
                const visible = dot > 0.15 && frustum.containsPoint(npcPos);
                if (npc.labelDiv) {
                    npc.labelDiv.style.opacity = visible ? "1" : "0";
                }

                if (npc.isKO) continue;

                if (npc.attackCooldown > 0) npc.attackCooldown -= dt;

                if (npc.isAggro) {
                    npc.aggroTimer -= dt;
                    if (npc.aggroTimer <= 0) npc.isAggro = false;
                }

                npc.timer -= dt;
                if (npc.timer <= 0) {
                    npc.timer = 2 + Math.random() * 4;
                    npc.turnTarget = (Math.random() - 0.5) * 1.2;
                }

                let targetForward = npc.forward.clone();
                if (npc.isAggro) {
                    const toPlayer = pPos.clone().sub(npc.object.position).normalize();
                    const proj = projectOntoTangent(toPlayer, npc.normal);
                    if (proj.length() > 0.1) {
                        targetForward = proj;
                        npc.turnTarget = 0;
                    }
                    const dist = pPos.distanceTo(npc.object.position);
                    if (dist < 2.5 && npc.attackCooldown <= 0) {
                        npc.attackCooldown = 1.2;
                        playerHP = Math.max(0, playerHP - 8);
                        updatePlayerUI();
                        if (playerHP <= 0) {
                            playerHP = CONFIG.playerMaxHP;
                            const newNormal = randomDirection();
                            playerNormal.copy(newNormal);
                            playerForward = projectOntoTangent(tangentDirection(newNormal), newNormal);
                            updatePlayerTransform();
                            updatePlayerUI();
                            document.getElementById("status-text").textContent = "Status: Respawned";
                            document.getElementById("status-text").style.color = "#ff6b6b";
                            setTimeout(() => {
                                document.getElementById("status-text").textContent = "Status: Exploring";
                                document.getElementById("status-text").style.color = "#69f0ae";
                            }, 1500);
                        }
                    }
                }

                npc.currentTurn = damp(npc.currentTurn, npc.turnTarget, 2.5, dt);
                const rot = new THREE.Quaternion().setFromAxisAngle(npc.normal, npc.currentTurn * dt);
                npc.forward.applyQuaternion(rot);
                npc.forward = projectOntoTangent(npc.forward, npc.normal);

                if (npc.isAggro) {
                    npc.forward.lerp(targetForward, dt * 2);
                    npc.forward = projectOntoTangent(npc.forward, npc.normal);
                }

                const speed = npc.isAggro ? npc.speed * 1.5 : npc.speed;
                const movement = npc.forward.clone().multiplyScalar(speed * dt);
                const nextWorld = npc.object.position.clone().add(movement);
                const nextNormal = nextWorld.normalize();
                let blocked = false;
                const testPos = nextNormal.clone().multiplyScalar(CONFIG.planetRadius);
                for (const ob of obstacleList) {
                    if (ob.type === "house") continue;
                    if (ob.type === "rock") {
                        const d2 = testPos.distanceTo(ob.position);
                        if (d2 < 0.8 + ob.radius) { blocked = true; break; }
                        continue;
                    }
                    if (testPos.distanceTo(ob.position) < 0.8 + ob.radius) { blocked = true; break; }
                }
                if (!blocked) {
                    npc.normal.copy(nextNormal);
                    npc.forward = projectOntoTangent(npc.forward, npc.normal);
                    npc.object.position.copy(npc.normal).multiplyScalar(CONFIG.planetRadius);
                    orientToSurface(npc.object, npc.normal);
                } else {
                    npc.turnTarget *= -1;
                }

                npc.walkCounter += dt * speed * 2.1;
                const sw2 = Math.sin(npc.walkCounter * 6) * 0.34;
                const nm = npc.mesh.userData;
                if (nm) {
                    nm.leftLeg.rotation.x = sw2;
                    nm.rightLeg.rotation.x = -sw2;
                }

                if (npc.label) {
                    npc.label.position.set(0, 3.0 + (npc.isKO ? 0.5 : 0), 0);
                }
            }
        }

        // ============================================================
        // HOUSE DOORS + BED
        // ============================================================
        let nearbyHouse = null;
        let nearbyBed = false;

        function updateHouseDoors(dt) {
            for (const house of houses) {
                house.userData.doorAngle = damp(house.userData.doorAngle, house.userData.targetDoorAngle, 7, dt);
                house.userData.door.rotation.y = house.userData.doorAngle;
                const targetLight = house.userData.isOpen ? 1.8 : 0;
                house.userData.interiorLight.intensity = damp(house.userData.interiorLight.intensity, targetLight, 5, dt);

                if (house.userData.hasBed && house.userData.bedGroup) {
                    const bedWorld = new THREE.Vector3();
                    house.userData.bedGroup.getWorldPosition(bedWorld);
                    const dist = player.position.distanceTo(bedWorld);
                    if (dist < 2.5 && house.userData.isOpen) {
                        house.userData.isSleeping = true;
                        nearbyBed = true;
                        if (!isSleeping && house.userData.isOpen) {
                            isSleeping = true;
                            sleepTimer = 0;
                            document.getElementById("status-text").textContent = "💤 Sleeping...";
                            document.getElementById("status-text").style.color = "#b39ddb";
                        }
                    } else {
                        house.userData.isSleeping = false;
                        if (isSleeping && nearbyBed) {
                            isSleeping = false;
                            document.getElementById("status-text").textContent = "Status: Awake";
                            document.getElementById("status-text").style.color = "#69f0ae";
                        }
                        nearbyBed = false;
                    }
                }
            }
            if (isSleeping && !nearbyBed) {
                isSleeping = false;
                document.getElementById("status-text").textContent = "Status: Awake";
                document.getElementById("status-text").style.color = "#69f0ae";
            }
        }

        function findNearestInteraction() {
            const pPos = getPlayerWorldPosition();
            let closest = null,
                closestDist = Infinity;
            for (const house of houses) {
                const dist = pPos.distanceTo(house.position);
                if (dist < 8.5 && dist < closestDist) {
                    closest = house;
                    closestDist = dist;
                }
            }
            return { house: closest, distance: closestDist };
        }

        function getPlayerWorldPosition() { return player.position.clone(); }

        function updateInteractionUI() {
            const result = findNearestInteraction();
            nearbyHouse = result.house;
            const prompt = document.getElementById("interaction-prompt");
            const mobileBtn = document.getElementById("interact-button");
            if (nearbyHouse && result.distance < 8.5) {
                const action = nearbyHouse.userData.isOpen ? "CLOSE DOOR" : "OPEN DOOR";
                prompt.textContent = `E · ${action}`;
                prompt.classList.add("visible");
                mobileBtn.textContent = nearbyHouse.userData.isOpen ? "CLOSE" : "USE";
                mobileBtn.classList.add("visible");
            } else {
                prompt.classList.remove("visible");
                mobileBtn.classList.remove("visible");
                nearbyHouse = null;
            }
        }

        function interact() {
            if (isSleeping) {
                isSleeping = false;
                document.getElementById("status-text").textContent = "Status: Awake";
                document.getElementById("status-text").style.color = "#69f0ae";
                return;
            }
            if (!nearbyHouse) return;
            nearbyHouse.userData.isOpen = !nearbyHouse.userData.isOpen;
            nearbyHouse.userData.targetDoorAngle = nearbyHouse.userData.isOpen ? -Math.PI * 0.52 : 0;
        }

        // ============================================================
        // CAMERA MODE
        // ============================================================
        function cycleCameraMode() {
            cameraMode = (cameraMode + 1) % 3;
            if (cameraMode === 0) cameraDistance = CONFIG.cameraDistance;
            else if (cameraMode === 1) cameraDistance = 7.0;
            else cameraDistance = 0.15;
            document.getElementById("crosshair").classList.toggle("visible", cameraMode === 2);
            document.getElementById("desktop-help").textContent =
                `Camera: ${cameraModeNames[cameraMode]} · C to switch`;
        }

        // ============================================================
        // CAMERA RIG
        // ============================================================
        const desiredCameraPos = new THREE.Vector3();
        const desiredLookAt = new THREE.Vector3();

        function updateCamera(dt) {
            const up = playerNormal.clone();
            const forward = projectOntoTangent(playerForward, up);
            const right = new THREE.Vector3().crossVectors(up, forward).normalize();

            const yawQ = new THREE.Quaternion().setFromAxisAngle(up, cameraYaw);
            let cameraBack = forward.clone().negate().applyQuaternion(yawQ);
            cameraBack = projectOntoTangent(cameraBack, up);
            const cameraRight = new THREE.Vector3().crossVectors(up, cameraBack).normalize();
            const pitchQ = new THREE.Quaternion().setFromAxisAngle(cameraRight, cameraPitch);
            cameraBack.applyQuaternion(pitchQ);
            cameraBack = cameraBack.normalize();

            let dist = cameraMode === 2 ? 0.08 : cameraDistance;

            if (cameraMode === 2) {
                desiredCameraPos.copy(player.position).add(up.clone().multiplyScalar(2.35)).add(forward.clone()
                .multiplyScalar(0.05));
            } else {
                desiredCameraPos.copy(player.position).add(up.clone().multiplyScalar(CONFIG.cameraHeight)).add(cameraBack
                    .multiplyScalar(dist));
            }

            const smooth = 1 - Math.exp(-CONFIG.cameraLag * dt);
            camera.position.lerp(desiredCameraPos, smooth);
            camera.up.copy(up);

            if (cameraMode === 2) {
                desiredLookAt.copy(player.position).add(up.clone().multiplyScalar(2.25)).add(forward.clone()
                .multiplyScalar(7));
            } else {
                desiredLookAt.copy(player.position).add(up.clone().multiplyScalar(CONFIG.cameraLookHeight)).add(forward
                    .clone().multiplyScalar(CONFIG.cameraLookAhead));
            }
            camera.lookAt(desiredLookAt);
        }

        // ============================================================
        // WATER
        // ============================================================
        function updateWaterState() {
            let closestDist = Infinity;
            const pd = playerNormal.clone();
            for (const pt of riverPoints) {
                const angle = Math.acos(clamp(pd.dot(pt), -1, 1));
                const arc = angle * CONFIG.planetRadius;
                if (arc < closestDist) closestDist = arc;
            }
            currentWaterFactor = closestDist < 5.4 ? 0.58 : 1.0;
        }

        let riverTime = 0;

        function updateRiver(dt) {
            riverTime += dt;
            const pos = river.geometry.attributes.position;
            for (let i = 0; i < riverPoints.length; i++) {
                const pt = riverPoints[i];
                const prev = riverPoints[Math.max(0, i - 1)];
                const next = riverPoints[Math.min(riverPoints.length - 1, i + 1)];
                const tangent = next.clone().sub(prev).normalize();
                const side = new THREE.Vector3().crossVectors(pt, tangent).normalize();
                const wave = Math.sin(riverTime * 2.1 + i * 0.34) * 0.16;
                const left = pt.clone().add(side.clone().multiplyScalar(5.4)).normalize().multiplyScalar(CONFIG
                    .planetRadius + 0.28 + wave);
                const right = pt.clone().add(side.clone().multiplyScalar(-5.4)).normalize().multiplyScalar(CONFIG
                    .planetRadius + 0.28 + wave);
                pos.setXYZ(i * 2, left.x, left.y, left.z);
                pos.setXYZ(i * 2 + 1, right.x, right.y, right.z);
            }
            pos.needsUpdate = true;
            river.geometry.computeVertexNormals();
        }

        // ============================================================
        // DAY/NIGHT
        // ============================================================
        let elapsedTime = 0;
        const skyColors = {
            night: new THREE.Color(0x02040e),
            deepBlue: new THREE.Color(0x101f4b),
            purple: new THREE.Color(0x513a78),
            pink: new THREE.Color(0xd36d7f),
            peach: new THREE.Color(0xf39b72),
            orange: new THREE.Color(0xf0a052),
            golden: new THREE.Color(0xf6c878),
            day: new THREE.Color(0x78caff)
        };
        const currentSky = new THREE.Color();
        const currentSunColor = new THREE.Color();
        const currentHemisphereSky = new THREE.Color();
        const currentHemisphereGround = new THREE.Color();

        function interpolateColorStops(stops, value) {
            if (value <= stops[0].position) return stops[0].color.clone();
            if (value >= stops[stops.length - 1].position) return stops[stops.length - 1].color.clone();
            for (let i = 0; i < stops.length - 1; i++) {
                const a = stops[i],
                    b = stops[i + 1];
                if (value >= a.position && value <= b.position) {
                    const range = b.position - a.position;
                    let t = (value - a.position) / range;
                    t = THREE.MathUtils.smootherstep(t, 0, 1);
                    return a.color.clone().lerp(b.color, t);
                }
            }
            return stops[stops.length - 1].color.clone();
        }
        const skyStops = [
            { position: 0.00, color: skyColors.night },
            { position: 0.18, color: skyColors.deepBlue },
            { position: 0.32, color: skyColors.purple },
            { position: 0.42, color: skyColors.pink },
            { position: 0.49, color: skyColors.peach },
            { position: 0.55, color: skyColors.golden },
            { position: 0.64, color: skyColors.day },
            { position: 1.00, color: skyColors.day }
        ];

        function getSkyForElevation(elevation) {
            let n = (elevation + 1) / 2;
            n = clamp(n, 0, 1);
            return interpolateColorStops(skyStops, n);
        }

        function updateDayNight(dt) {
            if (!isSleeping) elapsedTime += dt;
            const progress = (elapsedTime % CONFIG.dayLengthSec) / CONFIG.dayLengthSec;
            const angle = progress * Math.PI * 2 - Math.PI / 2;
            const orbit = 460;
            const sx = Math.cos(angle) * orbit,
                sy = Math.sin(angle) * orbit,
                sz = 170;
            sunLight.position.set(sx, sy, sz);
            sunGroup.position.set(sx, sy, sz);
            moonLight.position.set(-sx, -sy, -sz);
            moon.position.set(-sx, -sy, -sz);
            const elevation = Math.sin(angle);
            const daylight = THREE.MathUtils.smoothstep(elevation, -0.18, 0.25);
            const nightFactor = 1 - daylight;
            const twilight = 1 - Math.min(1, Math.abs(elevation) / 0.24);
            const twilightPos = Math.max(0, twilight);

            currentSky.copy(getSkyForElevation(elevation));
            scene.background.lerp(currentSky, 1 - Math.exp(-7 * dt));
            scene.fog.color.lerp(currentSky, 1 - Math.exp(-7 * dt));

            const dayIntensity = 0.10 + daylight * 2.15;
            sunLight.intensity = damp(sunLight.intensity, dayIntensity, 5, dt);
            const moonIntensity = 0.025 + nightFactor * 0.38;
            moonLight.intensity = damp(moonLight.intensity, moonIntensity, 4, dt);
            const hemiIntensity = 0.28 + daylight * 1.22 + twilightPos * 0.12;
            hemisphereLight.intensity = damp(hemisphereLight.intensity, hemiIntensity, 4, dt);

            const sunWarm = clamp(twilightPos * 1.25, 0, 1);
            currentSunColor.setRGB(1.0, 0.78 + 0.18 * daylight, 0.43 + 0.52 * daylight);
            sunLight.color.lerp(currentSunColor, 1 - Math.exp(-5 * dt));
            sunCore.material.color.lerp(currentSunColor, 1 - Math.exp(-5 * dt));
            sunGlow.material.color.copy(currentSunColor);

            currentHemisphereSky.setRGB(0.22 + daylight * 0.52, 0.28 + daylight * 0.63, 0.48 + daylight * 0.49);
            currentHemisphereGround.setRGB(0.025 + daylight * 0.12, 0.045 + daylight * 0.18, 0.035 + daylight * 0.08);
            hemisphereLight.color.lerp(currentHemisphereSky, 1 - Math.exp(-4 * dt));
            hemisphereLight.groundColor.lerp(currentHemisphereGround, 1 - Math.exp(-4 * dt));

            const starTarget = THREE.MathUtils.smoothstep(-0.10, -0.32, elevation);
            stars.material.opacity = damp(stars.material.opacity, starTarget * 0.95, 3.5, dt);
            atmosphere.material.opacity = damp(atmosphere.material.opacity, 0.055 + daylight * 0.045 + twilightPos * 0.045, 3,
                dt);

            const cloudWarm = twilightPos * 0.5;
            cloudMaterial.color.setRGB(1.0, 1.0 - cloudWarm * 0.12, 1.0 - cloudWarm * 0.22);

            const totalMinutes = progress * 24 * 60;
            const hours = Math.floor(totalMinutes / 60);
            const minutes = Math.floor(totalMinutes % 60);
            let period = elevation > 0.10 ? "Day" : elevation > -0.12 ? "Twilight" : "Night";
            let icon = period === "Day" ? "☀️" : period === "Night" ? "🌙" : "🌅";
            document.getElementById("time-display").textContent =
                `${icon} ${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")} · ${period}`;
        }

        // ============================================================
        // CLOUDS
        // ============================================================
        function updateClouds(dt) {
            for (const cloud of cloudGroup.children) {
                const normal = cloud.userData.normal;
                normal.applyAxisAngle(tangentDirection(normal), cloud.userData.speed * dt);
                normal.normalize();
                cloud.userData.normal = normal;
                placeOnSurface(cloud, normal, cloud.userData.altitude);
            }
        }

        let worldAnimTime = 0;

        function updateEnvironment(dt) {
            worldAnimTime += dt;
            for (const cloud of cloudGroup.children) {
                const sw = 1 + Math.sin(worldAnimTime * 0.45 + cloud.id) * 0.008;
                cloud.scale.multiplyScalar(sw);
            }
            stars.rotation.y += dt * 0.001;
        }

        // ============================================================
        // MAIN LOOP
        // ============================================================
        const clock = new THREE.Clock();
        let frameCount = 0,
            fpsTimer = performance.now();

        function mainLoop() {
            requestAnimationFrame(mainLoop);
            const dt = Math.min(clock.getDelta(), 0.05);

            if (attackCooldownTimer > 0) attackCooldownTimer -= dt;

            updatePlayer(dt);
            updateJump(dt);
            updateNPCs(dt);
            updateHouseDoors(dt);
            updateWaterState();
            updateRiver(dt);
            updateDayNight(dt);
            updateClouds(dt);
            updateEnvironment(dt);
            updateInteractionUI();
            updateCamera(dt);
            updatePlayerUI();

            frameCount++;
            const now = performance.now();
            if (now - fpsTimer >= 500) {
                const fps = Math.round(frameCount * 1000 / (now - fpsTimer));
                document.getElementById("fps-counter").textContent = `FPS: ${fps}`;
                frameCount = 0;
                fpsTimer = now;
            }

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // ============================================================
        // RESIZE
        // ============================================================
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.65));
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================
        // INIT
        // ============================================================
        cameraMode = 0;
        cameraYaw = 0;
        cameraPitch = 0.22;
        cameraDistance = CONFIG.cameraDistance;

        const loadingProgress = document.getElementById("loading-progress");
        let fakeProgress = 0;
        const loadingInterval = setInterval(() => {
            fakeProgress += 8 + Math.random() * 10;
            fakeProgress = Math.min(fakeProgress, 100);
            loadingProgress.style.width = `${fakeProgress}%`;
            if (fakeProgress >= 100) {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    document.getElementById("loading-screen").classList.add("hidden");
                }, 300);
            }
        }, 90);

        // Apply label styles
        for (const npc of npcList) {
            if (npc.labelDiv) {
                npc.labelDiv.style.cssText = labelStyle;
            }
        }

        mainLoop();

        console.log("🌍 Tiny World loaded!");
        console.log("🎮 WASD · SPACE · E · C · J");
        console.log("🚪 Bigger doors (3.2 wide) — you can enter!");
        console.log("🏷️ NPC labels are small, clean, and only show when visible");
        console.log("🌊 River is bright and visible");
        console.log("☁️ Clouds are smaller and higher");
        console.log("⚔️ Smooth hit animation on attack (J or tap ⚔️)");
    </script>
</body>
</html>
