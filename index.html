        ) {

            if (
                value <=
                stops[0].position
            ) {

                return stops[0].color.clone();

            }


            if (
                value >=
                stops[
                    stops.length - 1
                ].position
            ) {

                return stops[
                    stops.length - 1
                ].color.clone();

            }


            for (
                let i = 0;
                i < stops.length - 1;
                i++
            ) {

                const a =
                    stops[i];


                const b =
                    stops[i + 1];


                if (
                    value >= a.position &&
                    value <= b.position
                ) {

                    const range =
                        b.position -
                        a.position;


                    let t =
                        (
                            value -
                            a.position
                        ) /
                        range;


                    t =
                        THREE.MathUtils.smootherstep(
                            t,
                            0,
                            1
                        );


                    return a.color
                        .clone()
                        .lerp(
                            b.color,
                            t
                        );

                }

            }


            return stops[
                stops.length - 1
            ].color.clone();

        }


        const skyStops = [

            {
                position: 0.00,
                color: skyColors.night
            },

            {
                position: 0.18,
                color: skyColors.deepBlue
            },

            {
                position: 0.32,
                color: skyColors.purple
            },

            {
                position: 0.42,
                color: skyColors.pink
            },

            {
                position: 0.49,
                color: skyColors.peach
            },

            {
                position: 0.55,
                color: skyColors.golden
            },

            {
                position: 0.64,
                color: skyColors.day
            },

            {
                position: 1.00,
                color: skyColors.day
            }

        ];


        function getSkyForElevation(
            elevation
        ) {

            /*
             * Map -1..1 into 0..1,
             * with long smooth daylight.
             */

            let normalized =
                (elevation + 1) /
                2;


            normalized =
                clamp(
                    normalized,
                    0,
                    1
                );


            return interpolateColorStops(
                skyStops,
                normalized
            );

        }


        function updateDayNight(
            dt
        ) {

            elapsedTime += dt;


            const progress =
                (
                    elapsedTime %
                    CONFIG.dayLengthSec
                ) /
                CONFIG.dayLengthSec;


            const angle =
                progress *
                Math.PI *
                2 -
                Math.PI / 2;


            const orbitRadius =
                460;


            const sunX =
                Math.cos(angle) *
                orbitRadius;


            const sunY =
                Math.sin(angle) *
                orbitRadius;


            const sunZ =
                170;


            sunLight.position.set(
                sunX,
                sunY,
                sunZ
            );


            sunGroup.position.set(
                sunX,
                sunY,
                sunZ
            );


            moonLight.position.set(
                -sunX,
                -sunY,
                -sunZ
            );


            moon.position.set(
                -sunX,
                -sunY,
                -sunZ
            );


            const elevation =
                Math.sin(angle);


            const daylight =
                THREE.MathUtils.smoothstep(
                    elevation,
                    -0.18,
                    0.25
                );


            const nightFactor =
                1 -
                daylight;


            /*
             * Smooth sunset / sunrise warm factor.
             */

            const twilight =
                1 -
                Math.min(
                    1,
                    Math.abs(
                        elevation
                    ) / 0.24
                );


            const twilightPositive =
                Math.max(
                    0,
                    twilight
                );


            currentSky.copy(
                getSkyForElevation(
                    elevation
                )
            );


            /*
             * Smooth background.
             */

            scene.background.lerp(
                currentSky,
                1 -
                Math.exp(
                    -7 * dt
                )
            );


            scene.fog.color.lerp(
                currentSky,
                1 -
                Math.exp(
                    -7 * dt
                )
            );


            /*
             * Sun light.
             */

            const daylightIntensity =
                0.10 +
                daylight *
                2.15;


            sunLight.intensity =
                damp(
                    sunLight.intensity,
                    daylightIntensity,
                    5,
                    dt
                );


            /*
             * Moon.
             */

            const moonIntensity =
                0.025 +
                nightFactor *
                0.38;


            moonLight.intensity =
                damp(
                    moonLight.intensity,
                    moonIntensity,
                    4,
                    dt
                );


            /*
             * Hemisphere.
             */

            const hemisphereIntensity =
                0.28 +
                daylight *
                1.22 +
                twilightPositive *
                0.12;


            hemisphereLight.intensity =
                damp(
                    hemisphereLight.intensity,
                    hemisphereIntensity,
                    4,
                    dt
                );


            /*
             * Sun colour.
             */

            const sunWarm =
                clamp(
                    twilightPositive *
                    1.25,
                    0,
                    1
                );


            currentSunColor
                .setRGB(
                    1.0,
                    0.78 +
                    0.18 *
                    daylight,
                    0.43 +
                    0.52 *
                    daylight
                );


            sunLight.color.lerp(
                currentSunColor,
                1 -
                Math.exp(
                    -5 * dt
                )
            );


            sunCore.material.color
                .lerp(
                    currentSunColor,
                    1 -
                    Math.exp(
                        -5 * dt
                    )
                );


            sunGlow.material.color
                .copy(
                    currentSunColor
                );


            /*
             * Hemisphere colours.
             */

            currentHemisphereSky
                .setRGB(

                    0.22 +
                    daylight * 0.52,

                    0.28 +
                    daylight * 0.63,

                    0.48 +
                    daylight * 0.49

                );


            currentHemisphereGround
                .setRGB(

                    0.025 +
                    daylight * 0.12,

                    0.045 +
                    daylight * 0.18,

                    0.035 +
                    daylight * 0.08

                );


            hemisphereLight.color.lerp(
                currentHemisphereSky,
                1 -
                Math.exp(
                    -4 * dt
                )
            );


            hemisphereLight.groundColor.lerp(
                currentHemisphereGround,
                1 -
                Math.exp(
                    -4 * dt
                )
            );


            /*
             * Stars fade naturally.
             */

            const starTarget =
                THREE.MathUtils.smoothstep(
                    -0.10,
                    -0.32,
                    elevation
                );


            stars.material.opacity =
                damp(
                    stars.material.opacity,
                    starTarget *
                    0.95,
                    3.5,
                    dt
                );


            /*
             * Atmosphere.
             */

            atmosphere.material.opacity =
                damp(

                    atmosphere.material.opacity,

                    0.055 +
                    daylight *
                    0.045 +
                    twilightPositive *
                    0.045,

                    3,

                    dt

                );


            /*
             * Clouds get warmer near sunset.
             */

            const cloudWarm =
                twilightPositive *
                0.5;


            cloudMaterial.color.setRGB(

                1.0,

                1.0 -
                cloudWarm * 0.12,

                1.0 -
                cloudWarm * 0.22

            );


            /*
             * Time UI.
             */

            const totalMinutes =
                progress *
                24 *
                60;


            const hours =
                Math.floor(
                    totalMinutes / 60
                );


            const minutes =
                Math.floor(
                    totalMinutes % 60
                );


            let period;


            if (
                elevation > 0.10
            ) {

                period =
                    "Day";

            }
            else if (
                elevation >
                -0.12
            ) {

                period =
                    "Twilight";

            }
            else {

                period =
                    "Night";

            }


            let icon;


            if (
                period === "Day"
            ) {

                icon = "☀️";

            }
            else if (
                period === "Night"
            ) {

                icon = "🌙";

            }
            else {

                icon = "🌅";

            }


            document.getElementById(
                "time-display"
            ).textContent =

                `${icon} ` +
                `${String(hours).padStart(2, "0")}:` +
                `${String(minutes).padStart(2, "0")} · ` +
                period;

        }


        /* =========================================================
           36. CLOUD MOTION
           ========================================================= */

        function updateClouds(
            dt
        ) {

            for (
                const cloud
                of cloudGroup.children
            ) {

                const normal =
                    cloud.userData.normal;


                const rotation =
                    cloud.userData.speed *
                    dt;


                normal.applyAxisAngle(
                    tangentDirection(
                        normal
                    ),
                    rotation
                );


                normal.normalize();


                cloud.userData.normal =
                    normal;


                placeOnSurface(
                    cloud,
                    normal,
                    cloud.userData.altitude
                );

            }

        }


        /* =========================================================
           37. ENVIRONMENT MICRO MOTION
           ========================================================= */

        let worldAnimationTime = 0;


        function updateEnvironment(
            dt
        ) {

            worldAnimationTime +=
                dt;


            /*
             * Very subtle cloud puff movement.
             */

            for (
                const cloud
                of cloudGroup.children
            ) {

                const scaleWave =
                    1 +
                    Math.sin(
                        worldAnimationTime *
                        0.45 +
                        cloud.id
                    ) *
                    0.008;


                cloud.scale.multiplyScalar(
                    scaleWave
                );

            }


            /*
             * Star rotation.
             */

            stars.rotation.y +=
                dt *
                0.001;

        }


        /* =========================================================
           38. MAIN LOOP
           ========================================================= */

        const clock =
            new THREE.Clock();


        let frameCount = 0;

        let fpsTimer =
            performance.now();


        function mainLoop() {

            requestAnimationFrame(
                mainLoop
            );


            const dt =
                Math.min(
                    clock.getDelta(),
                    0.05
                );


            updatePlayer(
                dt
            );


            updateJump(
                dt
            );


            updateNPCs(
                dt
            );


            updateHouseDoors(
                dt
            );


            updateWaterState();


            updateRiver(
                dt
            );


            updateDayNight(
                dt
            );


            updateClouds(
                dt
            );


            updateEnvironment(
                dt
            );


            updateInteractionUI();


            updateCamera(
                dt
            );


            frameCount++;


            const now =
                performance.now();


            if (
                now -
                fpsTimer >=
                500
            ) {

                const fps =
                    Math.round(

                        frameCount *
                        1000 /
                        (
                            now -
                            fpsTimer
                        )

                    );


                document.getElementById(
                    "fps-counter"
                ).textContent =
                    `FPS: ${fps}`;


                frameCount = 0;

                fpsTimer = now;

            }


            renderer.render(
                scene,
                camera
            );

        }


        /* =========================================================
           39. RESIZE
           ========================================================= */

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );


                renderer.setPixelRatio(
                    Math.min(
                        window.devicePixelRatio || 1,
                        1.65
                    )
                );

            }
        );


        /* =========================================================
           40. INITIAL CAMERA
           ========================================================= */

        cameraMode = 0;

        cameraYaw = 0;

        cameraPitch = 0.22;

        cameraDistance =
            CONFIG.cameraDistance;


        /* =========================================================
           41. LOADING
           ========================================================= */

        const loadingProgress =
            document.getElementById(
                "loading-progress"
            );


        let fakeProgress = 0;


        const loadingInterval =
            setInterval(
                () => {

                    fakeProgress +=
                        8 +
                        Math.random() *
                        10;


                    fakeProgress =
                        Math.min(
                            fakeProgress,
                            100
                        );


                    loadingProgress.style.width =
                        `${fakeProgress}%`;


                    if (
                        fakeProgress >=
                        100
                    ) {

                        clearInterval(
                            loadingInterval
                        );


                        setTimeout(
                            () => {

                                document
                                    .getElementById(
                                        "loading-screen"
                                    )
                                    .classList.add(
                                        "hidden"
                                    );

                            },
                            300
                        );

                    }

                },
                90
            );


        /* =========================================================
           42. START
           ========================================================= */

        mainLoop();


    </script>
