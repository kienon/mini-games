<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fixed POV World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        #joystick { position: absolute; bottom: 30px; left: 30px; width: 100px; height: 100px; background: rgba(0,0,0,0.3); border-radius: 50%; }
        #knob { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: #fff; border-radius: 50%; pointer-events: none; }
        #info { position: absolute; top: 10px; left: 10px; color: black; font-family: sans-serif; font-weight: bold; background: rgba(255,255,255,0.7); padding: 5px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">POV: Drag Screen | Gerak: WASD/Joystick</div>
    <div id="joystick"><div id="knob"></div></div>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Kawalan Kamera POV
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI/2 - 0.05; // Tak boleh pandang bawah tanah

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        // Lantai Flat
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshLambertMaterial({color: 0x4CAF50}));
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);

        // Bangunan (Collision Target)
        const bldgGeo = new THREE.BoxGeometry(5, 5, 5);
        const bldg = new THREE.Mesh(bldgGeo, new THREE.MeshLambertMaterial({color: 0x888888}));
        bldg.position.set(0, 2.5, -10);
        scene.add(bldg);
        const bldgBox = new THREE.Box3().setFromObject(bldg); // Kotak Pelanggaran

        // Pemain
        const player = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshLambertMaterial({color: 0xff0000}));
        player.position.y = 1;
        scene.add(player);

        // Kawalan Keyboard
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Kawalan Joystick Mobile
        let joyX = 0, joyY = 0;
        const joy = document.getElementById('joystick'), knob = document.getElementById('knob');
        joy.addEventListener('touchmove', e => {
            const rect = joy.getBoundingClientRect();
            const touch = e.touches[0];
            let dx = touch.clientX - (rect.left + 50);
            let dy = touch.clientY - (rect.top + 50);
            const dist = Math.min(50, Math.sqrt(dx*dx + dy*dy));
            const angle = Math.atan2(dy, dx);
            joyX = Math.cos(angle) * (dist/50);
            joyY = Math.sin(angle) * (dist/50);
            knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
        });
        joy.addEventListener('touchend', () => { joyX = 0; joyY = 0; knob.style.transform = 'translate(0,0)'; });

        // Loop Game
        function animate() {
            requestAnimationFrame(animate);

            // Pergerakan Pemain
            const speed = 0.1;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0; dir.normalize();
            
            const right = new THREE.Vector3().crossVectors(camera.up, dir).normalize();
            
            let moveDir = new THREE.Vector3();
            if(keys['w'] || joyY < -0.1) moveDir.add(dir);
            if(keys['s'] || joyY > 0.1) moveDir.sub(dir);
            if(keys['a'] || joyX < -0.1) moveDir.add(right);
            if(keys['d'] || joyX > 0.1) moveDir.sub(right);

            if(moveDir.length() > 0) {
                moveDir.normalize().multiplyScalar(speed);
                
                // Cek Pelanggaran (Collision)
                const nextPos = player.position.clone().add(moveDir);
                const playerBox = new THREE.Box3().setFromObject(player);
                playerBox.translate(moveDir);

                if(!playerBox.intersectsBox(bldgBox)) {
                    player.position.copy(nextPos);
                }
            }

            // Kamera ikut pemain
            controls.target.copy(player.position);
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 10;
            controls.update();

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
