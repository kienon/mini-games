<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Tiny World — Ultimate Living Planet</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02030a;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
        }

        body {
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* =========================================================
           MAIN UI
           ========================================================= */

        #ui-container {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            left: max(16px, env(safe-area-inset-left));
            z-index: 50;

            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);

            pointer-events: none;

            background: rgba(0, 0, 0, 0.30);
            padding: 13px 17px;
            border-radius: 14px;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.13);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        #ui-container h1 {
            margin: 0 0 6px 0;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        #ui-container p {
            margin: 3px 0;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.82);
        }

        #status-text {
            margin-top: 6px !important;
            font-weight: 700;
            color: #69f0ae;
        }

        #telemetry-panel {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            right: max(16px, env(safe-area-inset-right));
            z-index: 50;

            color: #ffffff;
            text-align: right;

            font-size: 11px;
            line-height: 1.55;

            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);

            pointer-events: none;

            background: rgba(0, 0, 0, 0.27);
            padding: 10px 13px;
            border-radius: 12px;

            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);

            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        #time-display {
            position: fixed;

            top: max(15px, env(safe-area-inset-top));
            left: 50%;

            transform: translateX(-50%);

            z-index: 50;

            color: #ffffff;

            background: rgba(0, 0, 0, 0.27);

            padding: 7px 15px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: 600;

            border: 1px solid rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);

            pointer-events: none;

            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);

            white-space: nowrap;
        }

        /* =========================================================
           JOYSTICK
           ========================================================= */

        #virtual-joystick {
            position: fixed;

            left: max(22px, env(safe-area-inset-left));
            bottom: max(22px, env(safe-area-inset-bottom));

            width: 138px;
            height: 138px;

            z-index: 100;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 255, 255, 0.07),
                    rgba(255, 255, 255, 0.025)
                );

            border: 2px solid rgba(255, 255, 255, 0.22);

            box-shadow:
                inset 0 0 25px rgba(255, 255, 255, 0.045),
                0 10px 28px rgba(0, 0, 0, 0.38);

            touch-action: none;
        }

        #joystick-thumb {
            position: absolute;

            left: 41px;
            top: 41px;

            width: 56px;
            height: 56px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    rgba(255, 255, 255, 0.98),
                    rgba(220, 230, 235, 0.80)
                );

            box-shadow:
                0 5px 16px rgba(0, 0, 0, 0.50),
                inset 0 1px 2px rgba(255, 255, 255, 0.7);

            pointer-events: none;

            will-change: transform;
        }

        /* =========================================================
           RIGHT SIDE TOUCH AREA
           ========================================================= */

        #camera-touch-zone {
            position: fixed;

            right: 0;
            top: 0;

            width: 48%;
            height: 100%;

            z-index: 20;

            pointer-events: auto;

            touch-action: none;
        }

        /* =========================================================
           MOBILE BUTTONS
           ========================================================= */

        #mobile-controls {
            position: fixed;

            right: max(20px, env(safe-area-inset-right));
            bottom: max(24px, env(safe-area-inset-bottom));

            z-index: 110;

            width: 150px;
            height: 145px;

            pointer-events: none;
        }

        .mobile-button {
            position: absolute;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #ffffff;

            background: rgba(0, 0, 0, 0.34);

            border: 1px solid rgba(255, 255, 255, 0.28);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            box-shadow:
                0 6px 16px rgba(0, 0, 0, 0.30),
                inset 0 0 12px rgba(255, 255, 255, 0.04);

            font-size: 12px;
            font-weight: 700;

            pointer-events: auto;

            touch-action: none;

            transition:
                transform 0.08s ease,
                background 0.15s ease,
                opacity 0.2s ease;
        }

        .mobile-button:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.18);
        }

        #jump-button {
            right: 0;
            bottom: 35px;

            width: 64px;
            height: 64px;
        }

        #interact-button {
            right: 70px;
            bottom: 78px;

            width: 56px;
            height: 56px;

            opacity: 0;
            pointer-events: none;
        }

        #interact-button.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #camera-button {
            right: 4px;
            bottom: 0;

            width: 48px;
            height: 32px;

            border-radius: 16px;

            font-size: 10px;
        }

        /* =========================================================
           INTERACTION PROMPT
           ========================================================= */

        #interaction-prompt {
            position: fixed;

            left: 50%;
            bottom: 18%;

            transform: translate(-50%, 10px);

            z-index: 90;

            min-width: 150px;

            padding: 9px 16px;

            border-radius: 22px;

            background: rgba(0, 0, 0, 0.55);

            border: 1px solid rgba(255, 255, 255, 0.22);

            color: white;

            text-align: center;

            font-size: 12px;
            font-weight: 700;

            opacity: 0;

            pointer-events: none;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        #interaction-prompt.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* =========================================================
           CROSSHAIR
           ========================================================= */

        #crosshair {
            position: fixed;

            left: 50%;
            top: 50%;

            width: 8px;
            height: 8px;

            margin-left: -4px;
            margin-top: -4px;

            z-index: 25;

            border: 1px solid rgba(255, 255, 255, 0.75);

            border-radius: 50%;

            opacity: 0;

            pointer-events: none;

            transition: opacity 0.2s ease;
        }

        #crosshair.visible {
            opacity: 0.85;
        }

        /* =========================================================
           DESKTOP HELP
           ========================================================= */

        #desktop-help {
            position: fixed;

            left: 50%;
            bottom: 17px;

            transform: translateX(-50%);

            z-index: 45;

            color: rgba(255, 255, 255, 0.68);

            font-size: 10px;

            padding: 5px 10px;

            background: rgba(0, 0, 0, 0.20);

            border-radius: 10px;

            pointer-events: none;
        }

        /* =========================================================
           LOADING
           ========================================================= */

        #loading-screen {
            position: fixed;

            inset: 0;

            z-index: 999;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            background:
                radial-gradient(
                    circle at center,
                    #162b38 0%,
                    #050b12 55%,
                    #020308 100%
                );

            color: white;

            transition:
                opacity 0.7s ease,
                visibility 0.7s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #loading-title {
            font-size: 26px;
            font-weight: 800;

            margin-bottom: 8px;

            letter-spacing: 0.4px;
        }

        #loading-subtitle {
            font-size: 12px;

            opacity: 0.65;

            margin-bottom: 20px;
        }

        #loading-bar {
            width: 220px;
            height: 4px;

            overflow: hidden;

            border-radius: 5px;

            background: rgba(255, 255, 255, 0.12);
        }

        #loading-progress {
            width: 0%;
            height: 100%;

            border-radius: 5px;

            background: rgba(255, 255, 255, 0.85);

            transition: width 0.25s ease;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 700px) {

            #ui-container {
                top: max(10px, env(safe-area-inset-top));
                left: max(10px, env(safe-area-inset-left));

                padding: 9px 11px;
            }

            #ui-container h1 {
                font-size: 13px;
            }

            #ui-container p {
                display: none;
            }

            #status-text {
                display: block !important;
                font-size: 10px;
            }

            #telemetry-panel {
                top: max(10px, env(safe-area-inset-top));
                right: max(10px, env(safe-area-inset-right));

                padding: 7px 9px;
            }

            #time-display {
                top: max(10px, env(safe-area-inset-top));
                font-size: 10px;
                padding: 6px 11px;
            }

            #desktop-help {
                display: none;
            }

            #crosshair {
                display: none;
            }
        }

        @media (min-width: 701px) {
            #mobile-controls {
                opacity: 0;
                pointer-events: none;
            }

            #virtual-joystick {
                opacity: 0;
                pointer-events: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         LOADING
         ========================================================= -->

    <div id="loading-screen">
        <div id="loading-title">🌍 Tiny World</div>
        <div id="loading-subtitle">Building a living planet...</div>

        <div id="loading-bar">
            <div id="loading-progress"></div>
        </div>
    </div>


    <!-- =========================================================
         UI
         ========================================================= -->

    <div id="ui-container">

        <h1>🌍 Tiny World</h1>

        <p>
            <b>PC:</b>
            W/S Move · A/D Turn · SPACE Jump · E Interact · C Camera
        </p>

        <p>
            <b>Mobile:</b>
            Joystick · Drag right side to look
        </p>

        <p id="status-text">
            Status: Exploring
        </p>

    </div>


    <div id="telemetry-panel">

        <div id="fps-counter">
            FPS: --
        </div>

        <div id="speed-meter">
            Speed: 0.0 m/s
        </div>

    </div>


    <div id="time-display">
        ☀️ 12:00 · Day
    </div>


    <!-- =========================================================
         CAMERA TOUCH AREA
         ========================================================= -->

    <div id="camera-touch-zone"></div>


    <!-- =========================================================
         JOYSTICK
         ========================================================= -->

    <div id="virtual-joystick">

        <div id="joystick-thumb"></div>

    </div>


    <!-- =========================================================
         MOBILE CONTROLS
         ========================================================= -->

    <div id="mobile-controls">

        <div
            id="interact-button"
            class="mobile-button">
            USE
        </div>

        <div
            id="jump-button"
            class="mobile-button">
            JUMP
        </div>

        <div
            id="camera-button"
            class="mobile-button">
            CAM
        </div>

    </div>


    <!-- =========================================================
         INTERACTION
         ========================================================= -->

    <div id="interaction-prompt">
        E · Interact
    </div>


    <div id="crosshair"></div>


    <div id="desktop-help">
        W A S D · SPACE · E · C · Mouse Drag
    </div>


    <!-- =========================================================
         THREE.JS
         ========================================================= -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>


    <script type="module">

        import * as THREE from "three";


        /* =========================================================
           1. CONFIGURATION
           ========================================================= */

        const CONFIG = {

            planetRadius: 180,

            playerHeight: 3.0,

            playerRadius: 1.15,

            playerWalkSpeed: 3.8,

            playerReverseSpeed: 2.0,

            playerTurnSpeed: 2.35,

            acceleration: 8.0,

            deceleration: 10.0,

            cameraDistance: 13.5,

            cameraMinDistance: 4.2,

            cameraMaxDistance: 23.0,

            cameraHeight: 4.8,

            cameraLag: 9.0,

            cameraLookHeight: 2.0,

            cameraLookAhead: 3.0,

            cameraSensitivity: 0.005,

            cameraPitchMin: -0.72,

            cameraPitchMax: 1.0,

            jumpVelocity: 10.5,

            gravity: 24.0,

            maxStepHeight: 1.75,

            npcCount: 22,

            buildingCount: 30,

            treeCount: 145,

            rockCount: 85,

            cloudCount: 24,

            dayLengthSec: 180,

            riverSegments: 80,

            shadowMapSize: 1536

        };


        /* =========================================================
           2. BASIC HELPERS
           ========================================================= */

        const UP = new THREE.Vector3(0, 1, 0);

        const WORLD_Y = new THREE.Vector3(0, 1, 0);

        const tempV1 = new THREE.Vector3();

        const tempV2 = new THREE.Vector3();

        const tempV3 = new THREE.Vector3();

        const tempV4 = new THREE.Vector3();

        const tempQ1 = new THREE.Quaternion();

        const tempQ2 = new THREE.Quaternion();

        const tempM1 = new THREE.Matrix4();


        function clamp(value, min, max) {

            return Math.max(min, Math.min(max, value));

        }


        function damp(current, target, lambda, dt) {

            return THREE.MathUtils.damp(
                current,
                target,
                lambda,
                dt
            );

        }


        function randomDirection() {

            const v = new THREE.Vector3(
                Math.random() - 0.5,
                Math.random() - 0.5,
                Math.random() - 0.5
            );

            return v.normalize();

        }


        function tangentDirection(normal) {

            let reference = new THREE.Vector3(0, 1, 0);

            if (Math.abs(reference.dot(normal)) > 0.92) {

                reference.set(1, 0, 0);

            }

            const tangent = new THREE.Vector3()
                .crossVectors(reference, normal)
                .normalize();

            return tangent;

        }


        function projectOntoTangent(vector, normal) {

            return vector
                .clone()
                .sub(
                    normal.clone().multiplyScalar(
                        vector.dot(normal)
                    )
                )
                .normalize();

        }


        function orientToSurface(object, normal) {

            const tangent = tangentDirection(normal);

            const right = new THREE.Vector3()
                .crossVectors(normal, tangent)
                .normalize();

            const matrix = new THREE.Matrix4();

            matrix.makeBasis(
                right,
                normal,
                tangent
            );

            object.quaternion.setFromRotationMatrix(matrix);

        }


        function placeOnSurface(
            object,
            normal,
            height = 0
        ) {

            object.position
                .copy(normal)
                .multiplyScalar(
                    CONFIG.planetRadius + height
                );

            orientToSurface(
                object,
                normal
            );

        }


        /* =========================================================
           3. SCENE
           ========================================================= */

        const scene = new THREE.Scene();


        scene.background =
            new THREE.Color(0x78caff);


        scene.fog =
            new THREE.FogExp2(
                0x78caff,
                0.00155
            );


        /* =========================================================
           4. CAMERA
           ========================================================= */

        const camera =
            new THREE.PerspectiveCamera(
                62,
                window.innerWidth / window.innerHeight,
                0.05,
                3000
            );


        camera.position.set(
            0,
            8,
            18
        );


        /* =========================================================
           5. RENDERER
           ========================================================= */

        const renderer =
            new THREE.WebGLRenderer({

                antialias: true,

                powerPreference:
                    "high-performance"

            });


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.65
            )
        );


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.shadowMap.enabled = true;

        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;


        renderer.outputColorSpace =
            THREE.SRGBColorSpace;


        renderer.toneMapping =
            THREE.ACESFilmicToneMapping;


        renderer.toneMappingExposure =
            1.08;


        renderer.domElement.id =
            "tiny-world-canvas";


        document.body.appendChild(
            renderer.domElement
        );


        /* =========================================================
           6. LIGHTING
           ========================================================= */

        const hemisphereLight =
            new THREE.HemisphereLight(
                0xbfeaff,
                0x263d29,
                1.35
            );


        scene.add(
            hemisphereLight
        );


        const sunLight =
            new THREE.DirectionalLight(
                0xffffff,
                2.2
            );


        sunLight.castShadow = true;


        sunLight.shadow.mapSize.width =
            CONFIG.shadowMapSize;


        sunLight.shadow.mapSize.height =
            CONFIG.shadowMapSize;


        sunLight.shadow.camera.near = 30;

        sunLight.shadow.camera.far = 750;

        sunLight.shadow.camera.left = -260;

        sunLight.shadow.camera.right = 260;

        sunLight.shadow.camera.top = 260;

        sunLight.shadow.camera.bottom = -260;

        sunLight.shadow.bias = -0.0005;


        scene.add(
            sunLight
        );


        const moonLight =
            new THREE.DirectionalLight(
                0x91aaff,
                0.35
            );


        scene.add(
            moonLight
        );


        /* =========================================================
           7. SUN
           ========================================================= */

        const sunGroup =
            new THREE.Group();


        const sunCore =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    13,
                    32,
                    32
                ),

                new THREE.MeshBasicMaterial({
                    color: 0xffffe6
                })

            );


        sunGroup.add(
            sunCore
        );


        const sunGlow =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    17,
                    24,
                    24
                ),

                new THREE.MeshBasicMaterial({

                    color: 0xffd58a,

                    transparent: true,

                    opacity: 0.18,

                    depthWrite: false

                })

            );


        sunGroup.add(
            sunGlow
        );


        scene.add(
            sunGroup
        );


        /* =========================================================
           8. MOON
           ========================================================= */

        const moon =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    8,
                    32,
                    32
                ),

                new THREE.MeshStandardMaterial({

                    color: 0xdce6f4,

                    roughness: 1,

                    metalness: 0

                })

            );


        scene.add(
            moon
        );


        /* =========================================================
           9. PLANET
           ========================================================= */

        const planetMaterial =
            new THREE.MeshStandardMaterial({

                color: 0x4b9d55,

                roughness: 0.96,

                metalness: 0

            });


        const planet =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    CONFIG.planetRadius,
                    96,
                    96
                ),

                planetMaterial

            );


        planet.receiveShadow = true;

        scene.add(
            planet
        );


        /* =========================================================
           10. ATMOSPHERE
           ========================================================= */

        const atmosphere =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    CONFIG.planetRadius + 4.5,
                    64,
                    64
                ),

                new THREE.MeshBasicMaterial({

                    color: 0x79cfff,

                    transparent: true,

                    opacity: 0.085,

                    side: THREE.BackSide,

                    depthWrite: false

                })

            );


        scene.add(
            atmosphere
        );


        /* =========================================================
           11. STARS
           ========================================================= */

        const starCount = 5000;


        const starGeometry =
            new THREE.BufferGeometry();


        const starPositions =
            new Float32Array(
                starCount * 3
            );


        const starSizes =
            new Float32Array(
                starCount
            );


        for (
            let i = 0;
            i < starCount;
            i++
        ) {

            const direction =
                randomDirection();


            const radius =
                760 +
                Math.random() * 420;


            starPositions[i * 3] =
                direction.x * radius;


            starPositions[i * 3 + 1] =
                direction.y * radius;


            starPositions[i * 3 + 2] =
                direction.z * radius;


            starSizes[i] =
                0.55 +
                Math.random() * 1.35;

        }


        starGeometry.setAttribute(

            "position",

            new THREE.BufferAttribute(
                starPositions,
                3
            )

        );


        const starMaterial =
            new THREE.PointsMaterial({

                color: 0xffffff,

                size: 1.25,

                transparent: true,

                opacity: 0,

                depthWrite: false,

                sizeAttenuation: true

            });


        const stars =
            new THREE.Points(
                starGeometry,
                starMaterial
            );


        scene.add(
            stars
        );


        /* =========================================================
           12. CLOUD SYSTEM
           ========================================================= */

        const cloudGroup =
            new THREE.Group();


        scene.add(
            cloudGroup
        );


        const cloudMaterial =
            new THREE.MeshStandardMaterial({

                color: 0xffffff,

                roughness: 1,

                transparent: true,

                opacity: 0.78,

                depthWrite: false

            });


        function createCloud() {

            const cloud =
                new THREE.Group();


            const puffs =
                4 +
                Math.floor(
                    Math.random() * 4
                );


            for (
                let i = 0;
                i < puffs;
                i++
            ) {

                const radius =
                    2.7 +
                    Math.random() * 3.1;


                const puff =
                    new THREE.Mesh(

                        new THREE.SphereGeometry(
                            radius,
                            14,
                            10
                        ),

                        cloudMaterial

                    );


                puff.position.set(

                    i * 3.2,

                    Math.random() * 1.6,

                    (Math.random() - 0.5) * 3.5

                );


                puff.scale.y =
                    0.65 +
                    Math.random() * 0.3;


                cloud.add(
                    puff
                );

            }


            return cloud;

        }


        for (
            let i = 0;
            i < CONFIG.cloudCount;
            i++
        ) {

            const cloud =
                createCloud();


            const normal =
                randomDirection();


            const cloudAltitude =
                13 +
                Math.random() * 9;


            cloud.userData.normal =
                normal.clone();


            cloud.userData.altitude =
                cloudAltitude;


            cloud.userData.speed =
                0.004 +
                Math.random() * 0.004;


            cloud.scale.setScalar(
                0.75 +
                Math.random() * 1.1
            );


            placeOnSurface(
                cloud,
                normal,
                cloudAltitude
            );


            cloudGroup.add(
                cloud
            );

        }


        /* =========================================================
           13. ENVIRONMENT GROUPS
           ========================================================= */

        const environmentGroup =
            new THREE.Group();


        scene.add(
            environmentGroup
        );


        const obstacleList = [];


        function addObstacle(
            object,
            radius,
            type = "obstacle",
            extra = {}
        ) {

            obstacleList.push({

                object,

                position:
                    object.position,

                radius,

                type,

                ...extra

            });

        function slerpDirection(
            a,
            b,
            t
        ) {

            const qa =
                new THREE.Quaternion();

            const qb =
                new THREE.Quaternion();

            const q =
                new THREE.Quaternion();


            qa.setFromUnitVectors(
                new THREE.Vector3(0, 0, 1),
                a
            );


            qb.setFromUnitVectors(
                new THREE.Vector3(0, 0, 1),
                b
            );


            q.slerpQuaternions(
                qa,
                qb,
                t
            );


            return new THREE.Vector3(
                0,
                0,
                1
            )
                .applyQuaternion(q)
                .normalize();

        }


        const riverPoints = [];


        for (
            let i = 0;
            i < CONFIG.riverSegments;
            i++
        ) {

            const t =
                i /
                (CONFIG.riverSegments - 1);


            let direction =
                slerpDirection(
                    riverStart,
                    riverEnd,
                    t
                );


            const side =
                tangentDirection(
                    direction
                );


            const wave =
                Math.sin(
                    t * Math.PI * 8
                ) * 0.025;


            direction.add(
                side.multiplyScalar(
                    wave
                )
            );


            direction.normalize();


            riverPoints.push(
                direction
            );

        }


        function buildRibbon(
            width,
            heightOffset,
            material
        ) {

            const vertices = [];

            const indices = [];


            for (
                let i = 0;
                i < riverPoints.length;
                i++
            ) {

                const p =
                    riverPoints[i];


                const prev =
                    riverPoints[
                        Math.max(0, i - 1)
                    ];


                const next =
                    riverPoints[
                        Math.min(
                            riverPoints.length - 1,
                            i + 1
                        )
                    ];


                const tangent =
                    next.clone()
                        .sub(prev)
                        .normalize();


                const side =
                    new THREE.Vector3()
                        .crossVectors(
                            p,
                            tangent
                        )
                        .normalize();


                const left =
                    p.clone()
                        .add(
                            side.clone()
                                .multiplyScalar(width)
                        )
                        .normalize();


                const right =
                    p.clone()
                        .add(
                            side.clone()
                                .multiplyScalar(-width)
                        )
                        .normalize();


                left.multiplyScalar(
                    CONFIG.planetRadius +
                    heightOffset
                );


                right.multiplyScalar(
                    CONFIG.planetRadius +
                    heightOffset
                );


                vertices.push(
                    left.x,
                    left.y,
                    left.z
                );


                vertices.push(
                    right.x,
                    right.y,
                    right.z
                );

            }


            for (
                let i = 0;
                i <
                riverPoints.length - 1;
                i++
            ) {

                const a = i * 2;

                const b = a + 1;

                const c = a + 2;

                const d = a + 3;


                indices.push(
                    a,
                    b,
                    c
                );


                indices.push(
                    b,
                    d,
                    c
                );

            }


            const geometry =
                new THREE.BufferGeometry();


            geometry.setAttribute(

                "position",

                new THREE.Float32BufferAttribute(
                    vertices,
                    3
                )

            );


            geometry.setIndex(
                indices
            );


            geometry.computeVertexNormals();


            const mesh =
                new THREE.Mesh(
                    geometry,
                    material
                );


            return mesh;

        }

        const joystick =

            );


        let joystickActive = false;

        let joystickPointerId = null;

        let joystickX = 0;

        let joystickY = 0;


        function resetJoystick() {

            joystickActive =
                false;


            joystickPointerId =
                null;


            joystickX = 0;

            joystickY = 0;


            joystickThumb.style.transform =
                "translate(0px, 0px)";

        }


        function updateJoystick(
            clientX,
            clientY
        ) {

            const rect =
                joystick.getBoundingClientRect();


            const centerX =
                rect.left +
                rect.width / 2;


            const centerY =
                rect.top +
                rect.height / 2;


            let dx =
                clientX -
                centerX;


            let dy =
                clientY -
                centerY;


            const max =
                41;


            const distance =
                Math.hypot(
                    dx,
                    dy
                );


            if (
                distance > max
            ) {

                dx =
                    dx / distance *
                    max;


                dy =
                    dy / distance *
                    max;

            }


            joystickThumb.style.transform =
                `translate(${dx}px, ${dy}px)`;


            joystickX =
                dx / max;


            joystickY =
                dy / max;

        }


        joystick.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();

                joystickActive =
                    true;


                joystickPointerId =
                    event.pointerId;


                joystick.setPointerCapture(
                    event.pointerId
                );


                updateJoystick(
                    event.clientX,
                    event.clientY
                );

            },
            {
                passive: false
            }
        );


        joystick.addEventListener(
            "pointermove",
            event => {

                if (
                    !joystickActive ||
                    event.pointerId !==
                    joystickPointerId
                ) {

        const cameraTouchZone =
            document.getElementById(
                "camera-touch-zone"
            );


        let cameraDragging = false;

        let cameraPointerId = null;

        let lastCameraX = 0;

        let lastCameraY = 0;


        let cameraYaw = 0;

        let cameraPitch =
            0.22;


        let cameraDistance =
            CONFIG.cameraDistance;


        let cameraMode = 0;


        const cameraModeNames = [

            "Third Person",

            "Close",

        ];


        cameraTouchZone.addEventListener(
            "pointerdown",
            event => {

                if (
                    event.pointerType ===
                    "mouse" &&
                    event.button !== 0
                ) {

                    return;

                }


                cameraDragging =
                    true;


                cameraPointerId =
                    event.pointerId;


                lastCameraX =
                    event.clientX;


                lastCameraY =
                    event.clientY;


                cameraTouchZone.setPointerCapture(
                    event.pointerId
                );

            }
        );


        cameraTouchZone.addEventListener(
            "pointermove",
            event => {

                if (
                    !cameraDragging ||
                    event.pointerId !==
                    cameraPointerId
                ) {

                    return;

                }


                const dx =
                    event.clientX -
                    lastCameraX;


                const dy =
                    event.clientY -
                    lastCameraY;


                lastCameraX =
                    event.clientX;


                lastCameraY =
                    event.clientY;


                cameraYaw -=
                    dx *
                    CONFIG.cameraSensitivity;


                cameraPitch +=
                    dy *
                    CONFIG.cameraSensitivity;


                cameraPitch =
                    clamp(
                        cameraPitch,
                        CONFIG.cameraPitchMin,
                        CONFIG.cameraPitchMax
                    );

            }
        );


        cameraTouchZone.addEventListener(
            "pointerup",
            () => {

                cameraDragging =
                    false;

            }
        );


        cameraTouchZone.addEventListener(
            "pointercancel",
            () => {

                cameraDragging =
                    false;

            }
        );

                    event.deltaY *

                        CONFIG.cameraMaxDistance

        /* =========================================================
           27. JUMP
           ========================================================= */

        function jump() {

            if (
                !isGrounded
            ) {

                return;

            }


            if (
                jumpHeight > 0.03
            ) {

                return;

            }


            verticalVelocity =
                CONFIG.jumpVelocity;


            isGrounded =
                false;

        }


        function updateJump(
            dt
        ) {

            if (
                isGrounded
            ) {

                jumpHeight = 0;

                verticalVelocity = 0;

                return;

            }


            verticalVelocity -=
                CONFIG.gravity *
                dt;


            jumpHeight +=
                verticalVelocity *
                dt;


            if (
                jumpHeight <= 0
            ) {

                jumpHeight = 0;

                verticalVelocity = 0;

                isGrounded = true;

            }


            updatePlayerTransform();

        }


        /* =========================================================
           28. PLAYER MOVEMENT

        function getMovementInput() {

            let turn = 0;

            let walk = 0;


            if (
                keys["a"] ||
                keys["arrowleft"]
            ) {

                turn += 1;

            }


            if (
                keys["d"] ||
                keys["arrowright"]
            ) {

                turn -= 1;

            }


            if (
                keys["w"] ||
                keys["arrowup"]
            ) {

                walk += 1;

            }


            if (
                keys["s"] ||
                keys["arrowdown"]
            ) {

                walk -= 1;

            }


            if (
                joystickActive
            ) {

                /*
                 * IMPORTANT:
                 * Up on joystick = forward.
                 * Down on joystick = reverse.
                 */

                turn =
                    -joystickX;


                walk =
                    -joystickY;

            }


            return {
                turn,
                walk
            };

        }


        function checkObstacleCollision(
            candidateNormal
        ) {

            const candidatePosition =
                candidateNormal
                    .clone()
                    .multiplyScalar(
                        CONFIG.planetRadius
                    );


            for (
                const obstacle
                of obstacleList
            ) {

                if (
                    obstacle.type ===
                    "house"
                ) {

                    const house =
                        obstacle.house;


                    /*
                     * Allow the player to enter
                     * through the front doorway.
                     */

                    if (
                        house.userData.isOpen
                    ) {

                        const local =
                            candidatePosition
                                .clone();


                        house.worldToLocal(
                            local
                        );


                        const width =
                            house.userData.width;


                        const depth =
                            house.userData.depth;


                        const inside =
                            Math.abs(local.x) <
                            width * 0.5 &&
                            Math.abs(local.z) <
                            depth * 0.5;


                        const nearDoor =
                            Math.abs(local.x) <
                            1.35 &&
                            local.z <
                            -depth * 0.5 +
                            2.0;


                        if (
                            inside ||
                            nearDoor
                        ) {

                            continue;

                        }

                    }

                }


                const distance =
                    candidatePosition.distanceTo(
                        obstacle.position
                    );


                if (
                    distance <
                    CONFIG.playerRadius +
                    obstacle.radius
                ) {

                    return obstacle;

                }

            }


            return null;

        }


        function attemptMove(
            distance
        ) {

            const movement =
                playerForward
                    .clone()
                    .multiplyScalar(
                        distance
                    );


            const candidateWorld =
                player.position
                    .clone()
                    .add(
                        movement
                    );


            const candidateNormal =
                candidateWorld
                    .normalize();


            /*
             * Simple rock step-up.
             */

            const collision =
                checkObstacleCollision(
                    candidateNormal
                );


            if (
                collision &&
                collision.type ===
                "rock" &&
                isGrounded &&
                collision.height <=
                CONFIG.maxStepHeight
            ) {

                jumpHeight =
                    Math.max(
                        jumpHeight,
                        0.65
                    );


                playerNormal.copy(
                    candidateNormal
                );


                playerForward =
                    projectOntoTangent(
                        playerForward,
                        playerNormal
                    );


                updatePlayerTransform();

                return true;

            }


            if (
                collision
            ) {

                return false;

            }


            playerNormal.copy(
                candidateNormal
            );


            playerForward =
                projectOntoTangent(
                    playerForward,
                    playerNormal
                );


            updatePlayerTransform();


            return true;

        }


        function updatePlayer(
            dt
        ) {

            const input =
                getMovementInput();


            let turn =
                input.turn;


            let walk =
                input.walk;


            if (
                Math.abs(turn) >
                0.03
            ) {

                const rotation =
                    new THREE.Quaternion()
                        .setFromAxisAngle(

                            playerNormal,

                            turn *
                            CONFIG.playerTurnSpeed *
                            dt

                        );


                playerForward
                    .applyQuaternion(
                        rotation
                    );


                playerForward =
                    projectOntoTangent(
                        playerForward,
                        playerNormal
                    );

            }


            let targetSpeed = 0;


            if (
                walk > 0
            ) {

                targetSpeed =
                    CONFIG.playerWalkSpeed *
                    walk;

            }
            else if (
                walk < 0
            ) {

                targetSpeed =
                    CONFIG.playerReverseSpeed *
                    walk;

            }


            if (
                currentWaterFactor <
                1
            ) {

                targetSpeed *=
                    currentWaterFactor;

            }


            const rate =
                Math.abs(targetSpeed) >
                Math.abs(currentSpeed)

                    ? CONFIG.acceleration

                    : CONFIG.deceleration;


            currentSpeed =
                damp(
                    currentSpeed,
                    targetSpeed,
                    rate,
                    dt
                );


            if (
                Math.abs(currentSpeed) >
                0.005
            ) {

                const moved =
                    attemptMove(
                        currentSpeed *
                        dt
                    );


                if (
                    !moved
                ) {

                    currentSpeed =
                        damp(
                            currentSpeed,
                            0,
                            18,
                            dt
                        );

                }

            }


            if (
                Math.abs(currentSpeed) >
                0.08 &&
                isGrounded
            ) {

                walkTime +=
                    dt *
                    Math.abs(
                        currentSpeed
                    ) *
                    1.55;

            }


            const walkAmount =
                Math.min(
                    1,
                    Math.abs(
                        currentSpeed
                    ) /
                    CONFIG.playerWalkSpeed
                );


            const legSwing =
                Math.sin(
                    walkTime * 8.5
                ) *
                0.42 *
                walkAmount;


            playerMesh
                .userData
                .leftLeg
                .rotation.x =
                legSwing;


            playerMesh
                .userData
                .rightLeg
                .rotation.x =
                -legSwing;


            playerMesh
                .userData
                .leftArm
                .rotation.x =
                -legSwing *
                0.55;


            playerMesh
                .userData
                .rightArm
                .rotation.x =
                legSwing *
                0.55;


            const status =
                document.getElementById(
                    "status-text"
                );


            if (
                !isGrounded
            ) {

                status.textContent =
                    "Status: Jumping";

                status.style.color =
                    "#fff59d";

            }
            else if (
                currentWaterFactor <
                1
            ) {

                status.textContent =
                    "Status: In Water";

                status.style.color =
                    "#81d4fa";

            }
            else if (
                Math.abs(currentSpeed) <
                0.05
            ) {

                status.textContent =
                    "Status: Idle";

                status.style.color =
                    "#90caf9";

            }
            else {

                status.textContent =
                    "Status: Exploring";

                status.style.color =
                    "#69f0ae";

            }


            document.getElementById(
                "speed-meter"
            ).textContent =
                `Speed: ${Math.abs(currentSpeed).toFixed(1)} m/s`;

        }


        /* =========================================================
           29. NPC UPDATE
           ========================================================= */

        function updateNPCs(
            dt
        ) {

            for (
                const npc of npcList
            ) {

                npc.timer -= dt;


                if (
                    npc.timer <= 0
                ) {

                    npc.timer =
                        2 +
                        Math.random() *
                        4;


                    npc.turnTarget =
                        (
                            Math.random() -
                            0.5
                        ) *
                        1.2;

                }


                npc.currentTurn =
                    damp(
                        npc.currentTurn,
                        npc.turnTarget,
                        2.5,
                        dt
                    );


                const rotation =
                    new THREE.Quaternion()
                        .setFromAxisAngle(

                            npc.normal,

                            npc.currentTurn *
                            dt

                        );


                npc.forward
                    .applyQuaternion(
                        rotation
                    );


                npc.forward =
                    projectOntoTangent(
                        npc.forward,
                        npc.normal
                    );


                const movement =
                    npc.forward
                        .clone()
                        .multiplyScalar(
                            npc.speed *
                            dt
                        );


                const nextWorld =
                    npc.object.position
                        .clone()
                        .add(
                            movement
                        );


                const nextNormal =
                    nextWorld.normalize();


                let blocked =
                    false;


                const testPosition =
                    nextNormal
                        .clone()
                        .multiplyScalar(
                            CONFIG.planetRadius
                        );


                for (
                    const obstacle
                    of obstacleList
                ) {

                    if (
                        obstacle.type ===
                        "house"
                    ) {

                        continue;

                    }


                    if (
                        testPosition.distanceTo(
                            obstacle.position
                        ) <
                        1.0 +
                        obstacle.radius
                    ) {

                        blocked = true;

                        break;

                    }

                }


                if (
                    !blocked
                ) {

                    npc.normal.copy(
                        nextNormal
                    );


                    npc.forward =
                        projectOntoTangent(
                            npc.forward,
                            npc.normal
                        );


                    npc.object.position
                        .copy(
                            npc.normal
                        )
                        .multiplyScalar(
                            CONFIG.planetRadius
                        );


                    orientToSurface(
                        npc.object,
                        npc.normal
                    );

                }
                else {

                    npc.turnTarget *=
                        -1;

                }


                npc.walkCounter +=
                    dt *
                    npc.speed *
                    2.1;


                const swing =
                    Math.sin(
                        npc.walkCounter *
                        6
                    ) *
                    0.34;


                npc.mesh
                    .userData
                    .leftLeg
                    .rotation.x =
                    swing;


                npc.mesh
                    .userData
                    .rightLeg
                    .rotation.x =
                    -swing;

            }

        }

        function findNearestInteraction() {

            const playerPosition =

            for (

                    distance <

            return {

        /* =========================================================
           32. CAMERA RIG
           ========================================================= */

        const desiredCameraPosition =
            new THREE.Vector3();


        const desiredLookAt =
            new THREE.Vector3();


        const cameraForwardLocal =
            new THREE.Vector3();


        function updateCamera(
            dt
        ) {

            const up =
                playerNormal.clone();


            const forward =
                projectOntoTangent(
                    playerForward,
                    up
                );


            const right =
                new THREE.Vector3()
                    .crossVectors(
                        up,
                        forward
                    )
                    .normalize();


            /*
             * Camera yaw/pitch is built relative
             * to player orientation.
             */

            const yawQuaternion =
                new THREE.Quaternion()
                    .setFromAxisAngle(
                        up,
                        cameraYaw
                    );


            let cameraBack =
                forward.clone()
                    .negate()
                    .applyQuaternion(
                        yawQuaternion
                    );


            cameraBack =
                projectOntoTangent(
                    cameraBack,
                    up
                );


            const cameraRight =
                new THREE.Vector3()
                    .crossVectors(
                        up,
                        cameraBack
                    )
                    .normalize();


            const pitchQuaternion =
                new THREE.Quaternion()
                    .setFromAxisAngle(
                        cameraRight,
                        cameraPitch
                    );


            cameraBack
                .applyQuaternion(
                    pitchQuaternion
                );


            cameraBack =
                cameraBack.normalize();


            let distance =
                cameraDistance;


            if (
                cameraMode === 2
            ) {

                distance = 0.08;

            }


            if (
                cameraMode === 2
            ) {

                desiredCameraPosition
                    .copy(
                        player.position
                    )
                    .add(
                        up.clone()
                            .multiplyScalar(
                                2.35
                            )
                    )
                    .add(
                        forward.clone()
                            .multiplyScalar(
                                0.05
                            )
                    );

            }
            else {

                desiredCameraPosition
                    .copy(
                        player.position
                    )
                    .add(
                        up.clone()
                            .multiplyScalar(
                                CONFIG.cameraHeight
                            )
                    )
                    .add(
                        cameraBack
                            .multiplyScalar(
                                distance
                            )
                    );

            }


            const smoothing =
                1 -
                Math.exp(
                    -CONFIG.cameraLag *
                    dt
                );


            camera.position.lerp(
                desiredCameraPosition,
                smoothing
            );


            camera.up.copy(
                up
            );


            if (
                cameraMode === 2
            ) {

                desiredLookAt
                    .copy(
                        player.position
                    )
                    .add(
                        up.clone()
                            .multiplyScalar(
                                2.25
                            )
                    )
                    .add(
                        forward.clone()
                            .multiplyScalar(
                                7
                            )
                    );

            }
            else {

                desiredLookAt
                    .copy(
                        player.position
                    )
                    .add(
                        up.clone()
                            .multiplyScalar(
                                CONFIG.cameraLookHeight
                            )
                    )
                    .add(
                        forward.clone()
                            .multiplyScalar(
                                CONFIG.cameraLookAhead
                            )
                    );

            }


            camera.lookAt(
                desiredLookAt
            );

        }


        /* =========================================================
           33. RIVER WATER DETECTION
           ========================================================= */

        function updateWaterState() {

            let closestDistance =
                Infinity;


            const playerDirection =
                playerNormal.clone();


            for (
                const point
                of riverPoints
            ) {

                const angle =
                    Math.acos(
                        clamp(
                            playerDirection.dot(
                                point
                            ),
                            -1,
                            1
                        )
                    );


                const arcDistance =
                    angle *
                    CONFIG.planetRadius;


                if (
                    arcDistance <
                    closestDistance
                ) {

                    closestDistance =
                        arcDistance;

                }

            }


            /*
             * River width approximately 5.4m.
             */

            if (
                closestDistance <
                5.4
            ) {

                currentWaterFactor =
                    0.58;

            }
            else {

                currentWaterFactor =
                    1.0;

            }

        }


        /* =========================================================
           34. RIVER ANIMATION
           ========================================================= */

        let riverTime = 0;


        function updateRiver(
            dt
        ) {

            riverTime += dt;


            const position =
                river.geometry
                    .attributes
                    .position;


            for (
                let i = 0;
                i < riverPoints.length;
                i++
            ) {

                const point =
                    riverPoints[i];


                const prev =
                    riverPoints[
                        Math.max(
                            0,
                            i - 1
                        )
                    ];


                const next =
                    riverPoints[
                        Math.min(
                            riverPoints.length - 1,
                            i + 1
                        )
                    ];


                const tangent =
                    next.clone()
                        .sub(prev)
                        .normalize();


                const side =
                    new THREE.Vector3()
                        .crossVectors(
                            point,
                            tangent
                        )
                        .normalize();


                const wave =
                    Math.sin(
                        riverTime * 2.1 +
                        i * 0.34
                    ) *
                    0.16;


                const left =
                    point.clone()
                        .add(
                            side.clone()
                                .multiplyScalar(
                                    5.4
                                )
                        )
                        .normalize()
                        .multiplyScalar(
                            CONFIG.planetRadius +
                            0.28 +
                            wave
                        );


                const right =
                    point.clone()
                        .add(
                            side.clone()
                                .multiplyScalar(
                                    -5.4
                                )
                        )
                        .normalize()
                        .multiplyScalar(
                            CONFIG.planetRadius +
                            0.28 +
                            wave
                        );


                position.setXYZ(
                    i * 2,
                    left.x,
                    left.y,
                    left.z
                );


                position.setXYZ(
                    i * 2 + 1,
                    right.x,
                    right.y,
                    right.z
                );

            }


            position.needsUpdate =
                true;


            river.geometry
                .computeVertexNormals();

        }
