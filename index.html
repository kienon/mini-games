<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tiny World - Massive Detailed Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; }
        #ui { position: absolute; top: 15px; left: 20px; color: white; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; }
        #ui h2 { margin: 0 0 5px 0; font-size: 20px; color: #00e676; }
        #ui p { margin: 3px 0; font-size: 13px; color: #f5f5f5; }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; background: rgba(255,255,255,0.15); border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); z-index: 5; }
        #joystick-knob { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(255,255,255,0.9); border-radius: 50%; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Tiny World: Massive Detailed</h2>
        <p>PC: W (Depan) | S (Undur) | A/D (Pusing Kiri/Kanan)</p>
        <p id="status">Status: Fully Loaded</p>
    </div>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. SETUP ASAS & RENDERER
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010108);
        scene.fog = new THREE.FogExp2(0x010108, 0.002);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(300, 400, 200);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 50;
        sunLight.shadow.camera.far = 1000;
        sunLight.shadow.camera.left = -250;
        sunLight.shadow.camera.right = 250;
        sunLight.shadow.camera.top = 250;
        sunLight.shadow.camera.bottom = -250;
        scene.add(sunLight);

        const PLANET_RADIUS = 150;

        // 2. BINTANG & BUMI STATIK
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(8000 * 3);
        for(let i=0; i<24000; i++) starPositions[i] = (Math.random() - 0.5) * 1500;
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({color: 0xffffff, size: 1.2})));

        const earthMesh = new THREE.Mesh(
            new THREE.SphereGeometry(PLANET_RADIUS, 128, 128),
            new THREE.MeshLambertMaterial({color: 0x2e8b57})
        );
        earthMesh.receiveShadow = true;
        scene.add(earthMesh);

        // 3. PENGURUSAN OBJEK & COLLISION (LAT/LON MAPPING)
        const solidObstacles = [];

        function spawnOnPlanet(mesh, lat, lon, isSolid = false) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            mesh.position.x = -(PLANET_RADIUS * Math.sin(phi) * Math.cos(theta));
            mesh.position.z = (PLANET_RADIUS * Math.sin(phi) * Math.sin(theta));
            mesh.position.y = (PLANET_RADIUS * Math.cos(phi));

            mesh.lookAt(0, 0, 0);
            mesh.rotateX(Math.PI / 2);

            scene.add(mesh);

            if (isSolid) {
                solidObstacles.push({ pos: mesh.position.clone(), radius: 4.0 });
            }
            return mesh;
        }

        // --- GENERATE Ratusan Objek Kompleks (Ribuan Baris Logik Dipadatkan di Sini) ---
        // Bahan binaan terperinci untuk bandar raya penuh
        const buildingColors = [0x78909c, 0xb0bec5, 0x546e7a, 0x37474f, 0x90a4ae];
        const roofColors = [0xd32f2f, 0x1976d2, 0x388e3c, 0xf57c00, 0x7b1fa2];

        for (let i = 0; i < 150; i++) {
            const buildingGroup = new THREE.Group();
            const width = Math.random() * 4 + 3;
            const height = Math.random() * 16 + 6;
            const depth = Math.random() * 4 + 3;

            // Badan Bangunan Utama
            const bodyMat = new THREE.MeshLambertMaterial({color: buildingColors[Math.floor(Math.random() * buildingColors.length)]});
            const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), bodyMat);
            body.position.y = height / 2;
            body.castShadow = true; 
            body.receiveShadow = true;
            buildingGroup.add(body);

            // Lapisan Tingkap Bertingkat (Grid Detail)
            const floorCount = Math.floor(height / 2);
            const windowMat = new THREE.MeshBasicMaterial({color: 0xffeb3b}); // Lampu tingkap bernyala
            for(let f = 1; f < floorCount; f++) {
                const winGeo = new THREE.BoxGeometry(width + 0.1, 0.4, depth + 0.1);
                const winRow = new THREE.Mesh(winGeo, windowMat);
                winRow.position.y = f * 2;
                buildingGroup.add(winRow);
            }

            // Bumbung Pelbagai Bentuk
            const roofMat = new THREE.MeshLambertMaterial({color: roofColors[Math.floor(Math.random() * roofColors.length)]});
            const roofType = Math.random();
            let roof;
            if (roofType > 0.5) {
                roof = new THREE.Mesh(new THREE.ConeGeometry(width * 0.8, 3, 4), roofMat);
                roof.position.y = height + 1.5;
                roof.rotation.y = Math.PI / 4;
            } else {
                roof = new THREE.Mesh(new THREE.BoxGeometry(width * 0.7, 1.5, depth * 0.7), roofMat);
                roof.position.y = height + 0.75;
            }
            roof.castShadow = true;
            buildingGroup.add(roof);

            spawnOnPlanet(buildingGroup, (Math.random() - 0.5) * 140, (Math.random() - 0.5) * 360, true);
        }

        // Hutan Lebat & Pokok Detail
        for (let i = 0; i < 250; i++) {
            const treeGroup = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.4, 0.7, 3.5),
                new THREE.MeshLambertMaterial({color: 0x4e342e})
            );
            trunk.position.y = 1.75; 
            trunk.castShadow = true;

            const leaves = new THREE.Mesh(
                new THREE.DodecahedronGeometry(2.5),
                new THREE.MeshLambertMaterial({color: 0x1b5e20})
            );
            leaves.position.y = 4.2; 
            leaves.castShadow = true;

            treeGroup.add(trunk, leaves);
            spawnOnPlanet(treeGroup, (Math.random() - 0.5) * 148, (Math.random() - 0.5) * 360, true);
        }

        // 4. PEMBINAAN WATAK (PLAYER & NPC LENGKAP)
        function createCharacterModel(colorHex) {
            const group = new THREE.Group();
            
            // Badan / Torso
            const torso = new THREE.Mesh(
                new THREE.BoxGeometry(1.1, 1.6, 0.7),
                new THREE.MeshLambertMaterial({color: colorHex})
            );
            torso.position.y = 0.8; 
            torso.castShadow = true;

            // Kepala
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.5, 16, 16),
                new THREE.MeshLambertMaterial({color: 0xffccbc})
            );
            head.position.y = 2.1; 
            head.castShadow = true;

            // Kaki Kiri & Kanan
            const legMat = new THREE.MeshLambertMaterial({color: 0x37474f});
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.9, 0.4), legMat);
            leftLeg.position.set(-0.3, 0.45, 0); leftLeg.castShadow = true;
            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.9, 0.4), legMat);
            rightLeg.position.set(0.3, 0.45, 0); rightLeg.castShadow = true;

            group.add(torso, head, leftLeg, rightLeg);
            return group;
        }

        // Setup Player Utama
        const player = createCharacterModel(0xff1744); // Merah Terang
        scene.add(player);

        let pLat = 0;
        let pLon = 0;
        let pFacingAngle = 0;

        function refreshPlayerCoords() {
            const phi = (90 - pLat) * (Math.PI / 180);
            const theta = (pLon + 180) * (Math.PI / 180);

            player.position.x = -(PLANET_RADIUS * Math.sin(phi) * Math.cos(theta));
            player.position.z = (PLANET_RADIUS * Math.sin(phi) * Math.sin(theta));
            player.position.y = (PLANET_RADIUS * Math.cos(phi));

            player.lookAt(0, 0, 0);
            player.rotateX(Math.PI / 2);
            player.rotateY(pFacingAngle);
        }
        refreshPlayerCoords();

        // Setup Angkatan NPC yang Aktif Merayau
        const activeNPCs = [];
        for (let i = 0; i < 40; i++) {
            const npcMesh = createCharacterModel(0x00b0ff); // Biru Terang
            let nLat = (Math.random() - 0.5) * 135;
            let nLon = (Math.random() - 0.5) * 360;
            let nAngle = Math.random() * Math.PI * 2;

            const phi = (90 - nLat) * (Math.PI / 180);
            const theta = (nLon + 180) * (Math.PI / 180);
            npcMesh.position.set(
                -(PLANET_RADIUS * Math.sin(phi) * Math.cos(theta)),
                (PLANET_RADIUS * Math.cos(phi)),
                (PLANET_RADIUS * Math.sin(phi) * Math.sin(theta))
            );
            scene.add(npcMesh);

            activeNPCs.push({ mesh: npcMesh, lat: nLat, lon: nLon, angle: nAngle, stepSize: 0.018 });
        }

        // 5. SISTEM KAWALAN (KEYBOARD & TOUCH JOYSTICK)
        let controlTurn = 0;
        let controlWalk = 0;
        const keyboardKeys = {};

        window.addEventListener('keydown', e => keyboardKeys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keyboardKeys[e.key.toLowerCase()] = false);

        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let touchActive = false;
        let joystickCenter = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', e => {
            touchActive = true;
            const rect = joystickZone.getBoundingClientRect();
            joystickCenter = { x: rect.left + 65, y: rect.top + 65 };
            handleTouchMove(e.touches[0]);
        });
        joystickZone.addEventListener('touchmove', e => {
            if (touchActive) handleTouchMove(e.touches[0]);
        });
        joystickZone.addEventListener('touchend', () => {
            touchActive = false;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            controlTurn = 0;
            controlWalk = 0;
        });

        function handleTouchMove(touch) {
            let dx = touch.clientX - joystickCenter.x;
            let dy = touch.clientY - joystickCenter.y;
            const maxRadius = 40;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            controlTurn = -dx / maxRadius;
            controlWalk = -dy / maxRadius;
        }

        // 6. GAME LOOP UTAMA
        const statusText = document.getElementById('status');

        function gameLoop() {
            requestAnimationFrame(gameLoop);

            let targetTurn = 0;
            let targetWalk = 0;

            if (keyboardKeys['a']) targetTurn = 1;
            if (keyboardKeys['d']) targetTurn = -1;
            if (keyboardKeys['w']) targetWalk = 1;
            if (keyboardKeys['s']) targetWalk = -1;

            if (touchActive) {
                targetTurn = controlTurn;
                targetWalk = controlWalk;
            }

            if (targetTurn !== 0) {
                pFacingAngle += targetTurn * 0.045;
            }

            if (targetWalk !== 0) {
                const velocity = 0.18 * targetWalk;
                const prevLat = pLat;
                const prevLon = pLon;

                pLat += Math.cos(pFacingAngle) * velocity;
                pLon += Math.sin(pFacingAngle) * velocity;
                refreshPlayerCoords();

                let hasCollided = false;
                for (let obs of solidObstacles) {
                    if (player.position.distanceTo(obs.pos) < obs.radius) {
                        hasCollided = true;
                        break;
                    }
                }

                if (hasCollided) {
                    pLat = prevLat;
                    pLon = prevLon;
                    refreshPlayerCoords();
                    statusText.innerText = "Status: Terlanggar Dinding!";
                    statusText.style.color = "#ff5252";
                } else {
                    statusText.innerText = "Status: Berjalan";
                    statusText.style.color = "#69f0ae";
                }
            } else {
                statusText.innerText = "Status: Berhenti";
                statusText.style.color = "#f5f5f5";
            }

            // Kemaskini NPC Merayau
            activeNPCs.forEach(npc => {
                if (Math.random() < 0.02) npc.angle += (Math.random() - 0.5) * 1.5;
                npc.lat += Math.cos(npc.angle) * npc.stepSize;
                npc.lon += Math.sin(npc.angle) * npc.stepSize;

                const phi = (90 - npc.lat) * (Math.PI / 180);
                const theta = (npc.lon + 180) * (Math.PI / 180);
                npc.mesh.position.set(
                    -(PLANET_RADIUS * Math.sin(phi) * Math.cos(theta)),
                    (PLANET_RADIUS * Math.cos(phi)),
                    (PLANET_RADIUS * Math.sin(phi) * Math.sin(theta))
                );
                npc.mesh.lookAt(0, 0, 0);
                npc.mesh.rotateX(Math.PI / 2);
            });

            // Kawalan Kamera Stabil Di Belakang Player
            const worldUp = player.position.clone().normalize();
            const backVector = new THREE.Vector3(
                -Math.sin(pFacingAngle),
                0,
                -Math.cos(pFacingAngle)
            );

            const idealCameraPosition = player.position.clone()
                .add(worldUp.clone().multiplyScalar(5.5))
                .add(backVector.multiplyScalar(-14));

            camera.position.lerp(idealCameraPosition, 0.12);

            const lookAtTarget = player.position.clone().add(worldUp.clone().multiplyScalar(2));
            camera.lookAt(lookAtTarget);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        gameLoop();
    </script>
</body>
</html>
