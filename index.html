<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Complex Tiny World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-family: Arial; text-shadow: 2px 2px 2px #000; pointer-events: none; z-index: 10; }
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); z-index: 5; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui"><h2>Tiny World Explorer</h2><p>PC: WASD/Arrows | HP: Gunakan Joystick di bawah</p></div>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 50);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Pencahayaan
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(20, 30, 10);
        sun.castShadow = true;
        scene.add(sun);

        // Kumpulan Planet (Bumi berputar, pemain kekal di atas)
        const planetGroup = new THREE.Group();
        scene.add(planetGroup);

        const radius = 20;

        // 1. Laut & Darat (Bumi)
        const water = new THREE.Mesh(new THREE.SphereGeometry(radius * 0.98, 32, 32), new THREE.MeshPhongMaterial({color: 0x1E90FF, flatShading: true}));
        planetGroup.add(water);
        
        const earth = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 32), new THREE.MeshLambertMaterial({color: 0x3CB371}));
        earth.receiveShadow = true;
        planetGroup.add(earth);

        // Fungsi letak objek rawak
        function placeObject(mesh, r, isRoad = false) {
            const phi = Math.acos(2 * Math.random() - 1);
            const theta = Math.random() * Math.PI * 2;
            mesh.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
            mesh.lookAt(0,0,0);
            if(!isRoad) mesh.rotateX(Math.PI/2);
            planetGroup.add(mesh);
        }

        // 2. Gunung
        for(let i=0; i<15; i++) {
            const mountain = new THREE.Mesh(new THREE.ConeGeometry(2, 4, 5), new THREE.MeshLambertMaterial({color: 0x808080}));
            mountain.castShadow = true;
            placeObject(mountain, radius);
        }

        // 3. Pokok
        for(let i=0; i<40; i++) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1), new THREE.MeshLambertMaterial({color: 0x8B4513}));
            trunk.position.y = 0.5;
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2, 5), new THREE.MeshLambertMaterial({color: 0x228B22}));
            leaves.position.y = 1.5;
            tree.add(trunk, leaves);
            placeObject(tree, radius);
        }

        // 4. Bangunan Bandar & Jalan
        const cityMat = new THREE.MeshLambertMaterial({color: 0xFFF8DC});
        const roofMat = new THREE.MeshLambertMaterial({color: 0xB22222});
        for(let i=0; i<10; i++) {
            const bldg = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 2), cityMat);
            body.position.y = 1.5;
            const roof = new THREE.Mesh(new THREE.ConeGeometry(1.6, 1.5, 4), roofMat);
            roof.position.y = 3.75;
            roof.rotation.y = Math.PI/4;
            bldg.add(body, roof);
            placeObject(bldg, radius);
            
            // Jalan kecil dekat bangunan
            const road = new THREE.Mesh(new THREE.PlaneGeometry(3, 8), new THREE.MeshBasicMaterial({color: 0x333333}));
            placeObject(road, radius + 0.05, true);
        }

        // 5. NPC Rawak
        function createPerson(color) {
            const person = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), new THREE.MeshLambertMaterial({color: color}));
            body.position.y = 0.8;
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshLambertMaterial({color: 0xFFE4C4}));
            head.position.y = 1.5;
            person.add(body, head);
            return person;
        }
        for(let i=0; i<10; i++) {
            const npc = createPerson(Math.random() * 0xffffff);
            placeObject(npc, radius);
        }

        // 6. Pemain Utama (Kekal di Kutub Utara Bumi)
        const player = createPerson(0xFF0000); // Baju Merah
        player.position.set(0, radius, 0);
        scene.add(player); // Tambah pada scene, bukan planet

        camera.position.set(0, radius + 5, 12);
        camera.lookAt(player.position);

        // 7. Awan & Burung Berterbangan
        const skyGroup = new THREE.Group();
        scene.add(skyGroup);
        
        for(let i=0; i<8; i++) {
            const cloud = new THREE.Mesh(new THREE.SphereGeometry(Math.random()*2+1, 7, 7), new THREE.MeshLambertMaterial({color: 0xffffff, transparent: true, opacity: 0.8}));
            cloud.position.set((Math.random()-0.5)*40, radius + 8 + Math.random()*5, (Math.random()-0.5)*40);
            skyGroup.add(cloud);
        }
        const bird = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.8, 3), new THREE.MeshBasicMaterial({color: 0x000000}));
        bird.rotation.x = Math.PI/2;
        skyGroup.add(bird);

        // --- KAWALAN (PC & MOBILE) ---
        let moveX = 0, moveY = 0;
        
        // Keyboard
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Joystick (Mobile)
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let isDragging = false;
        let center = {x:0, y:0};

        zone.addEventListener('touchstart', e => {
            isDragging = true;
            const rect = zone.getBoundingClientRect();
            center = { x: rect.left + 60, y: rect.top + 60 };
            updateJoystick(e.touches[0]);
        });
        zone.addEventListener('touchmove', e => {
            if(isDragging) updateJoystick(e.touches[0]);
        });
        zone.addEventListener('touchend', () => {
            isDragging = false;
            knob.style.transform = `translate(0px, 0px)`;
            moveX = 0; moveY = 0;
        });

        function updateJoystick(touch) {
            let dx = touch.clientX - center.x;
            let dy = touch.clientY - center.y;
            const maxDist = 35;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxDist; moveY = dy / maxDist;
        }

        // --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Logik Pergerakan
            const speed = 0.03;
            let currentRotX = 0, currentRotZ = 0;

            if(keys['w'] || keys['arrowup']) currentRotX -= speed;
            if(keys['s'] || keys['arrowdown']) currentRotX += speed;
            if(keys['a'] || keys['arrowleft']) currentRotZ -= speed;
            if(keys['d'] || keys['arrowright']) currentRotZ += speed;

            if(moveY !== 0) currentRotX += moveY * speed;
            if(moveX !== 0) currentRotZ += moveX * speed;

            planetGroup.rotation.x += currentRotX;
            planetGroup.rotation.z += currentRotZ;

            // Animasi Alam
            skyGroup.rotation.y += 0.002; // Awan bergerak
            bird.position.set(Math.sin(Date.now()*0.001)*15, radius+6, Math.cos(Date.now()*0.001)*15);
            bird.lookAt(Math.sin((Date.now()+100)*0.001)*15, radius+6, Math.cos((Date.now()+100)*0.001)*15);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
