<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tiny World - Massive Update</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; }
        #ui { position: absolute; top: 10px; left: 20px; color: white; text-shadow: 2px 2px 2px #000; pointer-events: none; z-index: 10; }
        #ui p { margin: 5px 0; font-size: 14px; color: #ddd; }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); z-index: 5; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Dunia 3D: Player Moves!</h2>
        <p>PC: W (Jalan Depan), S (Undur), A/D (Pusing Kiri/Kanan) | HP: Joystick</p>
        <p id="status">Status: Sedia Berjalan!</p>
    </div>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. SETUP SCENE BERSKALA BESAR
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.003); // Kabus nipis sebab map besar

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(100, 200, 50);
        sun.castShadow = true;
        sun.shadow.camera.near = 50;
        sun.shadow.camera.far = 400;
        sun.shadow.camera.left = -150;
        sun.shadow.camera.right = 150;
        sun.shadow.camera.top = 150;
        sun.shadow.camera.bottom = -150;
        scene.add(sun);

        // Saiz Glob (Besar Gila)
        const radius = 150; 

        // Bintang kaku (Background)
        const starGeo = new THREE.BufferGeometry();
        const starCount = 5000;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i++) starPos[i] = (Math.random() - 0.5) * 1000;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.5})));

        // Glob / Tanah Kaku
        const earth = new THREE.Mesh(new THREE.SphereGeometry(radius, 128, 128), new THREE.MeshLambertMaterial({color: 0x2e8b57}));
        earth.receiveShadow = true;
        scene.add(earth);

        // 2. SISTEM LETAK OBJEK (Rigging System)
        // Cara paling selamat untuk benda lekat di bola. Kita pusingkan "Paksi Tengah" (Rig).
        const collisionPositions = []; // Simpan koordinat dunia untuk detect langgar dinding

        function placeObject(mesh, r, isCollidable = false) {
            const rig = new THREE.Group();
            // Random rotasi dari pusat bumi
            rig.rotation.set(Math.random() * Math.PI*2, Math.random() * Math.PI*2, Math.random() * Math.PI*2);
            
            // Tolak objek ke permukaan bola
            mesh.position.set(0, r, 0);
            
            // Random pusingan objek supaya tak pandang satu arah je
            mesh.rotation.y = Math.random() * Math.PI * 2; 

            rig.add(mesh);
            scene.add(rig);

            // Dapatkan posisi sebenar (World Position) untuk Collision
            if(isCollidable) {
                rig.updateMatrixWorld(true);
                const wPos = new THREE.Vector3();
                mesh.getWorldPosition(wPos);
                collisionPositions.push(wPos);
            }
            return rig;
        }

        // Bina Bangunan
        for(let i=0; i<80; i++) { // Lebih banyak bangunan sebab map besar
            const bldgGroup = new THREE.Group();
            const w = Math.random() * 4 + 2; const h = Math.random() * 8 + 4; const d = Math.random() * 4 + 2;
            const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({color: 0x8899aa}));
            body.position.y = h/2; body.castShadow = true; body.receiveShadow = true;
            bldgGroup.add(body);
            placeObject(bldgGroup, radius, true);
        }

        // Bina Pokok
        for(let i=0; i<150; i++) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 3), new THREE.MeshLambertMaterial({color: 0x5c4033}));
            trunk.position.y = 1.5; trunk.castShadow = true;
            const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(2.5), new THREE.MeshLambertMaterial({color: 0x228b22}));
            leaves.position.y = 4; leaves.castShadow = true;
            tree.add(trunk); tree.add(leaves);
            placeObject(tree, radius, true);
        }

        // 3. WATAK (PLAYER & NPC)
        function createCharacter(color) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.8), new THREE.MeshLambertMaterial({color: color}));
            body.position.y = 0.9; body.castShadow = true; // Jejak tanah
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), new THREE.MeshLambertMaterial({color: 0xffe4c4}));
            head.position.y = 2.4; head.castShadow = true;
            group.add(body); group.add(head);
            return group;
        }

        // Player Rig
        const playerRig = new THREE.Group();
        scene.add(playerRig);
        const playerMesh = createCharacter(0xFF0000); // Merah
        playerMesh.position.set(0, radius, 0); // Atas permukaan bumi
        playerRig.add(playerMesh);

        // Camera Rig (Ikut Player)
        const cameraRig = new THREE.Group();
        scene.add(cameraRig);
        cameraRig.add(camera);
        camera.position.set(0, radius + 8, 25); // Tinggi & belakang sikit dari player
        camera.lookAt(new THREE.Vector3(0, radius + 2, 0));

        // Letak NPC yang boleh bergerak
        const npcs = [];
        for(let i=0; i<40; i++) {
            const npcMesh = createCharacter(Math.random() * 0xffffff);
            const npcRig = placeObject(npcMesh, radius, true); // NPC pun keras
            npcs.push({ rig: npcRig, mesh: npcMesh, turnSpeed: 0, walkSpeed: Math.random() * 0.01 + 0.005 });
        }

        // 4. KAWALAN PLAYER (Joystick / Keyboard)
        let moveTurn = 0, moveWalk = 0;
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let isDragging = false, center = {x:0, y:0};

        zone.addEventListener('touchstart', e => {
            isDragging = true; center = { x: zone.getBoundingClientRect().left + 60, y: zone.getBoundingClientRect().top + 60 };
            updateJoystick(e.touches[0]);
        });
        zone.addEventListener('touchmove', e => { if(isDragging) updateJoystick(e.touches[0]); });
        zone.addEventListener('touchend', () => {
            isDragging = false; knob.style.transform = `translate(0px, 0px)`;
            moveTurn = 0; moveWalk = 0;
        });

        function updateJoystick(touch) {
            let dx = touch.clientX - center.x; let dy = touch.clientY - center.y;
            const maxDist = 35; const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveTurn = dx / maxDist; moveWalk = dy / maxDist;
        }

        // 5. GAME LOOP
        const uiStatus = document.getElementById('status');

        function animate() {
            requestAnimationFrame(animate);

            // A. UPDATE NPC (Bagi diorang merayau)
            npcs.forEach(npc => {
                if (Math.random() < 0.02) npc.turnSpeed = (Math.random() - 0.5) * 0.1; // Kadang2 tukar arah
                npc.mesh.rotation.y += npc.turnSpeed;
                // NPC jalan depan
                const rightAxis = new THREE.Vector3(1,0,0).applyQuaternion(npc.mesh.quaternion);
                npc.rig.rotateOnAxis(rightAxis, npc.walkSpeed);
            });

            // B. UPDATE PLAYER KAWALAN
            let intentTurn = 0;
            let intentWalk = 0;

            if (keys['a']) intentTurn = 1;
            if (keys['d']) intentTurn = -1;
            if (keys['w']) intentWalk = 1;
            if (keys['s']) intentWalk = -1;

            if (isDragging) {
                intentTurn = -moveTurn;
                intentWalk = -moveWalk; // Atas joystick = negatif Y
            }

            // C. PERGERAKAN PLAYER
            if (intentTurn !== 0) {
                playerMesh.rotation.y += intentTurn * 0.05; // Pusing badan
            }

            if (intentWalk !== 0) {
                // Cari paksi X lokal watak (sebab dia pandang Z lokal)
                const rightAxis = new THREE.Vector3(1,0,0).applyQuaternion(playerMesh.quaternion);
                
                // Cuba gerak ke depan/belakang
                const walkSpeed = 0.03;
                playerRig.rotateOnAxis(rightAxis, intentWalk * walkSpeed);

                // D. COLLISION CHECK (Check Tembus Dinding)
                playerRig.updateMatrixWorld(true);
                const pPos = new THREE.Vector3();
                playerMesh.getWorldPosition(pPos); // Dapatkan koordinat player sekarang
                
                let isHit = false;
                for(let bPos of collisionPositions) {
                    if (pPos.distanceTo(bPos) < 2.8) { // Radius langgar (sesuaikan kalau sangkut)
                        isHit = true; break;
                    }
                }

                if (isHit) {
                    // Kalau langgar, batalkan pergerakan (undur balik)
                    playerRig.rotateOnAxis(rightAxis, -intentWalk * walkSpeed);
                    uiStatus.innerText = "Status: Terlanggar Dinding!";
                    uiStatus.style.color = "#ff4444";
                } else {
                    uiStatus.innerText = "Status: Sedia Berjalan!";
                    uiStatus.style.color = "#ddd";
                }
            } else {
                uiStatus.innerText = "Status: Berhenti";
                uiStatus.style.color = "#ddd";
            }

            // E. KAMERA FOLLOW PLAYER DENGAN SMOOTH
            cameraRig.quaternion.slerp(playerRig.quaternion, 0.1);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
