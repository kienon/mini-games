<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tiny World - True Player Movement</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; }
        #ui { position: absolute; top: 15px; left: 20px; color: white; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; }
        #ui h2 { margin: 0 0 5px 0; font-size: 20px; color: #ffeb3b; }
        #ui p { margin: 3px 0; font-size: 13px; color: #e0e0e0; }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; background: rgba(255,255,255,0.12); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); z-index: 5; }
        #joystick-knob { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(255,255,255,0.85); border-radius: 50%; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Tiny World: Perfect Controls</h2>
        <p>PC: W (Depan) | S (Undur) | A/D (Pusing Kiri/Kanan)</p>
        <p id="status">Status: Ready to Explore</p>
    </div>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. SETUP ASAS
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020208);
        scene.fog = new THREE.FogExp2(0x020208, 0.002);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);
        
        const sun = new THREE.DirectionalLight(0xffffff, 1.3);
        sun.position.set(200, 300, 150);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 50;
        sun.shadow.camera.far = 800;
        sun.shadow.camera.left = -200;
        sun.shadow.camera.right = 200;
        sun.shadow.camera.top = 200;
        sun.shadow.camera.bottom = -200;
        scene.add(sun);

        const PLANET_RADIUS = 120;

        // 2. BINTANG & BUMI (STATIK)
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(6000 * 3);
        for(let i=0; i<18000; i++) starPos[i] = (Math.random() - 0.5) * 1200;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.2})));

        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(PLANET_RADIUS, 128, 128),
            new THREE.MeshLambertMaterial({color: 0x2e8b57})
        );
        earth.receiveShadow = true;
        scene.add(earth);

        // 3. SISTEM KOORDINAT SFERA & OBJEK (BANGUNAN & NPC)
        const obstacles = []; // Simpan data kedudukan untuk halang player tembus

        // Fungsi bantu letak objek guna sudut latitud (lat) & longitud (lon)
        function createObjectAtLatLon(mesh, lat, lon, isSolid = false) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            // Cari kedudukan 3D atas permukaan sfera
            mesh.position.x = -(PLANET_RADIUS * Math.sin(phi) * Math.cos(theta));
            mesh.position.z = (PLANET_RADIUS * Math.sin(phi) * Math.sin(theta));
            mesh.position.y = (PLANET_RADIUS * Math.cos(phi));

            // Tegakkan objek supaya selari dengan normal permukaan bumi
            mesh.lookAt(0, 0, 0);
            mesh.rotateX(Math.PI / 2);

            scene.add(mesh);

            if (isSolid) {
                obstacles.push({ pos: mesh.position.clone(), radius: 3.5 });
            }
            return mesh;
        }

        // Jana Bangunan Rawak
        for (let i = 0; i < 50; i++) {
            const bldgGroup = new THREE.Group();
            const w = Math.random() * 3 + 2;
            const h = Math.random() * 8 + 4;
            const d = Math.random() * 3 + 2;
            
            const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({color: 0x90a4ae}));
            body.position.y = h / 2;
            body.castShadow = true; body.receiveShadow = true;
            bldgGroup.add(body);

            const randomLat = (Math.random() - 0.5) * 140;
            const randomLon = (Math.random() - 0.5) * 360;
            createObjectAtLatLon(bldgGroup, randomLat, randomLon, true);
        }

        // Jana Pokok
        for (let i = 0; i < 80; i++) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 2.5), new THREE.MeshLambertMaterial({color: 0x5c4033}));
            trunk.position.y = 1.25; trunk.castShadow = true;
            const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(2), new THREE.MeshLambertMaterial({color: 0x228b22}));
            leaves.position.y = 3.2; leaves.castShadow = true;
            tree.add(trunk, leaves);

            createObjectAtLatLon(tree, (Math.random() - 0.5) * 150, (Math.random() - 0.5) * 360, true);
        }

        // 4. WATAK PLAYER (KONTROL SEBENAR)
        function createHuman(color) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.6, 0.6), new THREE.MeshLambertMaterial({color: color}));
            body.position.y = 0.8; body.castShadow = true;
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), new THREE.MeshLambertMaterial({color: `#ffe0bd`}));
            head.position.y = 2.1; head.castShadow = true;
            group.add(body, head);
            return group;
        }

        const player = createHuman(0xe91e63); // Pink/Merah terang
        scene.add(player);

        // Data kedudukan player dalam Latitud & Longitud
        let playerLat = 0;
        let playerLon = 0;
        let playerFacingAngle = 0; // Sudut pusingan badan player

        // Fungsi kemaskini posisi 3D player berdasarkan lat/lon
        function updatePlayerPosition() {
            const phi = (90 - playerLat) * (Math.PI / 180);
            const theta = (playerLon + 180) * (Math.PI / 180);

            player.position.x = -(PLANET_RADIUS * Math.sin(phi) * Math.cos(theta));
            player.position.z = (PLANET_RADIUS * Math.sin(phi) * Math.sin(theta));
            player.position.y = (PLANET_RADIUS * Math.cos(phi));

            // Halakan player ke pusat bumi dulu, kemudian pusing ikut arah pandangan
            player.lookAt(0, 0, 0);
            player.rotateX(Math.PI / 2);
            player.rotateY(playerFacingAngle);
        }
        updatePlayerPosition();

        // 5. NPC MERAYAU
        const npcs = [];
        for (let i = 0; i < 20; i++) {
            const npcMesh = createHuman(0x2196f3); // Biru
            let nLat = (Math.random() - 0.5) * 130;
            let nLon = (Math.random() - 0.5) * 360;
            let nAngle = Math.random() * Math.PI * 2;
            
            // Letak dalam scene
            const phi = (90 - nLat) * (Math.PI / 180);
            const theta = (nLon + 180) * (Math.PI / 180);
            npcMesh.position.set(
                -(PLANET_RADIUS * Math.sin(phi) * Math.cos(theta)),
                (PLANET_RADIUS * Math.cos(phi)),
                (PLANET_RADIUS * Math.sin(phi) * Math.sin(theta))
            );
            scene.add(npcMesh);

            npcs.push({ mesh: npcMesh, lat: nLat, lon: nLon, angle: nAngle, speed: 0.03 });
        }

        // 6. KAWALAN (KEYBOARD & TOUCH JOYSTICK)
        let inputTurn = 0; // A / D
        let inputWalk = 0; // W / S
        const keys = {};

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let isDragging = false, center = {x:0, y:0};

        zone.addEventListener('touchstart', e => {
            isDragging = true;
            center = { x: zone.getBoundingClientRect().left + 65, y: zone.getBoundingClientRect().top + 65 };
            updateJoystick(e.touches[0]);
        });
        zone.addEventListener('touchmove', e => { if(isDragging) updateJoystick(e.touches[0]); });
        zone.addEventListener('touchend', () => {
            isDragging = false; knob.style.transform = `translate(0px, 0px)`;
            inputTurn = 0; inputWalk = 0;
        });

        function updateJoystick(touch) {
            let dx = touch.clientX - center.x; let dy = touch.clientY - center.y;
            const maxDist = 40; const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            inputTurn = -dx / maxDist; // Kiri/Kanan
            inputWalk = -dy / maxDist; // Depan/Belakang
        }

        // 7. GAME LOOP UTAMA
        const statusEl = document.getElementById('status');

        function animate() {
            requestAnimationFrame(animate);

            // A. Kawalan Input PC (WASD)
            let targetTurn = 0;
            let targetWalk = 0;

            if (keys['a']) targetTurn = 1;
            if (keys['d']) targetTurn = -1;
            if (keys['w']) targetWalk = 1;
            if (keys['s']) targetWalk = -1;

            if (isDragging) {
                targetTurn = inputTurn;
                targetWalk = inputWalk;
            }

            // Pusing badan player
            if (targetTurn !== 0) {
                playerFacingAngle += targetTurn * 0.04;
            }

            // Gerak player atas permukaan sfera jika ada input 'W' atau 'S'
            if (targetWalk !== 0) {
                const moveSpeed = 0.15 * targetWalk;
                
                // Simpan posisi lama untuk rollback kalau langgar dinding
                const oldLat = playerLat;
                const oldLon = playerLon;

                // Hitung arah gerak mengikut sudut pandangan player
                playerLat += Math.cos(playerFacingAngle) * moveSpeed;
                playerLon += Math.sin(playerFacingAngle) * moveSpeed;

                updatePlayerPosition();

                // Cek Pelanggaran (Collision dengan bangunan/pokok)
                let collided = false;
                for (let obs of obstacles) {
                    if (player.position.distanceTo(obs.pos) < obs.radius) {
                        collided = true;
                        break;
                    }
                }

                if (collided) {
                    // Kalau langgar, pulangkan balik posisi asal
                    playerLat = oldLat;
                    playerLon = oldLon;
                    updatePlayerPosition();
                    statusEl.innerText = "Status: Terlanggar Dinding!";
                    statusEl.style.color = "#ff5252";
                } else {
                    statusEl.innerText = "Status: Berjalan Cergas";
                    statusEl.style.color = "#69f0ae";
                }
            } else {
                statusEl.innerText = "Status: Berhenti";
                statusEl.style.color = "#e0e0e0";
            }

            // B. Update NPC Bergerak Rawak
            npcs.forEach(n => {
                if (Math.random() < 0.03) n.angle += (Math.random() - 0.5) * 1.5;
                n.lat += Math.cos(n.angle) * n.speed;
                n.lon += Math.sin(n.angle) * n.speed;

                const phi = (90 - n.lat) * (Math.PI / 180);
                const theta = (n.lon + 180) * (Math.PI / 180);
                n.mesh.position.set(
                    -(PLANET_RADIUS * Math.sin(phi) * Math.cos(theta)),
                    (PLANET_RADIUS * Math.cos(phi)),
                    (PLANET_RADIUS * Math.sin(phi) * Math.sin(theta))
                );
                n.mesh.lookAt(0, 0, 0);
                n.mesh.rotateX(Math.PI / 2);
            });

            // C. Kamera Mengikut Belakang Player dengan Cantik & Smooth
            // Cari vektor 'atas' dari pusat bumi ke player (Normal Vector)
            const normal = player.position.clone().normalize();
            
            // Letak kamera di belakang player (ikut arah pandangan player)
            const backwardOffset = new THREE.Vector3(
                -Math.sin(playerFacingAngle),
                0,
                -Math.cos(playerFacingAngle)
            ).applyAxisAngle(normal, 0); // Selari dengan lengkung permukaan

            // Sasaran kedudukan kamera: Sedikit ke belakang dan di atas player
            const targetCamPos = player.position.clone()
                .add(normal.clone().multiplyScalar(6)) // Ketinggian kamera dari tanah
                .add(backwardOffset.multiplyScalar(-12)); // Jarak ke belakang

            camera.position.lerp(targetCamPos, 0.1); // Gerak smooth (lerp)
            
            // Kamera sentiasa pandang kepala player
            const lookTarget = player.position.clone().add(normal.clone().multiplyScalar(2));
            camera.lookAt(lookTarget);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
