<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        #joystick { position: absolute; bottom: 50px; left: 50px; width: 100px; height: 100px; background: rgba(255,255,255,0.3); border-radius: 50%; border: 2px solid white; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="joystick"></div>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Planet
        const earth = new THREE.Mesh(new THREE.SphereGeometry(10, 32, 32), new THREE.MeshLambertMaterial({color: 0x4CAF50}));
        earth.receiveShadow = true;
        scene.add(earth);

        // Tambah Bangunan Kartun (Real-look)
        function addBuilding() {
            const group = new THREE.Group();
            const box = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshLambertMaterial({color: 0xffffff}));
            const roof = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1, 4), new THREE.MeshLambertMaterial({color: 0xff0000}));
            roof.position.y = 1.5;
            group.add(box, roof);
            
            const lat = Math.random() * Math.PI;
            const lon = Math.random() * Math.PI * 2;
            group.position.set(10 * Math.sin(lat) * Math.cos(lon), 10 * Math.cos(lat), 10 * Math.sin(lat) * Math.sin(lon));
            group.lookAt(0,0,0);
            scene.add(group);
        }
        for(let i=0; i<20; i++) addBuilding();

        // Player (Simple Capsule/Cartoon Human)
        const player = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.7), new THREE.MeshLambertMaterial({color: 0x0000ff}));
        player.position.y = 10.7;
        scene.add(player);

        camera.position.set(0, 15, 15);
        camera.lookAt(0, 10, 0);

        // Touch Control Logic
        document.getElementById('joystick').addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            player.position.x += (touch.clientX - window.innerWidth/2) * 0.001;
            player.position.z += (touch.clientY - window.innerHeight/2) * 0.001;
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
