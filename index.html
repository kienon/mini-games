<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tiny Planet — Living World Fixed</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}

#ui{
 position:fixed;top:14px;left:18px;z-index:20;color:white;
 text-shadow:0 2px 5px #000;pointer-events:none
}
#ui h2{margin:0 0 6px;font-size:20px}
#ui p{margin:3px 0;font-size:13px;color:#e2e8ef}
#status{font-weight:bold;margin-top:8px!important}

#stats{
 position:fixed;right:18px;top:14px;z-index:20;
 color:white;text-align:right;font-size:12px;
 line-height:18px;text-shadow:0 2px 5px #000;
 pointer-events:none
}

#time{
 position:fixed;top:72px;left:50%;transform:translateX(-50%);
 z-index:20;color:white;font-size:13px;
 padding:7px 15px;border-radius:20px;
 background:rgba(0,0,0,.25);
 border:1px solid rgba(255,255,255,.2);
 backdrop-filter:blur(7px);
 pointer-events:none
}

#joystick-zone{
 position:fixed;left:25px;bottom:28px;
 width:145px;height:145px;z-index:30;
 border-radius:50%;
 background:rgba(255,255,255,.09);
 border:2px solid rgba(255,255,255,.3);
 box-shadow:inset 0 0 25px rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.35)
}

#joystick-knob{
 position:absolute;left:42px;top:42px;
 width:58px;height:58px;border-radius:50%;
 background:rgba(255,255,255,.85);
 box-shadow:0 5px 15px rgba(0,0,0,.45);
 pointer-events:none;
 will-change:transform
}

#help{
 position:fixed;right:18px;bottom:18px;z-index:20;
 color:white;font-size:12px;padding:8px 12px;
 background:rgba(0,0,0,.25);border-radius:8px;
 border:1px solid rgba(255,255,255,.15);
 pointer-events:none
}

@media(max-width:700px){
 #ui h2{font-size:16px}
 #ui p{font-size:11px}
 #help{display:none}
}
</style>
</head>

<body>

<div id="ui">
    <h2>🌍 Tiny Planet</h2>
    <p>PC: W/S Jalan · A/D Pusing</p>
    <p>Mobile: Joystick</p>
    <p id="status">Status: Ready</p>
</div>

<div id="stats">
    <div id="fps">FPS: --</div>
    <div id="speed">Speed: 0</div>
    <div id="npc">NPC: 0</div>
</div>

<div id="time">☀️ 12:00 · Day</div>

<div id="joystick-zone">
    <div id="joystick-knob"></div>
</div>

<div id="help">Explore the planet 🌎</div>

<script type="importmap">
{
    "imports":{
        "three":"https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>

<script type="module">

import * as THREE from "three";

/* =========================================================
   CONFIG (Kelajuan diperlahankan supaya selesa dikawal)
========================================================= */

const CFG = {
    radius: 220,

    playerSpeed: 4.5,     // Diturunkan dari 10 ke 4.5
    reverseSpeed: 2.2,    // Diturunkan dari 5 ke 2.2
    acceleration: 5,
    deceleration: 7,
    turnSpeed: 1.8,       // Pusingan lebih lembut

    cameraDistance: 16,
    cameraHeight: 6.5,
    cameraLook: 2.6,
    cameraSmooth: 6,

    npcCount: 25,
    buildings: 55,
    trees: 250,
    rocks: 120,
    grass: 180,

    dayLength: 240,
    cloudHeight: 12
};


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x75c4ff);
scene.fog = new THREE.FogExp2(0x75c4ff, 0.0018);


/* =========================================================
   CAMERA & RENDERER
========================================================= */

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 1800);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);


/* =========================================================
   LIGHTS
========================================================= */

const ambient = new THREE.HemisphereLight(0xbfe9ff, 0x29442a, 1.5);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 700;
sun.shadow.camera.left = -280;
sun.shadow.camera.right = 280;
sun.shadow.camera.top = 280;
sun.shadow.camera.bottom = -280;
sun.shadow.bias = -0.0004;
scene.add(sun);

const moonLight = new THREE.DirectionalLight(0x8da9ff, 0.25);
scene.add(moonLight);


/* =========================================================
   PLANET & ENVIRONMENT
========================================================= */

const planet = new THREE.Mesh(
    new THREE.SphereGeometry(CFG.radius, 128, 128),
    new THREE.MeshStandardMaterial({ color: 0x3e9850, roughness: 1, metalness: 0 })
);
planet.receiveShadow = true;
scene.add(planet);

const atmosphere = new THREE.Mesh(
    new THREE.SphereGeometry(CFG.radius + 4, 64, 64),
    new THREE.MeshBasicMaterial({ color: 0x79cfff, transparent: true, opacity: .075, side: THREE.BackSide })
);
scene.add(atmosphere);

// Stars
const starGeometry = new THREE.BufferGeometry();
const starCount = 4500;
const starPositions = new Float32Array(starCount * 3);
for(let i=0; i<starCount; i++){
    const d = new THREE.Vector3(Math.random()-.5, Math.random()-.5, Math.random()-.5).normalize();
    const r = 750 + Math.random()*300;
    starPositions[i*3] = d.x*r;
    starPositions[i*3+1] = d.y*r;
    starPositions[i*3+2] = d.z*r;
}
starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 1.4, transparent: true, opacity: 0 }));
scene.add(stars);

// Moon
const moon = new THREE.Mesh(
    new THREE.SphereGeometry(7, 32, 32),
    new THREE.MeshStandardMaterial({ color: 0xd9e1ec, roughness: 1 })
);
scene.add(moon);


/* =========================================================
   HELPERS
========================================================= */

function randomDirection(){
    return new THREE.Vector3(Math.random()-.5, Math.random()-.5, Math.random()-.5).normalize();
}

function tangent(normal, direction){
    const result = direction.clone();
    result.sub(normal.clone().multiplyScalar(direction.dot(normal)));
    if(result.lengthSq() < 0.000001){
        result.set(1,0,0);
        result.sub(normal.clone().multiplyScalar(result.dot(normal)));
    }
    return result.normalize();
}

function surfacePosition(normal, height=0){
    return normal.clone().multiplyScalar(CFG.radius + height);
}

function placeOnPlanet(object, normal, height=0){
    object.position.copy(surfacePosition(normal, height));
    object.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), normal);
    scene.add(object);
}


/* =========================================================
   COLLISION
========================================================= */

const colliders = [];

function addCollider(object, radius){
    colliders.push({ object, radius });
}

function collision(position, radius){
    for(const c of colliders){
        if(position.distanceTo(c.object.position) < radius + c.radius){
            return true;
        }
    }
    return false;
}


/* =========================================================
   BUILDINGS & NATURE
========================================================= */

const buildingColors = [0x7e8d99, 0x9b9fa3, 0x788c9b, 0xb39f83, 0x657887];

function createBuilding(){
    const group = new THREE.Group();
    const w = 3 + Math.random()*4;
    const d = 3 + Math.random()*4;
    const h = 5 + Math.random()*10;

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color: buildingColors[Math.floor(Math.random()*buildingColors.length)], roughness: .9 })
    );
    body.position.y = h/2;
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);

    const roof = new THREE.Mesh(
        new THREE.ConeGeometry(Math.max(w,d)*.72, 2.2, 4),
        new THREE.MeshStandardMaterial({ color: 0x554139, roughness: 1 })
    );
    roof.position.y = h + 1;
    roof.rotation.y = Math.PI/4;
    roof.castShadow = true;
    group.add(roof);

    return group;
}

for(let i=0; i<CFG.buildings; i++){
    const n = randomDirection();
    const b = createBuilding();
    b.rotation.y = Math.random() * Math.PI * 2;
    placeOnPlanet(b, n, .1);
    addCollider(b, 3);
}

function createTree(){
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(.35, .65, 4, 8),
        new THREE.MeshStandardMaterial({ color: 0x62432b, roughness: 1 })
    );
    trunk.position.y = 2;
    trunk.castShadow = true;
    tree.add(trunk);

    const crown = new THREE.Mesh(
        new THREE.DodecahedronGeometry(2.4, 1),
        new THREE.MeshStandardMaterial({ color: 0x21863c, roughness: 1 })
    );
    crown.position.y = 4.5;
    crown.castShadow = true;
    tree.add(crown);
    return tree;
}

for(let i=0; i<CFG.trees; i++){
    const n = randomDirection();
    const tree = createTree();
    tree.scale.setScalar(.65 + Math.random()*.7);
    tree.rotation.y = Math.random() * Math.PI * 2;
    placeOnPlanet(tree, n, .1);
    addCollider(tree, 2);
}

for(let i=0; i<CFG.rocks; i++){
    const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1 + Math.random()*1.4, 0),
        new THREE.MeshStandardMaterial({ color: 0x73756f, roughness: 1 })
    );
    rock.scale.y = .45 + Math.random()*.5;
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    rock.castShadow = true;
    const n = randomDirection();
    placeOnPlanet(rock, n, .3);
    addCollider(rock, 1.3);
}


/* =========================================================
   CHARACTER (PLAYER & NPC)
========================================================= */

function createCharacter(color){
    const group = new THREE.Group();
    const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 1.8, .8),
        new THREE.MeshStandardMaterial({ color, roughness: .8 })
    );
    body.position.y = 1.1;
    body.castShadow = true;
    group.add(body);

    const head = new THREE.Mesh(
        new THREE.SphereGeometry(.6, 20, 20),
        new THREE.MeshStandardMaterial({ color: 0xffd2b5, roughness: .9 })
    );
    head.position.y = 2.55;
    head.castShadow = true;
    group.add(head);

    const legMaterial = new THREE.MeshStandardMaterial({ color: 0x303844, roughness: .9 });
    const leg = new THREE.Mesh(new THREE.BoxGeometry(.38, .9, .45), legMaterial);
    leg.position.set(-.3, .45, 0);
    leg.castShadow = true;
    group.add(leg);

    const leg2 = leg.clone();
    leg2.position.x = .3;
    group.add(leg2);

    group.userData.leftLeg = leg;
    group.userData.rightLeg = leg2;
    return group;
}

// Player Setup
const player = new THREE.Group();
scene.add(player);
const playerMesh = createCharacter(0xe53935);
player.add(playerMesh);

let playerNormal = new THREE.Vector3(0,1,0);
let playerForward = new THREE.Vector3(0,0,1);
player.position.copy(surfacePosition(playerNormal, .1));

function orientActor(object, normal, forward){
    const f = tangent(normal, forward);
    const right = new THREE.Vector3().crossVectors(normal, f).normalize();
    const matrix = new THREE.Matrix4();
    matrix.makeBasis(right, normal, f);
    object.quaternion.setFromRotationMatrix(matrix);
}

orientActor(player, playerNormal, playerForward);

let playerSpeed = 0;
let walkTime = 0;

// NPC Setup
const npcs = [];
for(let i=0; i<CFG.npcCount; i++){
    const npc = new THREE.Group();
    const colors = [0x2196f3, 0xffc107, 0x9c27b0, 0x00acc1, 0xff7043, 0x66bb6a];
    const mesh = createCharacter(colors[Math.floor(Math.random()*colors.length)]);
    npc.add(mesh);

    let normal;
    do { normal = randomDirection(); } while(normal.distanceTo(playerNormal) < .15);

    let forward = tangent(normal, randomDirection());
    npc.position.copy(surfacePosition(normal, .1));
    orientActor(npc, normal, forward);
    scene.add(npc);

    npcs.push({
        object: npc,
        mesh,
        normal,
        forward,
        speed: 0.5 + Math.random() * 0.6, // NPC diperlahankan
        timer: 1 + Math.random() * 4,
        targetTurn: 0,
        turn: 0,
        walk: Math.random() * 10
    });
}


/* =========================================================
   INPUT & JOYSTICK
========================================================= */

const keys = {};
addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

const zone = document.getElementById("joystick-zone");
const knob = document.getElementById("joystick-knob");
let joystickActive = false;
let joyX = 0, joyY = 0, joyPointer = null;

function resetJoystick(){
    joystickActive = false;
    joyPointer = null;
    joyX = 0; joyY = 0;
    knob.style.transform = "translate(0px,0px)";
}

function updateJoystick(x, y){
    const rect = zone.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    let dx = x - cx;
    let dy = y - cy;
    const max = 43;
    const dist = Math.hypot(dx, dy);
    if(dist > max){
        dx = dx/dist * max;
        dy = dy/dist * max;
    }
    joyX = dx / max;
    joyY = dy / max;
    knob.style.transform = `translate(${dx}px,${dy}px)`;
}

zone.addEventListener("pointerdown", e => {
    joystickActive = true;
    joyPointer = e.pointerId;
    zone.setPointerCapture(e.pointerId);
    updateJoystick(e.clientX, e.clientY);
});
zone.addEventListener("pointermove", e => {
    if(!joystickActive || e.pointerId !== joyPointer) return;
    updateJoystick(e.clientX, e.clientY);
});
zone.addEventListener("pointerup", resetJoystick);
zone.addEventListener("pointercancel", resetJoystick);

function getInput(){
    let turn = 0, walk = 0;
    if(keys["a"] || keys["arrowleft"]) turn = -1;
    if(keys["d"] || keys["arrowright"]) turn = 1;
    if(keys["w"] || keys["arrowup"]) walk = 1;
    if(keys["s"] || keys["arrowdown"]) walk = -1;

    if(joystickActive){
        turn = -joyX;
        walk = -joyY;
    }
    return { turn, walk };
}


/* =========================================================
   MOVEMENT LOGIC
========================================================= */

function rotateTangent(vector, normal, angle){
    const q = new THREE.Quaternion();
    q.setFromAxisAngle(normal, angle);
    return tangent(normal, vector.clone().applyQuaternion(q));
}

function moveOnPlanet(position, normal, forward, distance){
    const p = position.clone();
    p.add(forward.clone().multiplyScalar(distance));
    const newNormal = p.normalize();
    const newForward = tangent(newNormal, forward);
    return {
        position: surfacePosition(newNormal, .1),
        normal: newNormal,
        forward: newForward
    };
}


/* =========================================================
   GAME LOOP UPDATES
========================================================= */

function updatePlayer(dt){
    const input = getInput();

    if(Math.abs(input.turn) > .02){
        playerForward = rotateTangent(playerForward, playerNormal, input.turn * CFG.turnSpeed * dt);
    }

    let targetSpeed = 0;
    if(input.walk > 0){
        targetSpeed = CFG.playerSpeed * input.walk;
    } else if(input.walk < 0){
        targetSpeed = CFG.reverseSpeed * input.walk;
    }

    const rate = Math.abs(targetSpeed) > Math.abs(playerSpeed) ? CFG.acceleration : CFG.deceleration;
    playerSpeed = THREE.MathUtils.damp(playerSpeed, targetSpeed, rate, dt);

    if(Math.abs(playerSpeed) > .01){
        const movement = moveOnPlanet(player.position, playerNormal, playerForward, playerSpeed * dt);
        if(!collision(movement.position, 1.8)){
            player.position.copy(movement.position);
            playerNormal.copy(movement.normal);
            playerForward.copy(movement.forward);
        } else {
            playerSpeed *= .15;
        }
    }

    orientActor(player, playerNormal, playerForward);

    if(Math.abs(playerSpeed) > .2){
        walkTime += dt * Math.abs(playerSpeed) * 1.5;
    }

    const strength = Math.min(1, Math.abs(playerSpeed) / CFG.playerSpeed);
    const swing = Math.sin(walkTime * 7) * .42 * strength;
    playerMesh.userData.leftLeg.rotation.x = swing;
    playerMesh.userData.rightLeg.rotation.x = -swing;

    const status = document.getElementById("status");
    if(Math.abs(playerSpeed) < .05){
        status.textContent = "Status: Berhenti";
        status.style.color = "#ddd";
    } else {
        status.textContent = "Status: Menjelajah 🌍";
        status.style.color = "#8cff9a";
    }
}

function updateNPC(npc, dt){
    npc.timer -= dt;
    if(npc.timer <= 0){
        npc.timer = 1.5 + Math.random() * 4;
        npc.targetTurn = (Math.random() - .5) * 1.1;
    }
    npc.turn = THREE.MathUtils.damp(npc.turn, npc.targetTurn, 2.5, dt);
    npc.forward = rotateTangent(npc.forward, npc.normal, npc.turn * dt);

    const movement = moveOnPlanet(npc.object.position, npc.normal, npc.forward, npc.speed * dt);
    npc.object.position.copy(movement.position);
    npc.normal.copy(movement.normal);
    npc.forward.copy(movement.forward);
    orientActor(npc.object, npc.normal, npc.forward);

    npc.walk += dt * npc.speed * 1.5;
    const swing = Math.sin(npc.walk * 6) * .32;
    npc.mesh.userData.leftLeg.rotation.x = swing;
    npc.mesh.userData.rightLeg.rotation.x = -swing;
}

// Awan
const cloudGroup = new THREE.Group();
scene.add(cloudGroup);

for(let i=0; i<18; i++){
    const n = randomDirection();
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: .72 });
    for(let j=0; j<3; j++){
        const puff = new THREE.Mesh(new THREE.SphereGeometry(3 + Math.random()*3, 12, 12), mat);
        puff.position.set(j*4, Math.random()*2, (Math.random()-.5)*4);
        group.add(puff);
    }
    placeOnPlanet(group, n, CFG.cloudHeight + Math.random()*10);
    cloudGroup.add(group);
}

// Day / Night System
let dayTime = .25;
function updateDayNight(dt){
    dayTime += dt / CFG.dayLength;
    if(dayTime >= 1) dayTime -= 1;

    const angle = dayTime * Math.PI * 2 - Math.PI / 2;
    const sunDistance = 520;

    sun.position.set(Math.cos(angle)*sunDistance, Math.sin(angle)*sunDistance, 140);
    moon.position.set(-sun.position.x*.85, -sun.position.y*.85, -sun.position.z*.85);
    moonLight.position.copy(moon.position);

    const elevation = Math.sin(angle);
    const daylight = THREE.MathUtils.clamp(elevation, 0, 1);
    const twilight = THREE.MathUtils.smoothstep(elevation, -.22, .22);

    sun.intensity = .15 + daylight * 2.15;
    moonLight.intensity = .04 + (1 - daylight) * .45;
    ambient.intensity = .22 + twilight * 1.3;

    const dayColor = new THREE.Color(0x75c8ff);
    const nightColor = new THREE.Color(0x050a20);
    const sunsetColor = new THREE.Color(0xf09a63);
    let sky;

    if(elevation > -.18 && elevation < .18){
        sky = sunsetColor.clone().lerp(dayColor, (elevation + .18) / .36);
    } else if(elevation >= .18){
        sky = nightColor.clone().lerp(dayColor, Math.min(1, daylight));
    } else {
        sky = nightColor.clone();
    }

    scene.background.copy(sky);
    scene.fog.color.copy(sky);
    stars.material.opacity = THREE.MathUtils.clamp(1 - twilight, 0, 1);

    const totalMinutes = dayTime * 24 * 60;
    const hours = Math.floor(totalMinutes / 60);
    const minutes = Math.floor(totalMinutes % 60);
    let period = elevation > .08 ? "Day" : elevation > -.08 ? "Twilight" : "Night";
    let icon = period === "Day" ? "☀️" : period === "Night" ? "🌙" : "🌅";

    document.getElementById("time").textContent = `${icon} ${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")} · ${period}`;
}

function updateClouds(dt){
    const angle = dt * .0008;
    for(const cloud of cloudGroup.children){
        cloud.position.applyAxisAngle(new THREE.Vector3(0,1,0), angle);
    }
}

let fpsTimer = 0, frames = 0;
function updateStats(dt){
    fpsTimer += dt;
    frames++;
    if(fpsTimer >= .5){
        document.getElementById("fps").textContent = `FPS: ${Math.round(frames/fpsTimer)}`;
        frames = 0;
        fpsTimer = 0;
    }
    document.getElementById("speed").textContent = `Speed: ${Math.abs(playerSpeed).toFixed(1)}`;
    document.getElementById("npc").textContent = `NPC: ${npcs.length}`;
}

// Camera Follow
const desiredCamera = new THREE.Vector3();
const cameraTarget = new THREE.Vector3();

function updateCamera(dt){
    const up = playerNormal.clone();
    const forward = playerForward.clone();

    desiredCamera.copy(player.position);
    desiredCamera.add(forward.multiplyScalar(-CFG.cameraDistance));
    desiredCamera.add(up.multiplyScalar(CFG.cameraHeight));

    const smooth = 1 - Math.exp(-CFG.cameraSmooth * dt);
    camera.position.lerp(desiredCamera, smooth);
    camera.up.copy(up);

    cameraTarget.copy(player.position);
    cameraTarget.add(up.multiplyScalar(CFG.cameraLook));
    cameraTarget.add(playerForward.clone().multiplyScalar(3));
    camera.lookAt(cameraTarget);
}

addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), .05);

    updatePlayer(dt);
    for(const npc of npcs){ updateNPC(npc, dt); }
    updateDayNight(dt);
    updateClouds(dt);
    updateCamera(dt);
    updateStats(dt);

    stars.rotation.y += dt * .001;
    renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
