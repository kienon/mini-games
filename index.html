<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Earth Explorer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #info {
            position: absolute; top: 10px; left: 10px;
            color: white; font-family: sans-serif; font-weight: bold;
            text-shadow: 1px 1px 2px black; pointer-events: none;
        }
    </style>
    <!-- Kita gunakan Three.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="info">Gunakan W, A, S, D atau Arrow Keys untuk berjalan.</div>
    <script>
        // 1. Setup Scene, Camera, & Renderer
        const scene = new THREE.Scene();
        // Langit biru cerah
        scene.background = new THREE.Color(0x87CEEB); 
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Pencahayaan (Lighting)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 3. Planet Group (Bumi dan semua objek di atasnya)
        const planetGroup = new THREE.Group();
        scene.add(planetGroup);

        // Buat Sfera Bumi
        const earthRadius = 15;
        const earthGeo = new THREE.SphereGeometry(earthRadius, 32, 32);
        const earthMat = new THREE.MeshLambertMaterial({ color: 0x228B22 }); // Hijau Rumput
        const earth = new THREE.Mesh(earthGeo, earthMat);
        planetGroup.add(earth);

        // Fungsi letak objek rawak di atas planet
        function addRandomObject(geometry, material) {
            const mesh = new THREE.Mesh(geometry, material);
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = earthRadius;

            mesh.position.set(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );
            mesh.lookAt(0, 0, 0); // Pastikan objek pacak ke tengah bumi
            planetGroup.add(mesh);
        }

        // Tambah Bangunan (Kelabu) & Pokok (Hijau Gelap)
        for(let i = 0; i < 40; i++) {
            const isBuilding = Math.random() > 0.5;
            const geo = isBuilding ? new THREE.BoxGeometry(1.5, 3, 1.5) : new THREE.ConeGeometry(1, 3, 8);
            const mat = new THREE.MeshLambertMaterial({ color: isBuilding ? 0x888888 : 0x006400 });
            addRandomObject(geo, mat);
        }

        // 4. Karakter Pemain (Kotak Merah)
        const playerGeo = new THREE.BoxGeometry(1, 1.5, 1);
        const playerMat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        // Letak pemain betul-betul di kutub utara planet
        player.position.set(0, earthRadius + 0.75, 0); 
        scene.add(player); // Pemain ditambah ke scene, BUKAN planet

        // Posisi Kamera (Dekat sikit di belakang pemain)
        camera.position.set(0, earthRadius + 4, 10);
        camera.lookAt(player.position);

        // 5. Kawalan (Controls)
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // 6. Game Loop (Animasi)
        function animate() {
            requestAnimationFrame(animate);

            // Putarkan planet bila bergerak (simulasi berjalan)
            const speed = 0.02;
            if (keys['w'] || keys['arrowup']) planetGroup.rotation.x -= speed;
            if (keys['s'] || keys['arrowdown']) planetGroup.rotation.x += speed;
            if (keys['a'] || keys['arrowleft']) planetGroup.rotation.z -= speed;
            if (keys['d'] || keys['arrowright']) planetGroup.rotation.z += speed;

            renderer.render(scene, camera);
        }

        // Handle resize screen
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
