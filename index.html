<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tiny World - Fixed Controls</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; }
        #ui { position: absolute; top: 10px; left: 20px; color: white; text-shadow: 2px 2px 2px #000; pointer-events: none; z-index: 10; }
        #ui p { margin: 5px 0; font-size: 14px; color: #ddd; }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); z-index: 5; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Dunia 3D: Fixed Movement</h2>
        <p>PC: W (Jalan Depan), S (Undur), A/D (Pusing Kiri/Kanan) | HP: Joystick</p>
        <p id="status">Status: Sedia Berjalan!</p>
    </div>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. SETUP SCENE
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.003);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(100, 200, 50);
        sun.castShadow = true;
        scene.add(sun);

        const radius = 150; 

        // Bintang
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(5000 * 3);
        for(let i=0; i<5000*3; i++) starPos[i] = (Math.random() - 0.5) * 1000;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.5})));

        // Glob / Tanah
        const earth = new THREE.Mesh(new THREE.SphereGeometry(radius, 128, 128), new THREE.MeshLambertMaterial({color: 0x2e8b57}));
        earth.receiveShadow = true;
        scene.add(earth);

        // 2. SISTEM OBJEK & POSISI DUNIA
        const obstaclePositions = [];

        function placeObject(mesh, lat, lon, isCollidable = false) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            
            mesh.position.set(
                -(radius * Math.sin(phi) * Math.cos(theta)),
                (radius * Math.cos(phi)),
                (radius * Math.sin(phi) * Math.sin(theta))
            );
            
            mesh.lookAt(0, 0, 0);
            mesh.rotateX(Math.PI / 2);
            scene.add(mesh);

            if(isCollidable) {
                obstaclePositions.push(mesh.position.clone());
            }
            return mesh;
        }

        // Bina Bangunan
        for(let i=0; i<60; i++) {
            const bldgGroup = new THREE.Group();
            const w = Math.random() * 4 + 2; const h = Math.random() * 8 + 4; const d = Math.random() * 4 + 2;
            const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({color: 0x8899aa}));
            body.position.y = h/2; body.castShadow = true; body.receiveShadow = true;
            bldgGroup.add(body);
            
            const lat = (Math.random() - 0.5) * 130;
            const lon = (Math.random() - 0.5) * 360;
            placeObject(bldgGroup, lat, lon, true);
        }

        // Bina Pokok
        for(let i=0; i<100; i++) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 3), new THREE.MeshLambertMaterial({color: 0x5c4033}));
            trunk.position.y = 1.5; trunk.castShadow = true;
            const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(2.5), new THREE.MeshLambertMaterial({color: 0x228b22}));
            leaves.position.y = 4; leaves.castShadow = true;
            tree.add(trunk); tree.add(leaves);
            
            const lat = (Math.random() - 0.5) * 140;
            const lon = (Math.random() - 0.5) * 360;
            placeObject(tree, lat, lon, true);
        }

        // 3. WATAK (PLAYER & NPC)
        function createCharacter(color) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.8), new THREE.MeshLambertMaterial({color: color}));
            body.position.y = 0.9; body.castShadow = true;
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), new THREE.MeshLambertMaterial({color: 0xffe4c4}));
            head.position.y = 2.4; head.castShadow = true;
            group.add(body); group.add(head);
            return group;
        }

        // Player Setup (Lat/Lon Sistem)
        const player = createCharacter(0xFF0000);
        scene.add(player);

        let pLat = 0;
        let pLon = 0;
        let pFacingAngle = 0;

        function updatePlayerCoords() {
            const phi = (90 - pLat) * (Math.PI / 180);
            const theta = (pLon + 180) * (Math.PI / 180);

            player.position.set(
                -(radius * Math.sin(phi) * Math.cos(theta)),
                (radius * Math.cos(phi)),
                (radius * Math.sin(phi) * Math.sin(theta))
            );

            player.lookAt(0, 0, 0);
            player.rotateX(Math.PI / 2);
            player.rotateY(pFacingAngle);
        }
        updatePlayerCoords();

        // NPC Perlahan & Merayau
        const npcs = [];
        for(let i=0; i<25; i++) {
            const npcMesh = createCharacter(0x00b0ff);
            let nLat = (Math.random() - 0.5) * 130;
            let nLon = (Math.random() - 0.5) * 360;
            let nAngle = Math.random() * Math.PI * 2;
            
            const phi = (90 - nLat) * (Math.PI / 180);
            const theta = (nLon + 180) * (Math.PI / 180);
            npcMesh.position.set(
                -(radius * Math.sin(phi) * Math.cos(theta)),
                (radius * Math.cos(phi)),
                (radius * Math.sin(phi) * Math.sin(theta))
            );
            npcMesh.lookAt(0, 0, 0);
            npcMesh.rotateX(Math.PI / 2);
            scene.add(npcMesh);

            npcs.push({ mesh: npcMesh, lat: nLat, lon: nLon, angle: nAngle, speed: 0.005 }); // NPC perlahan
        }

        // 4. KAWALAN
        let moveTurn = 0, moveWalk = 0;
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let isDragging = false, center = {x:0, y:0};

        zone.addEventListener('touchstart', e => {
            isDragging = true; center = { x: zone.getBoundingClientRect().left + 60, y: zone.getBoundingClientRect().top + 60 };
            updateJoystick(e.touches[0]);
        });
        zone.addEventListener('touchmove', e => { if(isDragging) updateJoystick(e.touches[0]); });
        zone.addEventListener('touchend', () => {
            isDragging = false; knob.style.transform = `translate(0px, 0px)`;
            moveTurn = 0; moveWalk = 0;
        });

        function updateJoystick(touch) {
            let dx = touch.clientX - center.x; let dy = touch.clientY - center.y;
            const maxDist = 35; const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveTurn = dx / maxDist; moveWalk = dy / maxDist;
        }

        // 5. GAME LOOP
        const uiStatus = document.getElementById('status');

        function animate() {
            requestAnimationFrame(animate);

            // A. UPDATE NPC (Perlahan & Berjalan)
            npcs.forEach(npc => {
                if (Math.random() < 0.02) npc.angle += (Math.random() - 0.5) * 1.0;
                npc.lat += Math.cos(npc.angle) * npc.speed;
                npc.lon += Math.sin(npc.angle) * npc.speed;

                const phi = (90 - npc.lat) * (Math.PI / 180);
                const theta = (npc.lon + 180) * (Math.PI / 180);
                npc.mesh.position.set(
                    -(radius * Math.sin(phi) * Math.cos(theta)),
                    (radius * Math.cos(phi)),
                    (radius * Math.sin(phi) * Math.sin(theta))
                );
                npc.mesh.lookAt(0, 0, 0);
                npc.mesh.rotateX(Math.PI / 2);
            });

            // B. PLAYER INPUT
            let intentTurn = 0;
            let intentWalk = 0;

            if (keys['a']) intentTurn = 1;
            if (keys['d']) intentTurn = -1;
            if (keys['w']) intentWalk = 1;
            if (keys['s']) intentWalk = -1;

            if (isDragging) {
                intentTurn = -moveTurn;
                intentWalk = -moveWalk;
            }

            if (intentTurn !== 0) {
                pFacingAngle += intentTurn * 0.04; // Pusing arah perlahan & selesa
            }

            if (intentWalk !== 0) {
                const walkSpeed = 0.08 * intentWalk; // Kelajuan player dikawal elok
                const prevLat = pLat;
                const prevLon = pLon;

                pLat += Math.cos(pFacingAngle) * walkSpeed;
                pLon += Math.sin(pFacingAngle) * walkSpeed;
                updatePlayerCoords();

                // C. COLLISION CHECK
                let isHit = false;
                for(let bPos of obstaclePositions) {
                    if (player.position.distanceTo(bPos) < 3.0) {
                        isHit = true; break;
                    }
                }

                if (isHit) {
                    pLat = prevLat;
                    pLon = prevLon;
                    updatePlayerCoords();
                    uiStatus.innerText = "Status: Terlanggar Dinding!";
                    uiStatus.style.color = "#ff4444";
                } else {
                    uiStatus.innerText = "Status: Berjalan Cergas!";
                    uiStatus.style.color = "#69f0ae";
                }
            } else {
                uiStatus.innerText = "Status: Berhenti";
                uiStatus.style.color = "#ddd";
            }

            // D. KAMERA STABIL MENGEKOR DI BELAKANG PLAYER
            const worldUp = player.position.clone().normalize();
            const backVector = new THREE.Vector3(-Math.sin(pFacingAngle), 0, -Math.cos(pFacingAngle));

            const idealCamPos = player.position.clone()
                .add(worldUp.clone().multiplyScalar(5))  // Ketinggian kamera
                .add(backVector.multiplyScalar(-12));    // Jarak ke belakang

            camera.position.lerp(idealCamPos, 0.1);
            
            const lookTarget = player.position.clone().add(worldUp.clone().multiplyScalar(1.5));
            camera.lookAt(lookTarget);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
