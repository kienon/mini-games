<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Model Loader Test</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        #info { 
            position: absolute; top: 10px; width: 100%; text-align: center; 
            color: black; font-family: sans-serif; font-weight: bold; 
            background: rgba(255,255,255,0.7); padding: 10px 0; pointer-events: none; 
        }
    </style>
</head>
<body>
    <div id="info">Memuatkan Model 3D... Sila tunggu sekejap.</div>
    
    <!-- ES Module Shims untuk sokongan browser -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    
    <!-- Import Map untuk panggil Three.js dan Loader -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. Setup Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Kawalan Kamera (Boleh drag guna mouse/skrin sentuh)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1, 0);

        // 2. Pencahayaan
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        // 3. Lantai
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(50, 50),
            new THREE.MeshLambertMaterial({ color: 0x4CAF50 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 4. LOAD MODEL 3D (.glb / .gltf)
        const loader = new GLTFLoader();
        
        // Nanti kau boleh tukar link ni dengan link fail .glb kau sendiri dalam GitHub
        const modelUrl = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb';

        loader.load(
            modelUrl,
            function (gltf) {
                const model = gltf.scene;
                scene.add(model);
                document.getElementById('info').innerText = "Berjaya! Cuba drag/swipe skrin untuk tengok sekeliling.";
            },
            function (xhr) {
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            function (error) {
                console.error('Error memuatkan model:', error);
                document.getElementById('info').innerText = "Ralat: Gagal memuatkan model 3D.";
            }
        );

        // 5. Game Loop & Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
