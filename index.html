<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tiny World - Ultimate Spherical Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; }
        #ui { position: absolute; top: 15px; left: 20px; color: white; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; }
        #ui h2 { margin: 0 0 5px 0; font-size: 20px; color: #00e676; }
        #ui p { margin: 3px 0; font-size: 13px; color: #f5f5f5; }
        #joystick-zone { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; background: rgba(255,255,255,0.15); border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); z-index: 5; }
        #joystick-knob { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(255,255,255,0.9); border-radius: 50%; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Tiny World: Pro Edition</h2>
        <p>PC: W/S (Maju/Undur) | A/D (Pusing)</p>
        <p id="status">Status: Ready</p>
    </div>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. SETUP ASAS
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020208);
        scene.fog = new THREE.FogExp2(0x020208, 0.002);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
        sunLight.position.set(200, 300, 150);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const PLANET_RADIUS = 150;

        // 2. BINTANG & BUMI
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(6000 * 3);
        for(let i=0; i<18000; i++) starPos[i] = (Math.random() - 0.5) * 1200;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.2})));

        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(PLANET_RADIUS, 128, 128),
            new THREE.MeshLambertMaterial({color: 0x2e8b57})
        );
        earth.receiveShadow = true;
        scene.add(earth);

        // 3. OBJEK & OBSTACLE MAPPING
        const obstacles = [];

        function spawnOnPlanet(mesh, lat, lon, isSolid = false) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            mesh.position.x = -(PLANET_RADIUS * Math.sin(phi) * Math.cos(theta));
            mesh.position.z = (PLANET_RADIUS * Math.sin(phi) * Math.sin(theta));
            mesh.position.y = (PLANET_RADIUS * Math.cos(phi));

            mesh.lookAt(0, 0, 0);
            mesh.rotateX(Math.PI / 2);
            scene.add(mesh);

            if (isSolid) {
                obstacles.push({ pos: mesh.position.clone(), radius: 3.5 });
            }
        }

        // Jana Bangunan
        for (let i = 0; i < 45; i++) {
            const bldg = new THREE.Group();
            const w = 3.5, h = 7, d = 3.5;
            const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({color: 0x78909c}));
            body.position.y = h/2; body.castShadow = true; body.receiveShadow = true;
            bldg.add(body);
            spawnOnPlanet(bldg, (Math.random() - 0.5) * 120, (Math.random() - 0.5) * 360, true);
        }

        // Jana Pokok
        for (let i = 0; i < 70; i++) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3), new THREE.MeshLambertMaterial({color: 0x5c4033}));
            trunk.position.y = 1.5; trunk.castShadow = true;
            const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(2.2), new THREE.MeshLambertMaterial({color: 0x1b5e20}));
            leaves.position.y = 3.8; leaves.castShadow = true;
            tree.add(trunk, leaves);
            spawnOnPlanet(tree, (Math.random() - 0.5) * 135, (Math.random() - 0.5) * 360, true);
        }

        // 4. PEMBINAAN WATAK
        function createCharacter(colorHex) {
            const group = new THREE.Group();
            const torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.6), new THREE.MeshLambertMaterial({color: colorHex}));
            torso.position.y = 0.75; torso.castShadow = true;
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), new THREE.MeshLambertMaterial({color: 0xffccbc}));
            head.position.y = 1.95; head.castShadow = true;
            group.add(torso, head);
            return group;
        }

        const player = createCharacter(0xff1744);
        scene.add(player);

        // Posisi Lat/Lon Player
        let pLat = 0;
        let pLon = 0;
        let pHeading = 0; // Sudut arah hadap player

        function updatePlayerGeo() {
            const phi = (90 - pLat) * (Math.PI / 180);
            const theta = (pLon + 180) * (Math.PI / 180);

            player.position.x = -(PLANET_RADIUS * Math.sin(phi) * Math.cos(theta));
            player.position.z = (PLANET_RADIUS * Math.sin(phi) * Math.sin(theta));
            player.position.y = (PLANET_RADIUS * Math.cos(phi));

            player.lookAt(0, 0, 0);
            player.rotateX(Math.PI / 2);
            player.rotateY(pHeading);
        }
        updatePlayerGeo();

        // NPC Merayau
        const npcs = [];
        for (let i = 0; i < 20; i++) {
            const npcMesh = createCharacter(0x2962ff);
            let nLat = (Math.random() - 0.5) * 120;
            let nLon = (Math.random() - 0.5) * 360;
            let nAngle = Math.random() * Math.PI * 2;
            
            const phi = (90 - nLat) * (Math.PI / 180);
            const theta = (nLon + 180) * (Math.PI / 180);
            npcMesh.position.set(
                -(PLANET_RADIUS * Math.sin(phi) * Math.cos(theta)),
                (PLANET_RADIUS * Math.cos(phi)),
                (PLANET_RADIUS * Math.sin(phi) * Math.sin(theta))
            );
            scene.add(npcMesh);
            npcs.push({ mesh: npcMesh, lat: nLat, lon: nLon, angle: nAngle, speed: 0.012 });
        }

        // 5. KAWALAN (KEYBOARD & JOYSTICK)
        let turnInput = 0;
        let walkInput = 0;
        const keys = {};

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let isDragging = false;
        let center = { x: 0, y: 0 };

        zone.addEventListener('touchstart', e => {
            isDragging = true;
            const rect = zone.getBoundingClientRect();
            center = { x: rect.left + 65, y: rect.top + 65 };
            handleTouch(e.touches[0]);
        });
        zone.addEventListener('touchmove', e => { if (isDragging) handleTouch(e.touches[0]); });
        zone.addEventListener('touchend', () => {
            isDragging = false;
            knob.style.transform = `translate(0px, 0px)`;
            turnInput = 0; walkInput = 0;
        });

        function handleTouch(touch) {
            let dx = touch.clientX - center.x;
            let dy = touch.clientY - center.y;
            const maxDist = 40;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            turnInput = -dx / maxDist;
            walkInput = -dy / maxDist;
        }

        // 6. GAME LOOP
        const statusEl = document.getElementById('status');

        function animate() {
            requestAnimationFrame(animate);

            let targetTurn = 0;
            let targetWalk = 0;

            if (keys['a']) targetTurn = 1;
            if (keys['d']) targetTurn = -1;
            if (keys['w']) targetWalk = 1;
            if (keys['s']) targetWalk = -1;

            if (isDragging) {
                targetTurn = turnInput;
                targetWalk = walkInput;
            }

            if (targetTurn !== 0) {
                pHeading += targetTurn * 0.045;
            }

            if (targetWalk !== 0) {
                const moveStep = 0.14 * targetWalk;
                const prevLat = pLat;
                const prevLon = pLon;

                // Pergerakan Lat/Lon bersandarkan arah hadap player
                pLat += Math.cos(pHeading) * moveStep;
                pLon += Math.sin(pHeading) * moveStep;
                updatePlayerGeo();

                // Collision Check
                let hit = false;
                for (let obs of obstacles) {
                    if (player.position.distanceTo(obs.pos) < obs.radius) {
                        hit = true; break;
                    }
                }

                if (hit) {
                    pLat = prevLat; pLon = prevLon;
                    updatePlayerGeo();
                    statusEl.innerText = "Status: Langgar Dinding!";
                    statusEl.style.color = "#ff5252";
                } else {
                    statusEl.innerText = "Status: Berjalan";
                    statusEl.style.color = "#69f0ae";
                }
            } else {
                statusEl.innerText = "Status: Berhenti";
                statusEl.style.color = "#f5f5f5";
            }

            // Update NPC
            npcs.forEach(n => {
                if (Math.random() < 0.02) n.angle += (Math.random() - 0.5) * 1.2;
                n.lat += Math.cos(n.angle) * n.speed;
                n.lon += Math.sin(n.angle) * n.speed;

                const phi = (90 - n.lat) * (Math.PI / 180);
                const theta = (n.lon + 180) * (Math.PI / 180);
                n.mesh.position.set(
                    -(PLANET_RADIUS * Math.sin(phi) * Math.cos(theta)),
                    (PLANET_RADIUS * Math.cos(phi)),
                    (PLANET_RADIUS * Math.sin(phi) * Math.sin(theta))
                );
                n.mesh.lookAt(0, 0, 0);
                n.mesh.rotateX(Math.PI / 2);
            });

            // Kamera Belakang Player (Smooth Follow)
            const worldUp = player.position.clone().normalize();
            const backDir = new THREE.Vector3(-Math.sin(pHeading), 0, -Math.cos(pHeading));

            const idealCamPos = player.position.clone()
                .add(worldUp.clone().multiplyScalar(5.5))
                .add(backDir.multiplyScalar(-14));

            camera.position.lerp(idealCamPos, 0.12);
            const lookTarget = player.position.clone().add(worldUp.clone().multiplyScalar(2));
            camera.lookAt(lookTarget);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
